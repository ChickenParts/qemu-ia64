name: Temporary IA-64 GXB sparse-config validation

on:
  push:
    branches:
      - stage/ia64-gxb-config
    paths:
      - scratch/ia64-gxb-config.patch
      - .github/workflows/agent-ia64-gxb-config.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_COMMIT: bbdba45d7d51290ba844024998a65a34b27453db
      OUTPUT_BRANCH: fix/ia64-gxb-config
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and review the exact source change
        shell: bash
        run: |
          set -euo pipefail
          cp scratch/ia64-gxb-config.patch /tmp/ia64-gxb-config.patch
          sha256sum /tmp/ia64-gxb-config.patch \
            > /tmp/ia64-gxb-config-input-sha256.txt

          git checkout --detach "$BASE_COMMIT"
          git apply --check /tmp/ia64-gxb-config.patch
          git apply /tmp/ia64-gxb-config.patch

          git add hw/ia64/ipf.c tests/qtest/ia64-ipf-test.c
          git diff --cached --check
          git diff --cached > /tmp/ia64-gxb-config-full.patch
          perl scripts/checkpatch.pl --no-signoff \
            /tmp/ia64-gxb-config-full.patch

      - name: Upload exact patch-applied source for review
        uses: actions/upload-artifact@v4
        with:
          name: ia64-gxb-config-source-${{ github.run_id }}
          path: |
            /tmp/ia64-gxb-config-input-sha256.txt
            /tmp/ia64-gxb-config-full.patch
            hw/ia64/ipf.c
            tests/qtest/ia64-ipf-test.c
          retention-days: 1
          if-no-files-found: error

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev libslirp-dev

      - name: Configure IA-64 system emulator
        run: |
          ./configure \
            --target-list=ia64-softmmu \
            --disable-werror \
            --disable-docs \
            --disable-gtk \
            --disable-sdl

      - name: Build IA-64 and focused platform tests
        run: |
          ninja -C build \
            qemu-system-ia64 \
            tests/unit/test-ia64-interrupt \
            tests/unit/test-ia64-iosapic \
            tests/qtest/ia64-ipf-test

      - name: Run architectural and sparse-config contracts
        shell: bash
        run: |
          set -euo pipefail
          build/tests/unit/test-ia64-interrupt --tap -k \
            | tee /tmp/test-ia64-interrupt.tap
          build/tests/unit/test-ia64-iosapic --tap -k \
            | tee /tmp/test-ia64-iosapic.tap
          QTEST_QEMU_BINARY=./build/qemu-system-ia64 \
            build/tests/qtest/ia64-ipf-test --tap -k \
            | tee /tmp/ia64-ipf-test.tap

      - name: Basic executable smoke checks
        shell: bash
        run: |
          set -euo pipefail
          build/qemu-system-ia64 --version
          build/qemu-system-ia64 -machine help | grep -q '^ipf '

      - name: Publish one clean tested source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git diff --cached --check
          git commit \
            -m 'hw/ia64: expose 460GX GXB firmware functions' \
            -m 'Populate the sparse firmware PCI configuration façade for GXB functions 1 and 2 with immutable Intel identities, revision 4, and host-bridge class data. Preserve the real QOM device at function 0 and test bus-0 forwarding, CSE access, absent functions, and read-only identity without firmware-specific behavior.'
          git push --force origin "HEAD:refs/heads/$OUTPUT_BRANCH"
          git rev-parse HEAD | tee /tmp/ia64-gxb-config-commit.txt

      - name: Upload tested commit identity and contract output
        uses: actions/upload-artifact@v4
        with:
          name: ia64-gxb-config-result
          path: |
            /tmp/ia64-gxb-config-commit.txt
            /tmp/test-ia64-interrupt.tap
            /tmp/test-ia64-iosapic.tap
            /tmp/ia64-ipf-test.tap
          retention-days: 1
          if-no-files-found: error
