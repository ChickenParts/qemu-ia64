name: IA-64 Xen PEI HOB relocation source validation

on:
  push:
    branches:
      - fix/ia64-xen-pei-hob-relocation
    paths:
      - .github/workflows/ia64-xen-pei-hob-relocation.yml
      - scratch/ia64-xen-pei-hob-relocation.patch
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ia64-xen-pei-hob-relocation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/ia64-xen-pei-hob-relocation
          fetch-depth: 0

      - name: Apply retained Xen PEI relocation correction
        shell: bash
        run: |
          set -euo pipefail
          patch --dry-run -p1 < scratch/ia64-xen-pei-hob-relocation.patch
          patch -p1 < scratch/ia64-xen-pei-hob-relocation.patch
          git diff --check
          grep -Fq \
            'uint64_t new_base = (new_phys != base_phys) ? new_phys : base_raw;' \
            target/ia64/helper.c
          grep -Fq \
            'stq_le_p(&phit[24], ia64_fw_encode_addr(mem_bottom_raw, hob_base));' \
            target/ia64/helper.c

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev libslirp-dev

      - name: Configure and build IA-64 system emulator
        run: |
          ./configure \
            --target-list=ia64-softmmu \
            --disable-werror \
            --disable-docs \
            --disable-gtk \
            --disable-sdl
          ninja -C build qemu-system-ia64
          test -x build/qemu-system-ia64

      - name: Publish validated source implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/reviews
          cat > docs/reviews/2026-08-22_xen_pei_hob_relocation.md <<EOF
          # Xen/IPF PEI HOB relocation correction

          Date: 2026-08-22
          Integration target: \`metachicken\`
          Source-validation workflow run: ${{ github.run_id }}

          ## Corrected contract

          Xen's out-of-range PEI-memory request is relocated into normal low
          physical RAM without retaining the source firmware address's stale
          sign-extension or region tag. The redirected PHIT now publishes the
          actual HOB-list base in \`EfiMemoryBottom\`, and the free-bottom
          fallback uses that same base.

          Legacy IPF PEI computes the permanent-memory HOB copy span from
          \`EfiMemoryBottom\` and \`EfiFreeMemoryBottom\`. Publishing the
          temporary-memory base inflated that span, stranded the real end
          marker, and later caused the DXE IPL loader to consume a malformed
          list.

          ## Validation

          This workflow applied the retained patch to commit
          \`${{ github.sha }}\`, configured the IA-64 system target, and built
          \`qemu-system-ia64\` successfully on Ubuntu 24.04.

          Runtime validation was performed separately with the retained Xen/IPF
          \`Flash.fd\` whose SHA-256 is
          \`e143e85874ad57bad631853d48f0d47b7e7dbe6c41b4e558bbb4ea5b45775513\`.
          With the existing bounded system-memory resource-HOB repair enabled,
          the corrected relocation clears the former \`DxeLoad.c:536\` and
          \`Gcd.c:1736\` frontiers and reaches DXE memory-service
          initialization. The next observed boundary is the already-instrumented
          null DXE indirect-call contract and is intentionally handled in a
          separate feature tranche.

          The historical Xen firmware downloader is not part of this source
          acceptance gate because its upstream Mercurial endpoint is no longer
          reliably available. The firmware hash above remains the canonical
          runtime-test identity.
          EOF

          git rm -- \
            scratch/ia64-xen-pei-hob-relocation.patch \
            .github/workflows/ia64-xen-pei-hob-relocation.yml
          git add target/ia64/helper.c \
            docs/reviews/2026-08-22_xen_pei_hob_relocation.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ia64: repair Xen PEI HOB relocation [skip ci]'
          git push origin HEAD:fix/ia64-xen-pei-hob-relocation
