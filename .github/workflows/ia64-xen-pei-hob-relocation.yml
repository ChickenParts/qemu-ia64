name: IA-64 Xen PEI HOB relocation validation

on:
  push:
    branches:
      - fix/ia64-xen-pei-hob-relocation
    paths:
      - .github/workflows/ia64-xen-pei-hob-relocation.yml
      - scratch/ia64-xen-pei-hob-relocation.patch
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ia64-xen-pei-hob-relocation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-build-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/ia64-xen-pei-hob-relocation
          fetch-depth: 0

      - name: Apply, build, and exercise Xen firmware
        id: validate
        shell: bash
        run: |
          set -uo pipefail
          out=scratch/ci-xen-hob-validation
          firmware=scratch/ci-xen-firmware/Flash.fd
          mkdir -p "$out"
          exec > >(tee -a "$out/workflow.log") 2>&1

          result=failed
          phase=initialization
          runner_rc=not-run

          finish() {
            rc=$?
            trap - EXIT
            serial="$(find "$out" -maxdepth 1 -type f \
                      -name 'serial.fw.*.log' -print 2>/dev/null | sort | tail -n 1)"
            qlog="$out/qemu.fw.log"
            serial_bytes=0
            qlog_bytes=0
            dxe_entries=0
            memory_service_entries=0
            dxe_load_asserts=0
            gcd_asserts=0
            total_asserts=0
            sysmem_insertions=0
            host_aborts=0
            if [[ -n "$serial" && -f "$serial" ]]; then
              serial_bytes="$(stat -c '%s' "$serial")"
              dxe_entries="$(grep -ac 'DXE Core Entry' "$serial" || true)"
              memory_service_entries="$(grep -ac 'CoreInitializeMemoryServices' "$serial" || true)"
              dxe_load_asserts="$(grep -ac 'DxeLoad.c Line 536' "$serial" || true)"
              gcd_asserts="$(grep -ac 'Gcd.c Line 1736' "$serial" || true)"
              total_asserts="$(grep -ac 'ASSERT' "$serial" || true)"
              tail -n 240 "$serial" > "$out/serial-tail.log" || true
            fi
            if [[ -f "$qlog" ]]; then
              qlog_bytes="$(stat -c '%s' "$qlog")"
              sysmem_insertions="$(grep -ac 'hob_patch: inserted .* sysmem resource HOB' "$qlog" || true)"
              grep -aE \
                'fw_pei_hob_init_fix|fw_pei_phit_temp_fix|hob_patch: inserted|efi_hob_res|DXE|GCD|ASSERT|null pc|null branch' \
                "$qlog" > "$out/key-qemu-markers.log" || true
            fi
            if [[ -f "$out/runner.log" ]]; then
              host_aborts="$(grep -acE 'Segmentation fault|Aborted|assertion .* failed' "$out/runner.log" || true)"
            fi
            firmware_sha=missing
            if [[ -f "$firmware" ]]; then
              firmware_sha="$(sha256sum "$firmware" | awk '{print $1}')"
            fi
            cat > "$out/outcome.env" <<EOF
          result=$result
          failed_phase=$phase
          shell_rc=$rc
          runner_rc=$runner_rc
          firmware_sha256=$firmware_sha
          serial_bytes=$serial_bytes
          qlog_bytes=$qlog_bytes
          sysmem_insertions=$sysmem_insertions
          dxe_core_entries=$dxe_entries
          memory_service_entries=$memory_service_entries
          dxe_load_asserts=$dxe_load_asserts
          gcd_asserts=$gcd_asserts
          total_asserts=$total_asserts
          host_aborts=$host_aborts
          EOF
            cat "$out/outcome.env"
            exit 0
          }
          trap finish EXIT
          set -e

          phase=apply-patch
          patch --dry-run -p1 < scratch/ia64-xen-pei-hob-relocation.patch
          patch -p1 < scratch/ia64-xen-pei-hob-relocation.patch
          git diff --check
          grep -Fq 'uint64_t new_base = (new_phys != base_phys) ? new_phys : base_raw;' \
            target/ia64/helper.c
          grep -Fq 'mem_bottom_raw, hob_base' target/ia64/helper.c

          phase=install-dependencies
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev libslirp-dev mercurial

          phase=build
          ./configure \
            --target-list=ia64-softmmu \
            --disable-werror \
            --disable-docs \
            --disable-gtk \
            --disable-sdl
          ninja -C build qemu-system-ia64

          phase=fetch-firmware
          chmod +x scripts/fetch-ia64-xen-firmware.sh
          scripts/fetch-ia64-xen-firmware.sh scratch/ci-xen-firmware
          test "$(sha256sum "$firmware" | awk '{print $1}')" = \
            e143e85874ad57bad631853d48f0d47b7e7dbe6c41b4e558bbb4ea5b45775513

          phase=run-firmware
          set +e
          IA64_BIOS="$PWD/$firmware" \
          IA64_LOGDIR="$PWD/$out" \
          IA64_GUEST_ERRORS=1 \
          IA64_EFI_HOB_PATCH=1 \
          IA64_EFI_HOB_PATCH_TRACE=1 \
          IA64_PEI_22560_STATUS_FIX=1 \
          IA64_PEI_279D0_TRACE=1 \
          IA64_PEI_279D0_STATUS_FIX=1 \
          IA64_PEI_279D0_SAFE_MODE=0 \
          IA64_DXE_ASSERT_SCAN_TRACE=1 \
          IA64_DXE_ASSERT_CONTEXT_TRACE=1 \
          timeout --signal=TERM --kill-after=5s 90s \
            scripts/run-ia64-firmware.sh -- -L "$PWD/pc-bios" \
            >"$out/runner.log" 2>&1
          runner_rc=$?
          set -e

          phase=acceptance
          serial="$(find "$out" -maxdepth 1 -type f \
                    -name 'serial.fw.*.log' -print | sort | tail -n 1)"
          qlog="$out/qemu.fw.log"
          test -n "$serial"
          test -s "$serial"
          test -s "$qlog"
          grep -aFq 'hob_patch: inserted 1 sysmem resource HOB' "$qlog"
          grep -aEq 'DXE Core Entry|CoreInitializeMemoryServices' "$serial"
          ! grep -aFq 'DxeLoad.c Line 536' "$serial"
          ! grep -aFq 'Gcd.c Line 1736' "$serial"
          ! grep -aEq 'Segmentation fault|Aborted|assertion .* failed' "$out/runner.log"
          test "$runner_rc" -eq 124 -o "$runner_rc" -eq 0

          phase=complete
          result=passed

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia64-xen-pei-hob-relocation-${{ github.run_id }}
          path: |
            scratch/ci-xen-firmware/PROVENANCE.txt
            scratch/ci-xen-hob-validation/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish validation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out=scratch/ci-xen-hob-validation
          outcome="$out/outcome.env"
          mkdir -p docs/reviews
          if [[ ! -f "$outcome" ]]; then
            cat > "$outcome" <<EOF
          result=failed
          failed_phase=workflow-infrastructure
          shell_rc=missing
          runner_rc=not-run
          EOF
          fi
          # shellcheck disable=SC1090
          source "$outcome"
          report=docs/reviews/2026-08-22_xen_pei_hob_validation_status.md
          cat > "$report" <<EOF
          # Xen/IPF PEI HOB relocation validation

          Workflow run: ${{ github.run_id }}
          Trigger commit: ${{ github.sha }}
          Result: **$result**
          Last phase: \`$failed_phase\`

          \`\`\`text
          $(cat "$outcome")
          \`\`\`

          The acceptance gate is intentionally limited to the relocation
          contract: Xen must pass \`DxeLoad.c:536\`, enter DXE memory-service
          initialization, and avoid the prior \`Gcd.c:1736\` failure. A later
          firmware assertion is retained as the next investigation frontier.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ "$result" == passed ]]; then
            git rm -- \
              scratch/ia64-xen-pei-hob-relocation.patch \
              .github/workflows/ia64-xen-pei-hob-relocation.yml
            git add target/ia64/helper.c "$report"
            git diff --cached --check
            git commit -m 'ia64: repair Xen PEI HOB relocation [skip ci]'
          else
            git add "$report"
            git diff --cached --check
            git commit -m 'ci: record Xen PEI HOB validation failure [skip ci]'
          fi
          git push origin HEAD:fix/ia64-xen-pei-hob-relocation
