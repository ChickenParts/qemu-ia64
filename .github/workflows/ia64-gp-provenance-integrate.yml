name: IA-64 GP provenance integration

on:
  push:
    branches:
      - ia64-rooster-bringup
    paths:
      - .github/workflows/ia64-gp-provenance-integrate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ia64-gp-provenance-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact integration branch
        uses: actions/checkout@v4
        with:
          ref: ia64-rooster-bringup
          fetch-depth: 0

      - name: Apply exact GP provenance patch
        shell: bash
        run: |
          set -euo pipefail
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p validation
          cp .github/patches/ia64-gp-provenance.patch \
            validation/ia64-gp-provenance.patch
          git apply --check validation/ia64-gp-provenance.patch
          git apply validation/ia64-gp-provenance.patch
          git rm \
            .github/patches/ia64-gp-provenance.patch \
            .github/workflows/ia64-gp-provenance-integrate.yml

      - name: Validate source and patch style
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ./scripts/checkpatch.pl --strict --no-signoff --color=never \
            validation/ia64-gp-provenance.patch \
            2>&1 | tee validation/checkpatch.txt
          python3 scripts/check-ia64-rooster-branch.py \
            2>&1 | tee validation/contract.txt
          python3 -m py_compile scripts/check-ia64-rooster-branch.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config python3 \
            libglib2.0-dev libpixman-1-dev libslirp-dev zlib1g-dev

      - name: Build qemu-system-ia64
        shell: bash
        run: |
          set -euo pipefail
          ./configure \
            --target-list=ia64-softmmu \
            --disable-docs --disable-gtk --disable-sdl --disable-werror \
            2>&1 | tee validation/configure.txt
          ninja -C build qemu-system-ia64 \
            2>&1 | tee validation/build.txt
          build/qemu-system-ia64 --version \
            2>&1 | tee validation/version.txt

      - name: Commit validated tracer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            target/ia64/helper.h \
            target/ia64/helper.c \
            target/ia64/translate.c \
            docs/ia64-environment-variables.md \
            scripts/check-ia64-rooster-branch.py
          git commit -m 'target/ia64: trace global-pointer provenance'
          head_sha=$(git rev-parse HEAD)
          {
            echo "base=$BASE_SHA"
            echo "head=$head_sha"
          } | tee validation/summary.txt
          git fetch origin ia64-rooster-bringup
          test "$(git rev-parse origin/ia64-rooster-bringup)" = "$BASE_SHA"
          git push origin HEAD:ia64-rooster-bringup

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia64-gp-provenance-${{ github.run_id }}
          path: validation/
          retention-days: 14
          if-no-files-found: error
