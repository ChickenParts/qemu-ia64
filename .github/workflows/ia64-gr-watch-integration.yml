name: Temporary IA-64 GR provenance integration

on:
  push:
    branches:
      - ia64-rooster-bringup
    paths:
      - .github/workflows/ia64-gr-watch-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact bring-up branch
        uses: actions/checkout@v4
        with:
          ref: ia64-rooster-bringup
          fetch-depth: 0

      - name: Apply narrowly gated general-register provenance tracing
        shell: bash
        run: |
          set -euo pipefail
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p validation
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              source_path = Path(path)
              source = source_path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one anchor, found {count}: {old[:80]!r}")
              source_path.write_text(source.replace(old, new, 1))

          replace_once(
              "target/ia64/helper.h",
              "DEF_HELPER_2(dbg_call, void, env, i64)\n",
              "DEF_HELPER_2(dbg_call, void, env, i64)\n"
              "DEF_HELPER_5(dbg_gr_watch, void, env, i64, i32, i32, i64)\n",
          )

          replace_once(
              "target/ia64/translate.c",
              '#include "qemu/log.h"\n',
              '#include "qemu/log.h"\n#include "qemu/cutils.h"\n',
          )

          replace_once(
              "target/ia64/translate.c",
              """static bool ia64_load_watch_range_inited;
          static bool ia64_load_watch_range_enabled;
          static uint64_t ia64_load_watch_range_lo;
          static uint64_t ia64_load_watch_range_hi;
          """,
              """static bool ia64_load_watch_range_inited;
          static bool ia64_load_watch_range_enabled;
          static uint64_t ia64_load_watch_range_lo;
          static uint64_t ia64_load_watch_range_hi;

          /*
           * Narrow general-register provenance tracing for firmware bring-up.
           *
           * This is intentionally translation-time gated: unless
           * QEMU_IA64_GR_WATCH is set, no helper calls are emitted. PC limits
           * use physical/low-61-bit addresses so one setting covers raw and
           * region-encoded firmware PCs.
           */
          static bool ia64_gr_watch_inited;
          static int ia64_gr_watch_reg = -1;
          static uint64_t ia64_gr_watch_min_pc;
          static uint64_t ia64_gr_watch_max_pc = UINT64_MAX;

          static void ia64_init_gr_watch(void)
          {
              const char *s;
              const char *endp = NULL;
              long reg;
              uint64_t value;

              if (ia64_gr_watch_inited) {
                  return;
              }
              ia64_gr_watch_inited = true;

              s = getenv("QEMU_IA64_GR_WATCH");
              if (!s || !*s) {
                  return;
              }
              if (qemu_strtol(s, &endp, 0, &reg) < 0 || endp == s || *endp ||
                  reg < 0 || reg >= 128) {
                  return;
              }
              ia64_gr_watch_reg = reg;

              s = getenv("QEMU_IA64_GR_WATCH_MIN_PC");
              if (s && *s && qemu_strtou64(s, NULL, 0, &value) == 0) {
                  ia64_gr_watch_min_pc = value & ((1ULL << 61) - 1);
              }
              s = getenv("QEMU_IA64_GR_WATCH_MAX_PC");
              if (s && *s && qemu_strtou64(s, NULL, 0, &value) == 0) {
                  ia64_gr_watch_max_pc = value & ((1ULL << 61) - 1);
              }
          }

          static bool ia64_gr_watch_match(uint64_t pc)
          {
              uint64_t low_pc;

              ia64_init_gr_watch();
              if (ia64_gr_watch_reg < 0) {
                  return false;
              }
              low_pc = pc & ((1ULL << 61) - 1);
              return low_pc >= ia64_gr_watch_min_pc &&
                     low_pc <= ia64_gr_watch_max_pc;
          }
          """,
          )

          replace_once(
              "target/ia64/translate.c",
              """    decode_insn(ctx, insn, type);

              if (ctx->base.is_jmp == DISAS_NEXT &&
          """,
              """    decode_insn(ctx, insn, type);

              if (ctx->base.is_jmp == DISAS_NEXT &&
                  ia64_gr_watch_match(ctx->base.pc_next)) {
                  gen_helper_dbg_gr_watch(tcg_env,
                                          tcg_constant_i64(ctx->base.pc_next),
                                          tcg_constant_i32(ctx->ri),
                                          tcg_constant_i32(ia64_gr_watch_reg),
                                          tcg_constant_i64(insn));
              }

              if (ctx->base.is_jmp == DISAS_NEXT &&
          """,
          )

          replace_once(
              "target/ia64/helper.c",
              """static uint64_t ia64_dbg_next_call_pc;

          void HELPER(dbg_call)(CPUIA64State *env, uint64_t pc)
          """,
              """static uint64_t ia64_dbg_next_call_pc;

          void HELPER(dbg_gr_watch)(CPUIA64State *env, uint64_t pc, uint32_t ri,
                                    uint32_t reg, uint64_t insn)
          {
              if (reg >= ARRAY_SIZE(env->r)) {
                  return;
              }
              qemu_log_mask(LOG_GUEST_ERROR,
                            "gr_watch pc=%016" PRIx64 " ri=%u insn=%011" PRIx64
                            " r%u=%016" PRIx64 " b7=%016" PRIx64
                            " cfm=%016" PRIx64 " bsp=%016" PRIx64 "\\n",
                            pc, ri, insn, reg, env->r[reg], env->b[7],
                            env->cfm, env->ar[IA64_AR_BSP]);
          }

          void HELPER(dbg_call)(CPUIA64State *env, uint64_t pc)
          """,
          )

          replace_once(
              "target/ia64/helper.c",
              """    if (pc == 0xa0000001000665c0ULL) {
          """,
              """    if (ia64_phys_mode_addr(pc & ~0xFULL) ==
                  0x000000001ff4f520ULL) {
                  qemu_log_mask(LOG_GUEST_ERROR,
                                "dbg_call_b7 pc=%016" PRIx64
                                " b7=%016" PRIx64 " r30=%016" PRIx64
                                " r31=%016" PRIx64 " r14=%016" PRIx64
                                " last={pc=%016" PRIx64 " kind=%s aux=%" PRIu64
                                " old=%016" PRIx64 " val=%016" PRIx64 "}"
                                " prev={pc=%016" PRIx64 " kind=%s aux=%" PRIu64
                                " old=%016" PRIx64 " val=%016" PRIx64 "}\\n",
                                pc, env->b[7], env->r[30], env->r[31], env->r[14],
                                env->last_b7_write_pc,
                                ia64_fw_b7_kind_name(env->last_b7_write_kind),
                                env->last_b7_write_aux,
                                env->last_b7_write_old, env->last_b7_write_val,
                                env->prev_b7_write_pc,
                                ia64_fw_b7_kind_name(env->prev_b7_write_kind),
                                env->prev_b7_write_aux,
                                env->prev_b7_write_old, env->prev_b7_write_val);
              }

              if (pc == 0xa0000001000665c0ULL) {
          """,
          )
          PY

          git diff --check
          git diff --binary > validation/ia64-gr-watch.patch
          ./scripts/checkpatch.pl --strict --no-signoff --color=never \
            validation/ia64-gr-watch.patch \
            2>&1 | tee validation/checkpatch.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libglib2.0-dev libpixman-1-dev \
            ninja-build pkg-config python3 python3-venv zlib1g-dev

      - name: Configure and build IA-64 system emulator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-gr-watch
          mkdir build-gr-watch
          (
            cd build-gr-watch
            ../configure \
              --target-list=ia64-softmmu \
              --disable-docs \
              --disable-gtk \
              --disable-sdl \
              --disable-vnc \
              --disable-werror
          ) 2>&1 | tee validation/configure.txt
          ninja -C build-gr-watch -j"$(nproc)" qemu-system-ia64 \
            2>&1 | tee validation/build.txt
          build-gr-watch/qemu-system-ia64 --version \
            | tee validation/version.txt

      - name: Commit validated tracing and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ia64-gr-watch-integration.yml
          git add target/ia64/helper.c target/ia64/helper.h target/ia64/translate.c
          git commit -m \
            'target/ia64: trace register provenance at firmware call sites'
          git fetch origin ia64-rooster-bringup
          test "$(git rev-parse origin/ia64-rooster-bringup)" = "$BASE_SHA"
          git push origin HEAD:ia64-rooster-bringup
          git format-patch -1 --stdout > validation/commit.patch
          git rev-parse HEAD > validation/HEAD

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia64-gr-watch-integration-${{ github.run_id }}
          path: validation/
          retention-days: 7
          if-no-files-found: error
