name: Temporary IA-64 source export

on:
  push:
    branches:
      - fix/ia64-rse-bsp-semantics
    paths:
      - .github/workflows/agent-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Pack source tree
        shell: bash
        run: |
          set -euo pipefail
          out=scratch/agent-source-export
          rm -rf "$out"
          mkdir -p "$out"
          tar \
            --exclude=.git \
            --exclude=build \
            --exclude="$out" \
            -czf "$out/qemu-ia64-source.tar.gz" .
          sha256sum "$out/qemu-ia64-source.tar.gz" > "$out/SHA256SUMS"
          git rev-parse HEAD > "$out/HEAD"

      - name: Upload source workspace
        uses: actions/upload-artifact@v4
        with:
          name: ia64-rse-bsp-source-${{ github.run_id }}
          path: scratch/agent-source-export/
          retention-days: 1
          if-no-files-found: error
