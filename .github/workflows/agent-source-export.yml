name: Temporary IA-64 SPD patch validation

on:
  push:
    branches:
      - agent/ia64-xen-dev-firmware-boot
    paths:
      - .github/workflows/agent-source-export.yml
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/agent-source-export.yml
      - scratch/agent-ipf-spd.patch
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/ia64-xen-dev-firmware-boot
          fetch-depth: 0

      - name: Apply and review 460GX SPD model
        shell: bash
        run: |
          set -euo pipefail
          git apply --check scratch/agent-ipf-spd.patch
          git apply scratch/agent-ipf-spd.patch
          git diff --check
          scripts/checkpatch.pl --no-tree --no-signoff \
            scratch/agent-ipf-spd.patch

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev libslirp-dev

      - name: Configure and build IA-64 emulator
        run: |
          ./configure \
            --target-list=ia64-softmmu \
            --disable-werror \
            --disable-docs \
            --disable-gtk \
            --disable-sdl
          ninja -C build qemu-system-ia64

      - name: Exercise representative development firmware
        shell: bash
        run: |
          set -euo pipefail
          out=scratch/agent-spd-validation
          mkdir -p "$out"
          printf 'firmware\trc\tpost04\tlast_post\tserial_bytes\n' > "$out/summary.tsv"

          for firmware in 'stuff/bios130.BIN' 'stuff/rx4610_117B.BIN'; do
            stem="$(basename "$firmware" | tr ' /' '__')"
            logdir="$out/$stem"
            mkdir -p "$logdir"

            set +e
            QEMU_IPF_TRACE_PCI_SPECIAL=1 \
            QEMU_IPF_TRACE_POST=1 \
            QEMU_IPF_TRACE_LIMIT=4096 \
            IA64_BIOS="$firmware" \
            IA64_LOGDIR="$logdir" \
            IA64_GUEST_ERRORS=1 \
            timeout --signal=TERM --kill-after=5s 40s \
              scripts/run-ia64-firmware.sh
            rc=$?
            set -e

            qlog="$logdir/qemu.fw.log"
            serial="$(find "$logdir" -maxdepth 1 -name 'serial.fw.*.log' \
                      -type f -print | sort | tail -n 1)"
            post04="$(grep -ac 'ipf post.*val=04' "$qlog" 2>/dev/null || true)"
            last_post="$(grep -a 'ipf post' "$qlog" 2>/dev/null | tail -n 1 | \
                         tr '\t\r\n' '   ' || true)"
            serial_bytes=0
            if [[ -n "$serial" && -f "$serial" ]]; then
              serial_bytes="$(stat -c '%s' "$serial")"
            fi
            [[ -n "$last_post" ]] || last_post='-'
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$firmware" "$rc" "$post04" "$last_post" "$serial_bytes" \
              | tee -a "$out/summary.tsv"
          done

      - name: Upload emulator and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia64-spd-validation-${{ github.run_id }}
          path: |
            build/qemu-system-ia64
            scratch/agent-spd-validation/
          if-no-files-found: warn
          retention-days: 3

      - name: Commit validated model and remove staging files
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git rm -- scratch/agent-ipf-spd.patch \
            .github/workflows/agent-source-export.yml
          git add -- hw/ia64/ipf.c
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'hw/ia64: expose 460GX DIMM SPD topology'
          git push origin HEAD:agent/ia64-xen-dev-firmware-boot
