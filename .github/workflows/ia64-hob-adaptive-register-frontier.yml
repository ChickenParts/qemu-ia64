name: IA-64 adaptive HOB register frontier

on:
  push:
    branches:
      - ia64-rooster-bringup
    paths:
      - docs/generated/ia64-hob-dual-timeline.json
      - .github/workflows/ia64-hob-adaptive-register-frontier.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registers:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: ia64-rooster-bringup
          fetch-depth: 1

      - name: Select the causal arena
        id: arena
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path('docs/generated/ia64-hob-dual-timeline.json').read_text()
          )
          timeline = report.get('timeline') or {}
          classification = timeline.get('classification', '')
          if classification == 'temporary-writes-continue-after-permanent-activation':
              label = 'temporary'
              base = '0xffff7000'
              size = '0x9000'
          else:
              label = 'permanent'
              base = '0x040ef000'
              size = '0x11000'
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'label={label}\n')
              output.write(f'base={base}\n')
              output.write(f'size={size}\n')
              output.write(f'classification={classification}\n')
          PY

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential mercurial ninja-build pkg-config python3 \
            libglib2.0-dev libpixman-1-dev libslirp-dev zlib1g-dev

      - name: Build QEMU and register sampler
        run: |
          set -euo pipefail
          ./configure \
            --target-list=ia64-softmmu \
            --enable-plugins \
            --disable-docs --disable-gtk --disable-sdl --disable-werror
          ninja -C build qemu-system-ia64
          bash scripts/build-ia64-hob-register-plugin.sh \
            "$PWD/build/libia64-hob-write-regs.so"

      - name: Build Rooster payload and canonical Xen firmware
        run: |
          set -euo pipefail
          root="$PWD/scratch/hob-adaptive-registers"
          mkdir -p "$root/firmware"
          docker run --rm \
            -v "$PWD:/work" -w /work fedora:44 \
            bash -lc '
              set -euo pipefail
              dnf --assumeyes --setopt=install_weak_deps=False install \
                binutils-ia64-linux-gnu coreutils gcc-ia64-linux-gnu git python3
              bash tests/ia64/rooster-efi-smoke/build.sh \
                /work/scratch/hob-adaptive-registers/payload
            '
          IA64_XEN_FIRMWARE_KEEP_SRC=1 \
            scripts/fetch-ia64-xen-firmware.sh "$root/firmware"
          expected=e143e85874ad57bad631853d48f0d47b7e7dbe6c41b4e558bbb4ea5b45775513
          actual="$(sha256sum "$root/firmware/Flash.fd" | awk '{print $1}')"
          test "$actual" = "$expected"
          printf '%s  Flash.fd\n' "$actual" > "$root/firmware.sha256"

      - name: Capture selected-arena register samples
        env:
          WATCH_LABEL: ${{ steps.arena.outputs.label }}
          WATCH_BASE: ${{ steps.arena.outputs.base }}
          WATCH_SIZE: ${{ steps.arena.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD/scratch/hob-adaptive-registers"
          esp="$root/esp"
          logs="$root/logs"
          mkdir -p "$esp/EFI/BOOT" "$logs"
          cp "$root/payload/BOOTIA64.EFI" "$esp/EFI/BOOT/BOOTIA64.EFI"
          printf 'fs0:\\EFI\\BOOT\\BOOTIA64.EFI\r\n' > "$esp/startup.nsh"
          printf '{}\n' > "$esp/rooster_config.json"

          set +e
          QEMU_BIN="$PWD/build/qemu-system-ia64" \
          IA64_BIOS="$root/firmware/Flash.fd" IA64_LOGDIR="$logs" \
          IA64_MEM=512M IA64_SMP=1 IA64_DISPLAY=none IA64_GUEST_ERRORS=1 \
          IA64_CALL_NULL_FIX=0 IA64_PEI_SYSMEM_HOB_FIX=1 \
          IA64_PEI_22560_STATUS_FIX=1 IA64_PEI_279D0_STATUS_FIX=1 \
          IA64_PEI_279D0_SAFE_MODE=0 \
          timeout --signal=TERM --kill-after=5s 180s \
            scripts/run-ia64-firmware.sh -- \
              -drive "file=fat:rw:$esp,format=raw,media=disk,if=ide" \
              -plugin "$PWD/build/libia64-hob-write-regs.so,base=$WATCH_BASE,size=$WATCH_SIZE,limit=2048" \
            > "$root/runner.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$root/return-code.txt"
          cat "$root/runner.log" "$logs"/*.log > "$root/combined.log" 2>/dev/null || true

      - name: Infer source, destination, and count roles
        env:
          WATCH_LABEL: ${{ steps.arena.outputs.label }}
          TIMELINE_CLASSIFICATION: ${{ steps.arena.outputs.classification }}
        run: |
          set -euo pipefail
          root=scratch/hob-adaptive-registers
          python3 scripts/analyze-ia64-hob-register-trace.py \
            "$root/combined.log" \
            --source-base 0xffff0000 --source-size 0x10000 \
            --target-base 0x040e0000 --target-size 0x20000 \
            --json "$root/registers.json" \
            --markdown "$root/registers.md" \
            > "$root/analyzer.stdout"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('scratch/hob-adaptive-registers')
          registers = json.loads((root / 'registers.json').read_text())
          report = {
              'schema': 1,
              'selected_arena': os.environ['WATCH_LABEL'],
              'timeline_classification': os.environ['TIMELINE_CLASSIFICATION'],
              'registers': registers,
          }
          (root / 'adaptive-report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          if not registers.get('destination_pointer_candidates'):
              raise SystemExit('no destination-pointer candidate was captured')
          PY

      - name: Upload adaptive register evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia64-hob-adaptive-registers-${{ github.run_id }}
          path: |
            scratch/hob-adaptive-registers/firmware.sha256
            scratch/hob-adaptive-registers/return-code.txt
            scratch/hob-adaptive-registers/combined.log
            scratch/hob-adaptive-registers/registers.json
            scratch/hob-adaptive-registers/registers.md
            scratch/hob-adaptive-registers/adaptive-report.json
          retention-days: 7
          if-no-files-found: warn
