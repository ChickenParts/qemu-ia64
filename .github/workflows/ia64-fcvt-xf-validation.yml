name: IA-64 fcvt.xf validation

on:
  push:
    branches:
      - fix/ia64-fcvt-xf
    paths:
      - target/ia64/translate.c
      - scripts/ia64-fslot-selftest.S
      - scripts/run-ia64-fslot-tests.sh
      - .github/workflows/ia64-fcvt-xf-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ia64-fcvt-xf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and run F-slot regression
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file ninja-build pkg-config python3 ruby \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Apply candidate architectural repairs
        shell: bash
        run: |
          set -euo pipefail
          ruby scripts/apply-ia64-rse-deferred-restore.rb --check .
          ruby scripts/apply-ia64-rse-deferred-restore.rb --apply .
          python3 scripts/apply-ia64-rse-backing-store-persistence.py --check .
          python3 scripts/apply-ia64-rse-backing-store-persistence.py --apply .
          python3 scripts/apply-ia64-indexed-register-decode.py --check .
          python3 scripts/apply-ia64-indexed-register-decode.py --apply .
          python3 scripts/check-ia64-rooster-branch.py
          git diff --check

      - name: Build IA-64 emulator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          ./configure \
            --target-list=ia64-softmmu \
            --enable-plugins \
            --disable-slirp \
            --disable-docs \
            --disable-gtk \
            --disable-sdl \
            --disable-werror
          ninja -C build -j"$(nproc)" qemu-system-ia64

      - name: Assemble exact F-slot selftest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scratch/ia64_fslot_selftest
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            fedora:44 \
            bash -lc '
              set -euo pipefail
              dnf install -y --setopt=install_weak_deps=False binutils-ia64-linux-gnu
              ia64-linux-gnu-as \
                -o scratch/ia64_fslot_selftest/fslot-selftest.o \
                scripts/ia64-fslot-selftest.S
              ia64-linux-gnu-ld -static -nostdlib -e _start -Ttext=0x5000000 \
                -o scratch/ia64_fslot_selftest/fslot-selftest.elf \
                scratch/ia64_fslot_selftest/fslot-selftest.o
              ia64-linux-gnu-objdump -d \
                scratch/ia64_fslot_selftest/fslot-selftest.elf \
                > scratch/ia64_fslot_selftest/fslot-selftest.dis
            '
          file scratch/ia64_fslot_selftest/fslot-selftest.elf
          grep -F "fcvt.xf f7=f7" scratch/ia64_fslot_selftest/fslot-selftest.dis

      - name: Run F-slot selftest
        shell: bash
        run: |
          set -euo pipefail
          logdir=scratch/ia64_logs/fcvt-xf
          mkdir -p "$logdir"

          set +e
          QEMU_IA64_BREAK_LOG=1 \
          IA64_LOGDIR="$logdir" \
          IA64_KERNEL=scratch/ia64_fslot_selftest/fslot-selftest.elf \
          IA64_INITRD= \
          IA64_APPEND= \
            timeout -k 2s 12s scripts/run-ia64-kernel.sh
          rc=$?
          set -e

          if [[ $rc -ne 124 && $rc -ne 137 ]]; then
            echo "F-slot selftest returned unexpected rc=$rc" >&2
            exit "$rc"
          fi

          test -f "$logdir/qemu.log"
          grep -F "IA64: breaki" "$logdir/qemu.log"
          ! grep -F "IA64 UNIMPL" "$logdir/qemu.log" | grep -F "000e000e1c0"
          ! grep -F "r8=0000000066736c66" "$logdir/qemu.log"
          grep -F "r8=0000000066736c70" "$logdir/qemu.log"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia64-fcvt-xf-validation
          path: |
            scratch/ia64_fslot_selftest/fslot-selftest.dis
            scratch/ia64_logs/fcvt-xf
          if-no-files-found: warn
