name: IA-64 FV HOB migration causality

on:
  push:
    branches:
      - ia64-rooster-bringup
    paths:
      - hw/ia64/hob-migration-probe.c
      - .github/workflows/ia64-fv-hob-causality.yml
      - scripts/run-ia64-rooster-firmware-matrix.py
      - scripts/fetch-ia64-xen-firmware.sh
      - scripts/run-ia64-firmware.sh
      - tests/ia64/rooster-efi-smoke/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact bring-up branch
        uses: actions/checkout@v4
        with:
          ref: ia64-rooster-bringup
          fetch-depth: 1

      - name: Include the diagnostic probe in this build only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('hw/ia64/meson.build')
          text = path.read_text()
          if 'hob-migration-probe.c' not in text:
              text, count = re.subn(
                  r"'ipf\.c'\s*,",
                  "'ipf.c', 'hob-migration-probe.c',",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('could not find ipf.c in hw/ia64/meson.build')
              path.write_text(text)
          PY
          grep -F "hob-migration-probe.c" hw/ia64/meson.build

      - name: Install emulator dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential mercurial ninja-build pkg-config python3 \
            libglib2.0-dev libpixman-1-dev libslirp-dev zlib1g-dev

      - name: Build diagnostic QEMU
        run: |
          set -euo pipefail
          ./configure \
            --target-list=ia64-softmmu \
            --disable-docs --disable-gtk --disable-sdl --disable-werror
          ninja -C build qemu-system-ia64

      - name: Build Rooster EFI payload
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" -w /work fedora:44 \
            bash -lc '
              set -euo pipefail
              dnf --assumeyes --setopt=install_weak_deps=False install \
                binutils-ia64-linux-gnu coreutils gcc-ia64-linux-gnu git python3
              bash tests/ia64/rooster-efi-smoke/build.sh \
                /work/scratch/fv-hob-causality/payload
            '

      - name: Rebuild and identify canonical Xen firmware
        run: |
          set -euo pipefail
          mkdir -p scratch/fv-hob-causality/firmware
          IA64_XEN_FIRMWARE_KEEP_SRC=1 \
            scripts/fetch-ia64-xen-firmware.sh \
              scratch/fv-hob-causality/firmware
          expected=e143e85874ad57bad631853d48f0d47b7e7dbe6c41b4e558bbb4ea5b45775513
          actual="$(sha256sum scratch/fv-hob-causality/firmware/Flash.fd | awk '{print $1}')"
          test "$actual" = "$expected"
          printf '%s  Flash.fd\n' "$actual" \
            > scratch/fv-hob-causality/firmware.sha256

      - name: Run baseline with all target-repair switches off
        env:
          QEMU_IA64_PEI_FV_HOB_RESTORE: "0"
          IA64_CALL_NULL_FIX: "0"
          IA64_PEI_SYSMEM_HOB_FIX: "1"
        run: |
          set -euo pipefail
          python3 scripts/run-ia64-rooster-firmware-matrix.py \
            --qemu build/qemu-system-ia64 \
            --payload scratch/fv-hob-causality/payload/BOOTIA64.EFI \
            --runner scripts/run-ia64-firmware.sh \
            --out scratch/fv-hob-causality/baseline \
            --timeout 150 \
            scratch/fv-hob-causality/firmware/Flash.fd

      - name: Run semantic FV-HOB restoration probe
        env:
          QEMU_IA64_PEI_FV_HOB_RESTORE: "1"
          IA64_CALL_NULL_FIX: "0"
          IA64_PEI_SYSMEM_HOB_FIX: "1"
        run: |
          set -euo pipefail
          python3 scripts/run-ia64-rooster-firmware-matrix.py \
            --qemu build/qemu-system-ia64 \
            --payload scratch/fv-hob-causality/payload/BOOTIA64.EFI \
            --runner scripts/run-ia64-firmware.sh \
            --out scratch/fv-hob-causality/probe \
            --timeout 150 \
            scratch/fv-hob-causality/firmware/Flash.fd

      - name: Require a real stage advance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('scratch/fv-hob-causality')
          baseline = json.loads((root / 'baseline/matrix.json').read_text())[0]
          probe = json.loads((root / 'probe/matrix.json').read_text())[0]
          order = ['pal-sal', 'fit', 'pei', 'dxe-ipl', 'dxe-core', 'bds-shell', 'rooster']

          def rank(record):
              stages = set(record.get('stages', []))
              return max((index for index, name in enumerate(order) if name in stages), default=-1)

          logs = '\n'.join(
              path.read_text(errors='replace')
              for path in (root / 'probe/runs').rglob('*.log')
          )
          restore = 'IA64 FV_HOB_RESTORE source=' in logs
          report = {
              'baseline': baseline,
              'probe': probe,
              'baseline_rank': rank(baseline),
              'probe_rank': rank(probe),
              'restore_observed': restore,
              'null_call_fix_enabled': 'CALL_NULL_FIX applied' in logs,
          }
          (root / 'comparison.json').write_text(json.dumps(report, indent=2) + '\n')
          summary = [
              '## IA-64 FV-HOB causality', '',
              f"- Baseline stages: `{', '.join(baseline.get('stages', []))}`",
              f"- Probe stages: `{', '.join(probe.get('stages', []))}`",
              f"- Semantic restoration observed: `{restore}`",
              f"- Stage rank: `{rank(baseline)} -> {rank(probe)}`",
          ]
          with Path('/home/runner/work/_temp/_runner_file_commands/step_summary').open('a') as out:
              out.write('\n'.join(summary) + '\n')
          if not restore:
              raise SystemExit('the semantic probe never found the split HOB lists')
          if report['null_call_fix_enabled']:
              raise SystemExit('null-call workaround contaminated the probe')
          if rank(probe) <= rank(baseline):
              raise SystemExit('restoring FV HOBs did not advance the firmware stage')
          PY

      - name: Upload causality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia64-fv-hob-causality-${{ github.run_id }}
          path: |
            scratch/fv-hob-causality/firmware.sha256
            scratch/fv-hob-causality/payload/BOOTIA64.EFI
            scratch/fv-hob-causality/baseline/
            scratch/fv-hob-causality/probe/
            scratch/fv-hob-causality/comparison.json
          retention-days: 7
          if-no-files-found: warn
