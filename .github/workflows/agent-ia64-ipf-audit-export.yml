name: Temporary IA-64 IPF audit source export

on:
  push:
    branches:
      - scratch/ia64-ipf-audit-source
    paths:
      - .github/workflows/agent-ia64-ipf-audit-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record and pack exact source tree
        shell: bash
        run: |
          set -euo pipefail
          out=scratch/agent-ia64-ipf-audit-export
          mkdir -p "$out"
          printf 'branch=%s\ncommit=%s\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" > "$out/MANIFEST"
          tar \
            --exclude=.git \
            --exclude=build \
            --exclude="$out" \
            -czf "$out/qemu-ia64-source.tar.gz" .
          sha256sum "$out/qemu-ia64-source.tar.gz" > "$out/SHA256SUMS"

      - name: Upload exact source tree
        uses: actions/upload-artifact@v4
        with:
          name: ia64-ipf-audit-source-${{ github.run_id }}
          path: scratch/agent-ia64-ipf-audit-export/
          retention-days: 1
          if-no-files-found: error
