name: Map IA-64 HOB hooks

on:
  push:
    branches:
      - ia64-rooster-bringup
    paths:
      - .github/workflows/ia64-hob-hook-map.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ia64-hob-hook-map
  cancel-in-progress: false

jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full branch history
        uses: actions/checkout@v4
        with:
          ref: ia64-rooster-bringup
          fetch-depth: 0

      - name: Build source and history map
        run: |
          set -euo pipefail
          mkdir -p docs/generated
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          paths = (
              Path('hw/ia64/ipf.c'),
              Path('target/ia64/helper.c'),
              Path('target/ia64/translate.c'),
              Path('scripts/run-ia64-firmware.sh'),
          )
          interesting = re.compile(
              r'HOB|hob|PeiFindFile|PeiLoadFile|CreateHob|GetHobList|'
              r'SYSMEM|FV_HOB|FindFv|findfv|DxeIpl|CALL_NULL',
              re.I,
          )
          function = re.compile(
              r'^\s*(?:static\s+)?(?:inline\s+)?(?:[A-Za-z_][\w\s*]+\s+)?'
              r'([A-Za-z_]\w*)\s*\([^;]*$'
          )
          lines = [
              '# IA-64 HOB/PEI hook map', '',
              'Generated from the `ia64-rooster-bringup` branch.  Entries are '
              'source locations, not a recommendation to keep firmware-specific '
              'compatibility switches.', '',
          ]
          for path in paths:
              source = path.read_text(errors='replace').splitlines()
              current_function = '(file scope)'
              hits = []
              for number, text in enumerate(source, 1):
                  candidate = function.match(text)
                  if candidate:
                      current_function = candidate.group(1)
                  if interesting.search(text):
                      hits.append((number, current_function, text.strip()))
              lines.extend([f'## `{path}`', '',
                            '| Line | Enclosing function | Match |',
                            '|---:|---|---|'])
              for number, owner, text in hits[:500]:
                  escaped = text.replace('|', '\\|').replace('`', '\\`')
                  lines.append(f'| {number} | `{owner}` | `{escaped}` |')
              lines.append('')

          lines.extend(['## Introduction history', ''])
          for token in (
              'QEMU_IA64_PEI_SYSMEM_HOB_FIX',
              'QEMU_IA64_PEI_HOB_FLOW_TRACE',
              'QEMU_IA64_EFI_HOB_PATCH',
              'QEMU_IA64_CALL_NULL_FIX',
              'PeiFindFile',
          ):
              command = [
                  'git', 'log', '--all', '--date=short',
                  '--pretty=format:%h %ad %s', '-S', token, '--',
                  'hw/ia64', 'target/ia64', 'scripts',
              ]
              result = subprocess.run(command, text=True,
                                      stdout=subprocess.PIPE,
                                      stderr=subprocess.PIPE, check=False)
              lines.extend([f'### `{token}`', '', '```text'])
              lines.extend(result.stdout.splitlines()[:40] or ['(no matching commit)'])
              lines.extend(['```', ''])

          Path('docs/generated/ia64-hob-hook-map.md').write_text(
              '\n'.join(lines) + '\n'
          )
          PY
          test -s docs/generated/ia64-hob-hook-map.md

      - name: Commit generated map and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/ia64-hob-hook-map.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs/ia64: map HOB compatibility hooks and history'
          git fetch origin ia64-rooster-bringup
          git rebase origin/ia64-rooster-bringup
          git push origin HEAD:ia64-rooster-bringup
