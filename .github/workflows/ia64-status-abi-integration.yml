name: Temporary IA-64 status ABI integration

on:
  push:
    branches:
      - ia64-rooster-bringup
    paths:
      - .github/workflows/ia64-status-abi-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact bring-up branch
        uses: actions/checkout@v4
        with:
          ref: ia64-rooster-bringup
          fetch-depth: 0

      - name: Correct EFI status-code argument mapping
        shell: bash
        run: |
          set -euo pipefail
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p validation
          python3 - <<'PY'
          from pathlib import Path

          path = Path('target/ia64/helper.c')
          source = path.read_text()
          start_marker = '        if (trace_call_status) {\n'
          end_marker = '\n\n        /*\n         * ABI note: indirect calls'
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          old = source[start:end]
          new = '''        if (trace_call_status) {
              /*
               * EFI_REPORT_STATUS_CODE uses five arguments: type, value,
               * instance, caller ID, and data.  Keep this diagnostic aligned
               * with that ABI so assertion records are decoded correctly.
               */
              if (call_a3 && call_a3 != UINT64_MAX) {
                  IA64EfiGuid caller;
                  if (ia64_fw_read_guid(env, call_a3, &caller)) {
                      qemu_log_mask(LOG_GUEST_ERROR,
                                    "IA64: trace_call caller=%08x-%04x-%04x"
                                    "-%02x%02x-%02x%02x%02x%02x%02x%02x\\n",
                                    caller.data1, caller.data2, caller.data3,
                                    caller.data4[0], caller.data4[1],
                                    caller.data4[2], caller.data4[3],
                                    caller.data4[4], caller.data4[5],
                                    caller.data4[6], caller.data4[7]);
                  } else {
                      qemu_log_mask(LOG_GUEST_ERROR,
                                    "IA64: trace_call caller_read_fail ptr=%016"
                                    PRIx64 "\\n", call_a3);
                  }
              }
              if (call_a4) {
                  ia64_fw_statuscode_dump(env, call_a4, call_a0, call_a1);
              }
          }'''
          if 'ia64_fw_statuscode_dump(env, call_a5, call_a1, call_a2);' not in old:
              raise SystemExit('status-code ABI block changed unexpectedly')
          path.write_text(source[:start] + new + source[end:])
          PY

          git diff --check
          git diff --binary > validation/ia64-status-abi.patch
          ./scripts/checkpatch.pl --strict --no-signoff --color=never \
            validation/ia64-status-abi.patch \
            2>&1 | tee validation/checkpatch.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libglib2.0-dev libpixman-1-dev \
            ninja-build pkg-config python3 python3-venv zlib1g-dev

      - name: Build IA-64 system emulator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-status-abi
          mkdir build-status-abi
          (
            cd build-status-abi
            ../configure \
              --target-list=ia64-softmmu \
              --disable-docs \
              --disable-gtk \
              --disable-sdl \
              --disable-vnc \
              --disable-werror
          ) 2>&1 | tee validation/configure.txt
          ninja -C build-status-abi -j"$(nproc)" qemu-system-ia64 \
            2>&1 | tee validation/build.txt
          build-status-abi/qemu-system-ia64 --version \
            | tee validation/version.txt

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ia64-status-abi-integration.yml
          git add target/ia64/helper.c
          git commit -m \
            'target/ia64: decode EFI status calls with the correct ABI'
          git fetch origin ia64-rooster-bringup
          test "$(git rev-parse origin/ia64-rooster-bringup)" = "$BASE_SHA"
          git push origin HEAD:ia64-rooster-bringup
          git format-patch -1 --stdout > validation/commit.patch
          git rev-parse HEAD > validation/HEAD

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia64-status-abi-integration-${{ github.run_id }}
          path: validation/
          retention-days: 7
          if-no-files-found: error
