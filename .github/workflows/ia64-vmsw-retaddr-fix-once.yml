# One-shot workflow; deletes itself with the source transformer on success.
name: IA-64 vmsw retaddr fix once

on:
  push:
    branches:
      - work/ia64-b8-vmsw
    paths:
      - .github/workflows/ia64-vmsw-retaddr-fix-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ia64-b8-vmsw
          fetch-depth: 0
      - name: Apply and validate exact source transformation
        run: |
          set -euo pipefail
          python3 scripts/apply-ia64-vmsw-retaddr-fix.py
          git diff --check
          cc -std=gnu2x -O2 -Wall -Wextra -Werror -o /tmp/vmsw-policy tests/ia64/nonf/vmsw-policy-test.c
          /tmp/vmsw-policy
          python3 -m unittest discover -s tests/ia64/nonf -p 'test_*.py' -v
      - name: Commit production fix
        run: |
          set -euo pipefail
          git rm .github/workflows/ia64-vmsw-retaddr-fix-once.yml scripts/apply-ia64-vmsw-retaddr-fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add target/ia64/helper.c tests/ia64/nonf/test_vmsw_source.py
          git commit -m 'target/ia64: preserve vmsw faulting slot across nested helper'
          git push origin HEAD:work/ia64-b8-vmsw
