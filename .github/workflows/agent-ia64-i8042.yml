name: Temporary IA-64 i8042 validation

on:
  push:
    branches:
      - stage/ia64-i8042
    paths:
      - scratch/ia64-i8042.patch
      - .github/workflows/agent-ia64-i8042.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_COMMIT: a15efd4e3833b54b75538354efcec3226300b755
      OUTPUT_BRANCH: fix/ia64-i8042
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and review the exact source change
        shell: bash
        run: |
          set -euo pipefail
          cp scratch/ia64-i8042.patch /tmp/ia64-i8042.patch
          sha256sum /tmp/ia64-i8042.patch \
            > /tmp/ia64-i8042-input-sha256.txt

          git checkout --detach "$BASE_COMMIT"
          git apply --check /tmp/ia64-i8042.patch
          git apply /tmp/ia64-i8042.patch

          git add configs/devices/ia64-softmmu/default.mak \
            hw/ia64/ipf.c tests/qtest/ia64-ipf-test.c
          git diff --cached --check
          git diff --cached > /tmp/ia64-i8042-full.patch
          perl scripts/checkpatch.pl --no-signoff /tmp/ia64-i8042-full.patch

      - name: Upload exact patch-applied source for review
        uses: actions/upload-artifact@v4
        with:
          name: ia64-i8042-source-${{ github.run_id }}
          path: |
            /tmp/ia64-i8042-input-sha256.txt
            /tmp/ia64-i8042-full.patch
            configs/devices/ia64-softmmu/default.mak
            hw/ia64/ipf.c
            tests/qtest/ia64-ipf-test.c
          retention-days: 1
          if-no-files-found: error

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev libslirp-dev

      - name: Configure IA-64 system emulator
        run: |
          ./configure \
            --target-list=ia64-softmmu \
            --disable-werror \
            --disable-docs \
            --disable-gtk \
            --disable-sdl

      - name: Build IA-64 and focused platform tests
        run: |
          ninja -C build \
            qemu-system-ia64 \
            tests/unit/test-ia64-interrupt \
            tests/unit/test-ia64-iosapic \
            tests/qtest/ia64-ipf-test

      - name: Run architectural and i8042 contracts
        shell: bash
        run: |
          set -euo pipefail
          build/tests/unit/test-ia64-interrupt --tap -k \
            | tee /tmp/test-ia64-interrupt.tap
          build/tests/unit/test-ia64-iosapic --tap -k \
            | tee /tmp/test-ia64-iosapic.tap
          QTEST_QEMU_BINARY=./build/qemu-system-ia64 \
            build/tests/qtest/ia64-ipf-test --tap -k \
            | tee /tmp/ia64-ipf-test.tap

      - name: Basic executable smoke checks
        shell: bash
        run: |
          set -euo pipefail
          build/qemu-system-ia64 --version
          build/qemu-system-ia64 -machine help | grep -q '^ipf '

      - name: Publish one clean tested source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git diff --cached --check
          git commit \
            -m 'hw/ia64: realize the PIIX i8042 controller' \
            -m 'Enable the modern migratable i8042 model on the PIIX ISA bus and route its keyboard and mouse outputs through architectural IRQ1 and IRQ12 into the I/O SAPIC. Exercise controller self-test, both output paths, deassertion, and EOI while deliberately leaving the x86-only A20 output unused.'
          git push --force origin "HEAD:refs/heads/$OUTPUT_BRANCH"
          git rev-parse HEAD | tee /tmp/ia64-i8042-commit.txt

      - name: Upload tested commit identity and contract output
        uses: actions/upload-artifact@v4
        with:
          name: ia64-i8042-result
          path: |
            /tmp/ia64-i8042-commit.txt
            /tmp/test-ia64-interrupt.tap
            /tmp/test-ia64-iosapic.tap
            /tmp/ia64-ipf-test.tap
          retention-days: 1
          if-no-files-found: error
