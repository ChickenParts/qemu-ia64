name: Temporary IA-64 root-cause build

on:
  push:
    branches:
      - fix/ia64-ipf-device-root-cause
    paths:
      - scratch/agent-ia64-interrupt-contract.patch
      - .github/workflows/agent-ia64-root-cause-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_COMMIT: ca30eed7cad1f6090b5b3ac5da22ea4c2c68ce99
      OUTPUT_BRANCH: scratch/ia64-ipf-device-root-cause-built
      PATCH_FILE: scratch/agent-ia64-interrupt-contract.patch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and review architectural interrupt patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_COMMIT" HEAD
          git apply --check "$PATCH_FILE"
          git apply "$PATCH_FILE"
          git diff --check
          perl scripts/checkpatch.pl --no-signoff --strict "$PATCH_FILE"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev libslirp-dev

      - name: Configure IA-64 system emulator
        run: |
          ./configure \
            --target-list=ia64-softmmu \
            --disable-werror \
            --disable-docs \
            --disable-gtk \
            --disable-sdl

      - name: Build IA-64 system emulator
        run: ninja -C build qemu-system-ia64

      - name: Basic executable smoke checks
        shell: bash
        run: |
          set -euo pipefail
          build/qemu-system-ia64 --version
          build/qemu-system-ia64 -machine help | grep -q '^ipf '

      - name: Publish a clean tested commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git reset --mixed "$BASE_COMMIT"
          git add \
            target/ia64/cpu.c \
            target/ia64/cpu.h \
            target/ia64/helper.c \
            target/ia64/helper.h \
            target/ia64/translate.c \
            hw/ia64/ipf.c
          git diff --cached --check
          git commit -m 'target/ia64: implement local SAPIC interrupt arbitration'
          git push --force origin "HEAD:refs/heads/$OUTPUT_BRANCH"
          git rev-parse HEAD | tee /tmp/ia64-root-cause-commit.txt

      - name: Upload tested commit identity
        uses: actions/upload-artifact@v4
        with:
          name: ia64-root-cause-commit
          path: /tmp/ia64-root-cause-commit.txt
          retention-days: 1
          if-no-files-found: error
