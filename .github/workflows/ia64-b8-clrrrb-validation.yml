name: IA-64 B8 clear-RRB validation

on:
  push:
    branches: [work/ia64-b8-clrrrb]
    paths:
      - .github/workflows/ia64-b8-clrrrb-validation.yml
      - target/ia64/translate.c
      - target/ia64/helper.c
      - target/ia64/helper.h
      - scripts/ia64-b8-clrrrb-byte-oracle.py
      - scripts/run-ia64-b8-clrrrb-tests.py
      - scripts/ia64-nonf-fallback-audit.py
      - tests/ia64/nonf/**
      - docs/generated/ia64-nonf-fallbacks.md
  pull_request:
    paths:
      - .github/workflows/ia64-b8-clrrrb-validation.yml
      - target/ia64/translate.c
      - target/ia64/helper.c
      - target/ia64/helper.h
      - scripts/ia64-b8-clrrrb-byte-oracle.py
      - scripts/run-ia64-b8-clrrrb-tests.py
      - scripts/ia64-nonf-fallback-audit.py
      - tests/ia64/nonf/**
      - docs/generated/ia64-nonf-fallbacks.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b8-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install GNU IA-64 binutils and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils-ia64-linux-gnu libglib2.0-dev \
            libpixman-1-dev ninja-build pkg-config python3 zlib1g-dev
      - name: Review-controlled source and assembler gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scratch/b8-evidence
          python3 scripts/ia64-nonf-fallback-audit.py --check
          python3 -m unittest discover -s tests/ia64/nonf -p 'test_*.py' -v
          python3 scripts/ia64-b8-clrrrb-byte-oracle.py \
            --out scratch/b8-evidence/gnu-b8
          python3 scripts/run-ia64-b8-clrrrb-tests.py \
            --assemble-only --out scratch/b8-evidence/assembled
          git diff --exit-code
      - name: Build production qemu-system-ia64
        shell: bash
        run: |
          set -euo pipefail
          mkdir build-b8
          (cd build-b8; ../configure --target-list=ia64-softmmu \
             --disable-docs --disable-gtk --disable-sdl --disable-vnc \
             --disable-slirp --disable-werror)
          ninja -C build-b8 -j"$(nproc)" qemu-system-ia64
      - name: Execute B8 and inherited real-system regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run-ia64-b8-clrrrb-tests.py \
            --qemu build-b8/qemu-system-ia64 \
            --out scratch/b8-evidence/b8-guest --timeout 10
          python3 scripts/run-ia64-b67-predict-tests.py \
            --qemu build-b8/qemu-system-ia64 \
            --out scratch/b8-evidence/b67-guest --timeout 10
          python3 scripts/run-ia64-b9-exception-tests.py \
            --qemu build-b8/qemu-system-ia64 \
            --out scratch/b8-evidence/b9-ivt --timeout 10
          python3 scripts/run-ia64-f12-f15-exception-tests.py \
            --qemu build-b8/qemu-system-ia64 \
            --out scratch/b8-evidence/f12-f15 --timeout 10
          QEMU_BIN="$PWD/build-b8/qemu-system-ia64" \
          IA64_AS=ia64-linux-gnu-as IA64_LD=ia64-linux-gnu-ld \
          IA64_FSLOT_LOGDIR=scratch/b8-evidence/fslot/logs \
          IA64_FSLOT_OUTDIR=scratch/b8-evidence/fslot/out \
            bash scripts/run-ia64-fslot-tests.sh 3s
      - name: Retain exact source and emulator provenance
        if: always()
        shell: bash
        run: |
          mkdir -p scratch/b8-evidence
          git rev-parse HEAD > scratch/b8-evidence/source-head.txt
          if test -f build-b8/qemu-system-ia64; then
            sha256sum build-b8/qemu-system-ia64 > scratch/b8-evidence/qemu-sha256.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ia64-b8-clrrrb-validation
          path: scratch/b8-evidence
          retention-days: 14
          if-no-files-found: error
