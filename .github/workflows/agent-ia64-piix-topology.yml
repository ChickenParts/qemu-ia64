name: Temporary IA-64 PIIX topology validation

on:
  push:
    branches:
      - stage/ia64-piix-topology
    paths:
      - scratch/ia64-piix-topology-source.patch
      - scratch/ia64-ipf-test.c
      - .github/workflows/agent-ia64-piix-topology.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_COMMIT: e58293d02ba7d02ca6e850377d955121d0cd26c5
      OUTPUT_BRANCH: fix/ia64-piix-topology
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewable source inputs
        shell: bash
        run: |
          set -euo pipefail
          cp scratch/ia64-piix-topology-source.patch /tmp/ia64-piix-topology-source.patch
          cp scratch/ia64-ipf-test.c /tmp/ia64-ipf-test.c
          sha256sum \
            /tmp/ia64-piix-topology-source.patch \
            /tmp/ia64-ipf-test.c \
            | tee /tmp/ia64-piix-input-sha256.txt

          git checkout --detach "$BASE_COMMIT"
          git apply --check /tmp/ia64-piix-topology-source.patch
          git apply /tmp/ia64-piix-topology-source.patch
          cp /tmp/ia64-ipf-test.c tests/qtest/ia64-ipf-test.c

          git add MAINTAINERS configs/devices/ia64-softmmu/default.mak \
            hw/ia64/ipf.c tests/qtest/meson.build tests/qtest/ia64-ipf-test.c
          git diff --cached --check
          git diff --cached > /tmp/ia64-piix-topology-full.patch
          perl scripts/checkpatch.pl --no-signoff \
            /tmp/ia64-piix-topology-full.patch

      - name: Upload exact patch-applied source for review
        uses: actions/upload-artifact@v4
        with:
          name: ia64-piix-topology-source-${{ github.run_id }}
          path: |
            /tmp/ia64-piix-input-sha256.txt
            /tmp/ia64-piix-topology-full.patch
            MAINTAINERS
            configs/devices/ia64-softmmu/default.mak
            hw/ia64/ipf.c
            tests/qtest/meson.build
            tests/qtest/ia64-ipf-test.c
          retention-days: 1
          if-no-files-found: error

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev libslirp-dev

      - name: Configure IA-64 system emulator
        run: |
          ./configure \
            --target-list=ia64-softmmu \
            --disable-werror \
            --disable-docs \
            --disable-gtk \
            --disable-sdl

      - name: Build IA-64 and focused topology tests
        run: |
          ninja -C build \
            qemu-system-ia64 \
            tests/unit/test-ia64-interrupt \
            tests/unit/test-ia64-iosapic \
            tests/qtest/ia64-ipf-test

      - name: Run architectural and machine-topology contracts
        shell: bash
        run: |
          set -euo pipefail
          build/tests/unit/test-ia64-interrupt --tap -k \
            | tee /tmp/test-ia64-interrupt.tap
          build/tests/unit/test-ia64-iosapic --tap -k \
            | tee /tmp/test-ia64-iosapic.tap
          QTEST_QEMU_BINARY=./build/qemu-system-ia64 \
            build/tests/qtest/ia64-ipf-test --tap -k \
            | tee /tmp/ia64-ipf-test.tap

      - name: Basic executable smoke checks
        shell: bash
        run: |
          set -euo pipefail
          build/qemu-system-ia64 --version
          build/qemu-system-ia64 -machine help | grep -q '^ipf '

      - name: Publish one clean tested source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git diff --cached --check
          git commit \
            -m 'hw/ia64: wire PIIX devices into the I/O SAPIC' \
            -m 'Use one payload-independent PCI/ISA topology. Connect PIIX ISA lines to the I/O SAPIC, attach IDE backends and SMBus EEPROMs, honor the USB machine setting, and test real PIIX4 SCI delivery without firmware- or image-specific behavior.'
          git push --force origin "HEAD:refs/heads/$OUTPUT_BRANCH"
          git rev-parse HEAD | tee /tmp/ia64-piix-topology-commit.txt

      - name: Upload tested commit identity and contract output
        uses: actions/upload-artifact@v4
        with:
          name: ia64-piix-topology-result
          path: |
            /tmp/ia64-piix-topology-commit.txt
            /tmp/test-ia64-interrupt.tap
            /tmp/test-ia64-iosapic.tap
            /tmp/ia64-ipf-test.tap
          retention-days: 1
          if-no-files-found: error
