name: IA-64 F1/F6/F7 validation

on:
  push:
    branches: [fix/ia64-f1-f67-decode]
    paths:
      - .github/workflows/ia64-f1-f67-validation.yml
      - target/ia64/**
      - tests/ia64/isa/**
      - scripts/ia64-isa-coverage.py
      - scripts/ia64-fslot-selftest.S
      - scripts/run-ia64-fslot-tests.sh
      - scripts/run-ia64-kernel.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ia64-f1-f67-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record-audit:
    name: Record reviewed decoder baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependency
        run: python3 -m pip install -r tests/ia64/isa/requirements.txt
      - name: Record and verify intended route changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scratch/f1-f67-record
          python3 scripts/ia64-isa-coverage.py --record
          python3 scripts/ia64-isa-coverage.py --check \
            --output scratch/f1-f67-record/observations.json5
          python3 -m unittest discover -s tests/ia64/isa -p 'test_*.py' -v \
            2>&1 | tee scratch/f1-f67-record/tests.txt
          cp tests/ia64/isa/f-unit-baseline.json5 scratch/f1-f67-record/
          cp docs/generated/ia64-instruction-coverage.md scratch/f1-f67-record/
          git diff -- tests/ia64/isa/f-unit-baseline.json5 \
            docs/generated/ia64-instruction-coverage.md \
            > scratch/f1-f67-record/generated.patch
          git rev-parse HEAD > scratch/f1-f67-record/source-head.txt
      - name: Upload generated baseline
        uses: actions/upload-artifact@v4
        with:
          name: ia64-f1-f67-recorded-baseline
          path: scratch/f1-f67-record/
          retention-days: 7
          if-no-files-found: error

  build-runtime:
    name: Build QEMU and run directed F-slot test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build and IA-64 assembler dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils-ia64-linux-gnu \
            libglib2.0-dev \
            libpixman-1-dev \
            ninja-build \
            pkg-config \
            python3 \
            python3-venv \
            zlib1g-dev
      - name: Configure and build qemu-system-ia64
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-f1-f67
          mkdir build-f1-f67
          (
            cd build-f1-f67
            ../configure \
              --target-list=ia64-softmmu \
              --disable-docs \
              --disable-gtk \
              --disable-sdl \
              --disable-vnc \
              --disable-werror
          )
          ninja -C build-f1-f67 -j"$(nproc)" qemu-system-ia64
          test -x build-f1-f67/qemu-system-ia64
      - name: Run scalar F1/F-slot execution regression
        shell: bash
        run: |
          set -euo pipefail
          QEMU_BIN="$PWD/build-f1-f67/qemu-system-ia64" \
          IA64_AS=ia64-linux-gnu-as \
          IA64_LD=ia64-linux-gnu-ld \
          IA64_FSLOT_LOGDIR=scratch/f1-f67-runtime/logs \
          IA64_FSLOT_OUTDIR=scratch/f1-f67-runtime/out \
            scripts/run-ia64-fslot-tests.sh 12s
      - name: Retain runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia64-f1-f67-runtime
          path: scratch/f1-f67-runtime/
          retention-days: 7
          if-no-files-found: warn
