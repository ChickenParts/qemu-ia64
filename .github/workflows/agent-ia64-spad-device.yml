name: Temporary IA-64 SPad device validation

on:
  push:
    branches:
      - stage/ia64-spad-device
    paths:
      - .github/workflows/agent-ia64-spad-device.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      BASE_COMMIT: 204919f9cfcbc3cff78bddf31e4e242142070fb9
      OUTPUT_BRANCH: fix/ia64-spad-device
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the explicit SPad device on the verified base
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_COMMIT" HEAD
          git checkout --detach "$BASE_COMMIT"

          cat > hw/ia64/ipf-spad.h <<'EOF'
          /*
           * IA-64 IPF firmware scratchpad device
           *
           * Copyright (c) 2026 Bryce Lanham
           *
           * SPDX-License-Identifier: GPL-2.0-or-later
           */
          #ifndef HW_IA64_IPF_SPAD_H
          #define HW_IA64_IPF_SPAD_H

          #include "hw/sysbus.h"

          #define TYPE_IA64_IPF_SPAD "ia64-ipf-spad"
          OBJECT_DECLARE_SIMPLE_TYPE(IA64IPFSPADState, IA64_IPF_SPAD)

          #define IA64_IPF_SPAD_BASE                 0x00000000ff37fc00ULL
          #define IA64_IPF_SPAD_SIZE                 0x400
          #define IA64_IPF_SPAD_LOCK_PTR_OFFSET      0x008
          #define IA64_IPF_SPAD_MP_RECORD_OFFSET     0x168
          #define IA64_IPF_SPAD_MP_RECORD_SIZE       0x100
          #define IA64_IPF_SPAD_MP_SIGNATURE_OFFSET  0x020

          #endif /* HW_IA64_IPF_SPAD_H */
          EOF

          cat > hw/ia64/ipf-spad.c <<'EOF'
          /*
           * IA-64 IPF firmware scratchpad device
           *
           * Copyright (c) 2026 Bryce Lanham
           *
           * SPDX-License-Identifier: GPL-2.0-or-later
           */

          #include "qemu/osdep.h"
          #include "hw/ia64/ipf-spad.h"
          #include "migration/vmstate.h"
          #include "qemu/bswap.h"
          #include "qemu/module.h"

          struct IA64IPFSPADState {
              SysBusDevice parent_obj;

              MemoryRegion mmio;
              uint8_t data[IA64_IPF_SPAD_SIZE];
          };

          static uint64_t ipf_spad_read(void *opaque, hwaddr offset,
                                        unsigned int size)
          {
              IA64IPFSPADState *s = opaque;
              const uint8_t *p;

              if (offset + size > sizeof(s->data)) {
                  return 0;
              }
              p = &s->data[offset];

              switch (size) {
              case 1:
                  return ldub_p(p);
              case 2:
                  return lduw_le_p(p);
              case 4:
                  return ldl_le_p(p);
              case 8:
                  return ldq_le_p(p);
              default:
                  return 0;
              }
          }

          static void ipf_spad_write(void *opaque, hwaddr offset,
                                     uint64_t value, unsigned int size)
          {
              IA64IPFSPADState *s = opaque;
              uint8_t *p;

              if (offset + size > sizeof(s->data)) {
                  return;
              }
              p = &s->data[offset];

              switch (size) {
              case 1:
                  stb_p(p, value);
                  break;
              case 2:
                  stw_le_p(p, value);
                  break;
              case 4:
                  stl_le_p(p, value);
                  break;
              case 8:
                  stq_le_p(p, value);
                  break;
              default:
                  break;
              }
          }

          static const MemoryRegionOps ipf_spad_ops = {
              .read = ipf_spad_read,
              .write = ipf_spad_write,
              .endianness = DEVICE_LITTLE_ENDIAN,
              .valid = {
                  .min_access_size = 1,
                  .max_access_size = 8,
                  .unaligned = true,
              },
              .impl = {
                  .min_access_size = 1,
                  .max_access_size = 8,
              },
          };

          static void ipf_spad_init_state(IA64IPFSPADState *s)
          {
              static const uint8_t bsp_signature[8] = {
                  0x20, 0x5f, 0x5f, 0x42, 0x53, 0x50, 0x5f, 0x5f,
              };
              uint8_t *record =
                  &s->data[IA64_IPF_SPAD_MP_RECORD_OFFSET];

              memset(s->data, 0xff, sizeof(s->data));
              stq_le_p(&s->data[IA64_IPF_SPAD_LOCK_PTR_OFFSET],
                       IA64_IPF_SPAD_BASE);
              memset(record, 0, IA64_IPF_SPAD_MP_RECORD_SIZE);
              memcpy(record + IA64_IPF_SPAD_MP_SIGNATURE_OFFSET,
                     bsp_signature, sizeof(bsp_signature));
          }

          static void ipf_spad_init(Object *obj)
          {
              IA64IPFSPADState *s = IA64_IPF_SPAD(obj);
              SysBusDevice *sbd = SYS_BUS_DEVICE(obj);

              ipf_spad_init_state(s);
              memory_region_init_io(&s->mmio, obj, &ipf_spad_ops, s,
                                    TYPE_IA64_IPF_SPAD,
                                    IA64_IPF_SPAD_SIZE);
              sysbus_init_mmio(sbd, &s->mmio);
          }

          static const VMStateDescription vmstate_ipf_spad = {
              .name = TYPE_IA64_IPF_SPAD,
              .version_id = 1,
              .minimum_version_id = 1,
              .fields = (const VMStateField[]) {
                  VMSTATE_UINT8_ARRAY(data, IA64IPFSPADState,
                                      IA64_IPF_SPAD_SIZE),
                  VMSTATE_END_OF_LIST()
              },
          };

          static void ipf_spad_class_init(ObjectClass *klass, const void *data)
          {
              DeviceClass *dc = DEVICE_CLASS(klass);

              dc->vmsd = &vmstate_ipf_spad;
              dc->desc = "IA-64 IPF firmware scratchpad";
              dc->user_creatable = false;
          }

          static const TypeInfo ipf_spad_info = {
              .name = TYPE_IA64_IPF_SPAD,
              .parent = TYPE_SYS_BUS_DEVICE,
              .instance_size = sizeof(IA64IPFSPADState),
              .instance_init = ipf_spad_init,
              .class_init = ipf_spad_class_init,
          };

          static void ipf_spad_register_types(void)
          {
              type_register_static(&ipf_spad_info);
          }

          type_init(ipf_spad_register_types)
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def remove_between(text: str, start: str, end: str) -> str:
              assert text.count(start) == 1, start
              first = text.index(start)
              last = text.index(end, first + len(start))
              return text[:first] + text[last:]

          def replace_once(text: str, old: str, new: str) -> str:
              assert text.count(old) == 1, old
              return text.replace(old, new, 1)

          path = Path("hw/ia64/ipf.c")
          text = path.read_text()
          text = replace_once(
              text,
              '#include "hw/ia64/ipf-460gx.h"\n',
              '#include "hw/ia64/ipf-460gx.h"\n'
              '#include "hw/ia64/ipf-spad.h"\n')
          text = replace_once(
              text,
              "    IA64IPF460GXState *gx;\n",
              "    IA64IPF460GXState *gx;\n"
              "    IA64IPFSPADState *spad;\n")
          text = remove_between(
              text,
              "/*\n * xenipf SPad scratchpad area.",
              "/* Firmware volume / file type values from EDK1 headers. */")
          text = remove_between(
              text,
              "static void ipf_fw_seed_spad(void)\n",
              "static size_t ipf_fw_align_up")
          text = replace_once(
              text,
              "        if (run_firmware) {\n"
              "            ipf_fw_seed_spad();\n"
              "            ipf_fw_seed_spad_mp();\n"
              "        }\n",
              "")

          marker = "static void ipf_init_460gx(IPFMachineState *m)\n"
          spad_init = (
              "static void ipf_init_spad(IPFMachineState *m,\n"
              "                          MemoryRegion *sysmem)\n"
              "{\n"
              "    DeviceState *dev = qdev_new(TYPE_IA64_IPF_SPAD);\n"
              "    SysBusDevice *sbd = SYS_BUS_DEVICE(dev);\n"
              "    MemoryRegion *mmio;\n"
              "\n"
              "    sysbus_realize_and_unref(sbd, &error_fatal);\n"
              "    mmio = sysbus_mmio_get_region(sbd, 0);\n"
              "    memory_region_add_subregion_overlap(sysmem,\n"
              "                                        IA64_IPF_SPAD_BASE,\n"
              "                                        mmio, 2);\n"
              "    m->spad = IA64_IPF_SPAD(dev);\n"
              "\n"
              "    DPRINTF(\"SPad: mapped at 0x%016\" PRIx64\n"
              "            \" size=0x%x\\n\",\n"
              "            (uint64_t)IA64_IPF_SPAD_BASE,\n"
              "            IA64_IPF_SPAD_SIZE);\n"
              "}\n"
              "\n")
          text = replace_once(text, marker, spad_init + marker)
          marker = (
              "    }\n"
              "\n"
              "    /*\n"
              "     * Hardware topology is independent of the selected payload. Firmware and\n")
          text = replace_once(
              text,
              marker,
              "    }\n"
              "\n"
              "    ipf_init_spad(m, sysmem);\n"
              "\n"
              "    /*\n"
              "     * Hardware topology is independent of the selected payload. Firmware and\n")
          path.write_text(text)

          path = Path("hw/ia64/meson.build")
          text = path.read_text()
          text = replace_once(
              text,
              "ia64_ss.add(files('virt.c', 'ipf.c', 'ipf-460gx.c', 'gfw.c', "
              "'iosapic.c', 'iosapic-core.c'))\n",
              "ia64_ss.add(files(\n"
              "  'virt.c',\n"
              "  'ipf.c',\n"
              "  'ipf-460gx.c',\n"
              "  'ipf-spad.c',\n"
              "  'gfw.c',\n"
              "  'iosapic.c',\n"
              "  'iosapic-core.c',\n"
              "))\n")
          path.write_text(text)

          path = Path("tests/qtest/ia64-ipf-test.c")
          text = path.read_text()
          marker = "#define IPF_GX_MMIO_CC0             0x0cc0\n"
          text = replace_once(
              text,
              marker,
              marker +
              "#define IPF_SPAD_BASE               UINT64_C(0xff37fc00)\n"
              "#define IPF_SPAD_LOCK_PTR_OFFSET    0x008\n"
              "#define IPF_SPAD_TEST_OFFSET        0x100\n"
              "#define IPF_SPAD_MP_RECORD_OFFSET   0x168\n"
              "#define IPF_SPAD_MP_SIGNATURE_OFFSET 0x020\n"
              "#define IPF_SPAD_ERASED_OFFSET      0x300\n"
              "#define IPF_SPAD_BSP_SIGNATURE      "
              "UINT64_C(0x5f5f5053425f5f20)\n"
              "#define IPF_SPAD_TEST_VALUE         "
              "UINT64_C(0x123456789abcdef0)\n")

          marker = "static void test_460gx_reset(void)\n"
          test = (
              "static void test_spad_state_and_reset(void)\n"
              "{\n"
              "    QTestState *qts = ipf_qtest_start();\n"
              "\n"
              "    g_assert_cmphex(\n"
              "        qtest_readq(qts, IPF_SPAD_BASE +\n"
              "                    IPF_SPAD_LOCK_PTR_OFFSET),\n"
              "        ==, IPF_SPAD_BASE);\n"
              "    g_assert_cmphex(\n"
              "        qtest_readq(qts, IPF_SPAD_BASE +\n"
              "                    IPF_SPAD_MP_RECORD_OFFSET),\n"
              "        ==, 0);\n"
              "    g_assert_cmphex(\n"
              "        qtest_readq(qts, IPF_SPAD_BASE +\n"
              "                    IPF_SPAD_MP_RECORD_OFFSET +\n"
              "                    IPF_SPAD_MP_SIGNATURE_OFFSET),\n"
              "        ==, IPF_SPAD_BSP_SIGNATURE);\n"
              "    g_assert_cmphex(\n"
              "        qtest_readq(qts, IPF_SPAD_BASE +\n"
              "                    IPF_SPAD_ERASED_OFFSET),\n"
              "        ==, UINT64_MAX);\n"
              "\n"
              "    qtest_writeq(qts, IPF_SPAD_BASE + IPF_SPAD_TEST_OFFSET,\n"
              "                 IPF_SPAD_TEST_VALUE);\n"
              "    qtest_system_reset(qts);\n"
              "\n"
              "    g_assert_cmphex(\n"
              "        qtest_readq(qts, IPF_SPAD_BASE +\n"
              "                    IPF_SPAD_TEST_OFFSET),\n"
              "        ==, IPF_SPAD_TEST_VALUE);\n"
              "    g_assert_cmphex(\n"
              "        qtest_readq(qts, IPF_SPAD_BASE +\n"
              "                    IPF_SPAD_LOCK_PTR_OFFSET),\n"
              "        ==, IPF_SPAD_BASE);\n"
              "    g_assert_cmphex(\n"
              "        qtest_readq(qts, IPF_SPAD_BASE +\n"
              "                    IPF_SPAD_MP_RECORD_OFFSET +\n"
              "                    IPF_SPAD_MP_SIGNATURE_OFFSET),\n"
              "        ==, IPF_SPAD_BSP_SIGNATURE);\n"
              "\n"
              "    qtest_quit(qts);\n"
              "}\n"
              "\n")
          text = replace_once(text, marker, test + marker)
          marker = (
              '    qtest_add_func("/ia64/ipf/460gx-reset", '
              'test_460gx_reset);\n')
          text = replace_once(
              text,
              marker,
              '    qtest_add_func("/ia64/ipf/spad-state-reset",\n'
              '                   test_spad_state_and_reset);\n' +
              marker)
          path.write_text(text)

          path = Path("docs/devel/ia64-ipf-port-status.rst")
          text = path.read_text()
          text = replace_once(
              text,
              "       GP-relative globals, or fixed status-code pointers; move the remaining\n"
              "       variable-store and scratchpad provisioning into explicit platform state.\n",
              "       GP-relative globals, or fixed status-code pointers; move the remaining\n"
              "       variable-store provisioning into explicit platform state.\n")
          marker = (
              "   * - 460GX host functions\n"
              "     - Resettable, migratable QOM device\n"
              "     - Complete chipset behavior beyond the firmware-visible sparse\n"
              "       configuration and CB0/CC0 windows.\n")
          text = replace_once(
              text,
              marker,
              marker +
              "   * - 460GX SPad scratchpad\n"
              "     - Dedicated migratable QOM device\n"
              "     - The base pointer and BSP record are platform state and guest writes\n"
              "       persist across reset; validate additional firmware-visible fields.\n")
          text = replace_once(
              text,
              "   * - Migration\n"
              "     - Partial\n"
              "     - Custom 460GX and I/O SAPIC devices have VMState; complete CPU, firmware,\n"
              "       and remaining machine-owned state and add migration tests.\n",
              "   * - Migration\n"
              "     - Partial\n"
              "     - Custom 460GX, SPad, and I/O SAPIC devices have VMState; complete CPU,\n"
              "       firmware, and remaining machine-owned state and add migration tests.\n")
          text = replace_once(
              text,
              "buses, and the standard virtio PCI storage transport.  The I/O SAPIC and 460GX\n"
              "facade are separate QOM devices rather than in-file register shims.\n",
              "buses, and the standard virtio PCI storage transport.  The I/O SAPIC, 460GX\n"
              "facade, and SPad scratchpad are separate QOM devices rather than in-file\n"
              "register shims.\n")
          marker = (
              "mutation predicates is verified unchanged; the bundled-firmware audit found\n"
              "no image that depended on those paths.\n")
          text = replace_once(
              text,
              marker,
              marker +
              "The fixed SPad window is now one payload-independent device with VMState.\n"
              "Its base pointer and BSP record are initialized as chipset state instead of\n"
              "being written into erased GFW bytes during firmware loading.\n")
          path.write_text(text)
          PY

          ! grep -Eq 'ipf_fw_seed_spad|IPF_SPAD_(LOCK_PTR|MP_RECORD)' \
            hw/ia64/ipf.c
          grep -q 'TYPE_IA64_IPF_SPAD' hw/ia64/ipf.c
          git diff --check
          git diff > /tmp/ia64-spad-device.patch
          perl scripts/checkpatch.pl --no-signoff --strict \
            /tmp/ia64-spad-device.patch

      - name: Install build and documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config python3 python3-venv \
            python3-docutils libglib2.0-dev libpixman-1-dev zlib1g-dev \
            libslirp-dev

      - name: Validate documentation
        run: |
          rst2html docs/devel/ia64-ipf-port-status.rst \
            /tmp/ia64-ipf-port-status.html

      - name: Configure and build IA-64
        run: |
          ./configure \
            --target-list=ia64-softmmu \
            --disable-werror \
            --disable-docs \
            --disable-gtk \
            --disable-sdl
          ninja -C build \
            qemu-system-ia64 \
            tests/unit/test-ia64-interrupt \
            tests/unit/test-ia64-iosapic \
            tests/qtest/ia64-ipf-test

      - name: Run architectural and machine contracts
        shell: bash
        run: |
          set -euo pipefail
          build/tests/unit/test-ia64-interrupt --tap -k \
            | tee /tmp/test-ia64-interrupt.tap
          build/tests/unit/test-ia64-iosapic --tap -k \
            | tee /tmp/test-ia64-iosapic.tap
          QTEST_QEMU_BINARY=./build/qemu-system-ia64 \
            build/tests/qtest/ia64-ipf-test --tap -k \
            | tee /tmp/ia64-ipf-test.tap
          grep -q 'ok .*spad-state-reset' /tmp/ia64-ipf-test.tap

      - name: Smoke bundled SDV firmware with the explicit SPad device
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/ia64-spad-firmware-smoke
          mkdir -p "$out"
          : > "$out/summary.tsv"

          for firmware in \
            'stuff/EFI 0.99 Debug SDV.bin' \
            'stuff/Unknown Ver EFI.bin' \
            'stuff/bios117c.BIN' \
            'stuff/bios130.BIN' \
            'stuff/mybios.bin' \
            'stuff/rx4610_109B.BIN' \
            'stuff/rx4610_117B.BIN'; do
            test -f "$firmware"
            stem="$(basename "$firmware" | tr ' ' '_')"
            serial="$out/$stem.serial.log"
            qlog="$out/$stem.qemu.log"
            set +e
            timeout --signal=TERM --kill-after=2s 4s \
              build/qemu-system-ia64 \
                -machine ipf \
                -m 256M \
                -bios "$firmware" \
                -display none \
                -serial "file:$serial" \
                -monitor none \
                -no-reboot \
                -d guest_errors \
                -D "$qlog"
            rc=$?
            set -e
            case "$rc" in
              0|124|143) ;;
              *)
                echo "firmware smoke failed: $firmware rc=$rc" >&2
                cat "$qlog" >&2 || true
                exit 1
                ;;
            esac
            printf '%s\t%s\t%s\t%s\n' \
              "$firmware" "$rc" \
              "$(wc -c < "$serial")" \
              "$(wc -c < "$qlog")" >> "$out/summary.tsv"
          done

          cat "$out/summary.tsv"

      - name: Publish the tested commit and fast-forward metachicken
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            hw/ia64/ipf-spad.c \
            hw/ia64/ipf-spad.h \
            hw/ia64/ipf.c \
            hw/ia64/meson.build \
            tests/qtest/ia64-ipf-test.c \
            docs/devel/ia64-ipf-port-status.rst
          git diff --cached --check
          git commit \
            -m 'hw/ia64: model the 460GX SPad scratchpad' \
            -m 'Replace firmware-load-time writes into erased GFW bytes with a dedicated payload-independent SysBus device. Initialize the lock-table pointer and BSP record as chipset state, preserve guest writes across reset, migrate the byte array, and cover the real MMIO window in qtest.'

          git push --force origin "HEAD:refs/heads/$OUTPUT_BRANCH"
          git fetch origin metachicken
          test "$(git rev-parse HEAD^)" = "$BASE_COMMIT"
          test "$(git rev-parse origin/metachicken)" = "$BASE_COMMIT"
          git push origin "HEAD:refs/heads/metachicken"
          git rev-parse HEAD | tee /tmp/ia64-spad-device-commit.txt

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ia64-spad-device-result
          path: |
            /tmp/ia64-spad-device.patch
            /tmp/ia64-spad-device-commit.txt
            /tmp/ia64-ipf-test.tap
            /tmp/test-ia64-interrupt.tap
            /tmp/test-ia64-iosapic.tap
            /tmp/ia64-ipf-port-status.html
            /tmp/ia64-spad-firmware-smoke/summary.tsv
            /tmp/ia64-spad-firmware-smoke/*.serial.log
            /tmp/ia64-spad-firmware-smoke/*.qemu.log
          retention-days: 2
          if-no-files-found: error
