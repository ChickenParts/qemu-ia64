name: Temporary IA-64 firmware handoff trace integration

on:
  push:
    branches:
      - ia64-rooster-bringup
    paths:
      - .github/workflows/ia64-fw-handoff-trace-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact bring-up branch
        uses: actions/checkout@v4
        with:
          ref: ia64-rooster-bringup
          fetch-depth: 0

      - name: Add observational firmware-to-RAM handoff trace
        shell: bash
        run: |
          set -euo pipefail
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p validation
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('target/ia64/helper.c')
          source = path.read_text()
          marker = '''
              /*
               * Heuristic call tracing to catch mis-mapped argument registers during
          '''
          if source.count(marker) != 1:
              raise SystemExit('helper_call tracing marker changed unexpectedly')

          block = dedent(r'''
              /*
               * Observe firmware-to-RAM control transfers without changing guest
               * state.  IA-64 firmware enters loaded images through a two-word
               * procedure label, so scan static-register pointer candidates for a
               * descriptor whose entry matches the call target.  This is gated and
               * bounded because helper_call() is otherwise a very hot path.
               */
              static int fw_handoff_trace = -1;
              static int fw_handoff_limit = -1;
              static int fw_handoff_count;
              if (fw_handoff_trace == -1) {
                  const char *s = getenv("QEMU_IA64_TRACE_FW_HANDOFF");
                  fw_handoff_trace =
                      s && *s && strcmp(s, "0") && strcmp(s, "off") &&
                      strcmp(s, "false") && strcmp(s, "no");
              }
              if (fw_handoff_limit == -1) {
                  const char *s = getenv("QEMU_IA64_TRACE_FW_HANDOFF_LIMIT");
                  fw_handoff_limit = s && *s ? atoi(s) : 16;
                  if (fw_handoff_limit < 0) {
                      fw_handoff_limit = 0;
                  }
              }
              if (fw_handoff_trace &&
                  (fw_handoff_limit == 0 ||
                   fw_handoff_count < fw_handoff_limit)) {
                  uint64_t pc_phys = ia64_phys_mode_addr(pc);
                  uint64_t tgt_phys = ia64_phys_mode_addr(tgt);
                  bool from_firmware =
                      pc_phys >= UINT64_C(0xff000000) &&
                      pc_phys <= UINT64_C(0xffffffff);
                  bool to_ram =
                      tgt_phys >= UINT64_C(0x00100000) &&
                      tgt_phys < UINT64_C(0xff000000);

                  if (from_firmware && to_ram) {
                      CPUState *cs = env_cpu(env);
                      bool found_descriptor = false;

                      qemu_log_mask(LOG_GUEST_ERROR,
                                    "IA64: fw_handoff_call pc=%016" PRIx64
                                    " tgt=%016" PRIx64
                                    " pc_phys=%016" PRIx64
                                    " tgt_phys=%016" PRIx64
                                    " gp=%016" PRIx64
                                    " sp=%016" PRIx64
                                    " r13=%016" PRIx64
                                    " bsp=%016" PRIx64 "\n",
                                    pc, tgt, pc_phys, tgt_phys,
                                    env->r[1], env->r[12], env->r[13],
                                    env->ar[IA64_AR_BSP]);

                      for (unsigned int reg = 2; reg < 32; reg++) {
                          uint64_t raw = env->r[reg];
                          for (unsigned int back = 0; back <= 8; back += 8) {
                              uint64_t candidate;
                              uint8_t descriptor[16];
                              uint64_t entry;
                              uint64_t gp;
                              uint64_t entry_phys;

                              if (raw < back) {
                                  continue;
                              }
                              candidate = raw - back;
                              if (candidate < UINT64_C(0x1000)) {
                                  continue;
                              }
                              if (cpu_memory_rw_debug(
                                      cs, ia64_phys_mode_addr(candidate),
                                      descriptor, sizeof(descriptor), false) != 0) {
                                  continue;
                              }
                              memcpy(&entry, descriptor, sizeof(entry));
                              memcpy(&gp, descriptor + 8, sizeof(gp));
                              entry_phys = ia64_phys_mode_addr(entry);
                              if (((entry_phys ^ tgt_phys) & ~UINT64_C(0xf)) != 0) {
                                  continue;
                              }

                              qemu_log_mask(LOG_GUEST_ERROR,
                                            "IA64: fw_handoff_plabel r%u=%016"
                                            PRIx64 " back=%u fd=%016" PRIx64
                                            " entry=%016" PRIx64
                                            " entry_phys=%016" PRIx64
                                            " gp=%016" PRIx64
                                            " active_gp=%016" PRIx64 "\n",
                                            reg, raw, back, candidate,
                                            entry, entry_phys, gp, env->r[1]);
                              found_descriptor = true;
                          }
                      }
                      if (!found_descriptor) {
                          qemu_log_mask(LOG_GUEST_ERROR,
                                        "IA64: fw_handoff_plabel_not_found"
                                        " pc=%016" PRIx64
                                        " tgt=%016" PRIx64 "\n",
                                        pc, tgt);
                      }
                      fw_handoff_count++;
                  }
              }

          ''')
          source = source.replace(marker, '\n' + block + marker, 1)
          assert 'QEMU_IA64_TRACE_FW_HANDOFF' in source
          assert 'fw_handoff_plabel' in source
          assert 'found_descriptor = true;' in source
          path.write_text(source)
          PY

          git diff --check
          git diff --binary > validation/ia64-fw-handoff-trace.patch
          ./scripts/checkpatch.pl --strict --no-signoff --color=never \
            validation/ia64-fw-handoff-trace.patch \
            2>&1 | tee validation/checkpatch.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libglib2.0-dev libpixman-1-dev \
            ninja-build pkg-config python3 python3-venv zlib1g-dev

      - name: Build IA-64 system emulator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-fw-handoff
          mkdir build-fw-handoff
          (
            cd build-fw-handoff
            ../configure \
              --target-list=ia64-softmmu \
              --disable-docs \
              --disable-gtk \
              --disable-sdl \
              --disable-vnc \
              --disable-werror
          ) 2>&1 | tee validation/configure.txt
          ninja -C build-fw-handoff -j"$(nproc)" qemu-system-ia64 \
            2>&1 | tee validation/build.txt
          build-fw-handoff/qemu-system-ia64 --version \
            | tee validation/version.txt

      - name: Commit trace and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ia64-fw-handoff-trace-integration.yml
          git add target/ia64/helper.c
          git commit -m \
            'target/ia64: trace firmware procedure-label handoffs'
          git fetch origin ia64-rooster-bringup
          test "$(git rev-parse origin/ia64-rooster-bringup)" = "$BASE_SHA"
          git push origin HEAD:ia64-rooster-bringup
          git format-patch -1 --stdout > validation/commit.patch
          git rev-parse HEAD > validation/HEAD

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia64-fw-handoff-trace-${{ github.run_id }}
          path: validation/
          retention-days: 7
          if-no-files-found: error
