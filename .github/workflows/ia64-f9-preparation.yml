name: IA-64 F9 pinned source preparation
on:
  push:
    branches: [staging/ia64-f9-exceptions-20261006]
    paths: [.github/workflows/ia64-f9-preparation.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7dedeecf720806efef5ffeabaf04adc344a74dad
          persist-credentials: false
      - name: Export exact existing public source
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = 7dedeecf720806efef5ffeabaf04adc344a74dad
          mkdir -p /tmp/ia64-source
          git archive HEAD | gzip -1 > /tmp/ia64-source/source.tar.gz
          git rev-parse HEAD > /tmp/ia64-source/source-head.txt
          sha256sum /tmp/ia64-source/source.tar.gz > /tmp/ia64-source/source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ia64-f9-pinned-source
          path: /tmp/ia64-source/
          retention-days: 1
          if-no-files-found: error
