name: IA64 Merced sequential UIA slot2 real-IVT qualification

on:
  push:
    branches: [work/ia64-uia-sequential-boundary]
    paths:
      - .github/workflows/ia64-uia-sequential-validation.yml
      - target/ia64/**
      - tests/ia64/nonf/**
      - scripts/run-ia64-uia-sequential-tests.py
  pull_request:
    paths:
      - .github/workflows/ia64-uia-sequential-validation.yml
      - target/ia64/**
      - tests/ia64/nonf/**
      - scripts/run-ia64-uia-sequential-tests.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ia64-uia-sequential-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sequential:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install GNU IA64 and QEMU dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils-ia64-linux-gnu libglib2.0-dev \
            libpixman-1-dev ninja-build pkg-config python3 zlib1g-dev
      - name: Exact source and policy audits, GNU assembled edge guests
        run: |
          set -euo pipefail
          mkdir -p scratch/uia-sequential-evidence
          cc -std=gnu2x -O2 -Wall -Wextra -Werror \
            -o scratch/uia-sequential-evidence/edge-policy \
            tests/ia64/nonf/uia-sequential-policy-test.c
          scratch/uia-sequential-evidence/edge-policy | \
            tee scratch/uia-sequential-evidence/policy.txt
          python3 -m unittest discover -s tests/ia64/nonf -p 'test_*.py' -v
          python3 scripts/ia64-nonf-fallback-audit.py --check
          python3 scripts/run-ia64-uia-sequential-tests.py --assemble-only \
            --out scratch/uia-sequential-evidence/assembly
          git diff --exit-code
      - name: Clean full qemu-system-ia64 build
        run: |
          set -euo pipefail
          mkdir build-uia-sequential
          (cd build-uia-sequential; ../configure --target-list=ia64-softmmu \
            --disable-docs --disable-gtk --disable-sdl --disable-vnc \
            --disable-slirp --disable-werror)
          ninja -C build-uia-sequential -j"$(nproc)" qemu-system-ia64
      - name: Execute real virtual edge and inherited IVT guests
        run: |
          set -euo pipefail
          QEMU=build-uia-sequential/qemu-system-ia64
          python3 scripts/run-ia64-uia-sequential-tests.py \
            --qemu "$QEMU" --out scratch/uia-sequential-evidence/sequential --timeout 10
          python3 scripts/run-ia64-uia-branch-tests.py \
            --qemu "$QEMU" --out scratch/uia-sequential-evidence/branch --timeout 10
          python3 scripts/run-ia64-uia-rfi-tests.py \
            --qemu "$QEMU" --out scratch/uia-sequential-evidence/rfi --timeout 10
          python3 scripts/run-ia64-single-step-tests.py \
            --qemu "$QEMU" --out scratch/uia-sequential-evidence/ss --timeout 10
          python3 scripts/run-ia64-lower-privilege-tests.py \
            --qemu "$QEMU" --out scratch/uia-sequential-evidence/lp --timeout 10
          python3 scripts/run-ia64-fp-ss-priority-tests.py \
            --qemu "$QEMU" --out scratch/uia-sequential-evidence/fp-ss --timeout 10
          python3 scripts/run-ia64-ifs-rfi-tests.py \
            --qemu "$QEMU" --out scratch/uia-sequential-evidence/ifs --timeout 10
      - name: Retain exact source and emulator hashes
        if: always()
        run: |
          mkdir -p scratch/uia-sequential-evidence
          git rev-parse HEAD > scratch/uia-sequential-evidence/source-head.txt
          test ! -f build-uia-sequential/qemu-system-ia64 || \
            sha256sum build-uia-sequential/qemu-system-ia64 \
            > scratch/uia-sequential-evidence/qemu-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ia64-uia-sequential-evidence
          path: scratch/uia-sequential-evidence
          retention-days: 14
          if-no-files-found: error
