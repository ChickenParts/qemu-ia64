name: IA-64 HOB migration analysis

on:
  push:
    branches:
      - ia64-rooster-bringup
    paths:
      - scripts/analyze-ia64-hob-migration.py
      - tests/unit/test-ia64-hob-migration.py
      - .github/workflows/ia64-hob-migration-analysis.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-lists:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact bring-up branch
        uses: actions/checkout@v4
        with:
          ref: ia64-rooster-bringup
          fetch-depth: 1

      - name: Exercise parser, classifier, and offline repair
        run: |
          set -euo pipefail
          python3 tests/unit/test-ia64-hob-migration.py
          python3 -m py_compile \
            scripts/analyze-ia64-hob-migration.py \
            tests/unit/test-ia64-hob-migration.py
          git diff --check
