name: Reconcile IA-64 FV HOB probe record safety

on:
  push:
    branches:
      - ia64-rooster-bringup
    paths:
      - .github/workflows/ia64-hob-probe-safety-reconcile.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ia64-hob-probe-safety-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          ref: ia64-rooster-bringup
          fetch-depth: 0

      - name: Require the exact EFI_HOB_FIRMWARE_VOLUME layout
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('hw/ia64/hob-migration-causality.c')
          text = path.read_text()
          old = '''        if (type == IA64_HOB_FV && length >= 24 &&
            info->fv_count < IA64_HOB_MAX_FVS) {
'''
          new = '''        if (type == IA64_HOB_FV &&
            length == sizeof(((struct Ia64HobFvRecord *)0)->raw) &&
            info->fv_count < IA64_HOB_MAX_FVS) {
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('FV HOB parser shape changed unexpectedly')
          path.write_text(text)

          analyzer = Path('scripts/analyze-ia64-hob-migration.py')
          text = analyzer.read_text()
          text = text.replace(
              'if self.hob_type != HOB_FV or self.length < 24:',
              'if self.hob_type != HOB_FV or self.length != 24:',
          )
          analyzer.write_text(text)
          PY
          python3 tests/unit/test-ia64-hob-migration.py
          python3 scripts/check-ia64-rooster-branch.py
          git diff --check

      - name: Install QEMU build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config python3 \
            libglib2.0-dev libpixman-1-dev libslirp-dev zlib1g-dev

      - name: Compile the exact-layout probe transiently
        run: |
          set -euo pipefail
          cp hw/ia64/meson.build /tmp/ia64-meson.build
          python3 scripts/include-ia64-hob-causality.py
          ./configure \
            --target-list=ia64-softmmu \
            --disable-docs --disable-gtk --disable-sdl --disable-werror
          ninja -C build qemu-system-ia64
          mv /tmp/ia64-meson.build hw/ia64/meson.build
          git diff --check

      - name: Remove one-shot workflow and commit validated safety fix
        run: |
          set -euo pipefail
          rm .github/workflows/ia64-hob-probe-safety-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'target/ia64: require exact FV HOB records in causality probe'
          git fetch origin ia64-rooster-bringup
          git rebase origin/ia64-rooster-bringup
          git push origin HEAD:ia64-rooster-bringup
