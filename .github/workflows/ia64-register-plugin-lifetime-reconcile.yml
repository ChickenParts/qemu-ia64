name: Reconcile IA-64 register sampler lifetimes

on:
  push:
    branches:
      - ia64-rooster-bringup
    paths:
      - .github/workflows/ia64-register-plugin-lifetime-reconcile.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ia64-register-plugin-lifetime
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Let the coherent tranche reconciler settle
        run: sleep 240

      - name: Check out latest branch
        uses: actions/checkout@v4
        with:
          ref: ia64-rooster-bringup
          fetch-depth: 0

      - name: Install an exact ownership-safe register helper
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('contrib/plugins/ia64-hob-write-regs.c')
          text = path.read_text()
          start = text.index('static void append_register(')
          end = text.index('\nstatic void trace_store(', start)
          replacement = '''static void append_register(GString *line, const char *name,
                            struct qemu_plugin_register *handle)
{
    GByteArray *value;
    unsigned int index;

    if (handle == NULL) {
        return;
    }
    value = g_byte_array_new();
    if (qemu_plugin_read_register(handle, value) <= 0) {
        g_byte_array_unref(value);
        return;
    }
    g_string_append_printf(line, " %s=", name);
    for (index = 0; index < value->len; index++) {
        g_string_append_printf(line, "%02x", value->data[index]);
    }
    g_byte_array_unref(value);
}
'''
          text = text[:start] + replacement + text[end:]
          if text.count('g_byte_array_unref(value);') != 2:
              raise SystemExit('append_register must unref on both paths')
          if 'g_autoptr(' in text:
              raise SystemExit('automatic GLib pointer remains in plugin')
          path.write_text(text)
          PY
          git diff --check

      - name: Compile the corrected plugin
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libglib2.0-dev
          bash scripts/build-ia64-hob-register-plugin.sh \
            "$PWD/libia64-hob-write-regs.so"
          test -s libia64-hob-write-regs.so

      - name: Remove one-shot workflow and commit validated lifetime fix
        run: |
          set -euo pipefail
          rm .github/workflows/ia64-register-plugin-lifetime-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'contrib/plugins: close IA-64 register sample lifetimes'
          git fetch origin ia64-rooster-bringup
          git rebase origin/ia64-rooster-bringup
          git push origin HEAD:ia64-rooster-bringup
