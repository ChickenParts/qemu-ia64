name: IA64 FP trap and PSR.ss priority real-IVT qualification

on:
  push:
    branches: [work/ia64-fp-ss-priority]
    paths:
      - .github/workflows/ia64-fp-ss-priority-validation.yml
      - target/ia64/**
      - tests/ia64/nonf/**
      - scripts/run-ia64-fp-ss-priority-tests.py
      - scripts/run-ia64-fp-exception-tests.py
      - scripts/run-ia64-single-step-tests.py
      - docs/generated/ia64-nonf-fallbacks.md
  pull_request:
    paths:
      - .github/workflows/ia64-fp-ss-priority-validation.yml
      - target/ia64/**
      - tests/ia64/nonf/**
      - scripts/run-ia64-fp-ss-priority-tests.py
      - scripts/run-ia64-fp-exception-tests.py
      - scripts/run-ia64-single-step-tests.py
      - docs/generated/ia64-nonf-fallbacks.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ia64-fp-ss-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fp-ss-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install cross binutils and QEMU build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils-ia64-linux-gnu libglib2.0-dev \
            libpixman-1-dev ninja-build pkg-config python3 zlib1g-dev
      - name: Qualify portable policy, source and real guest assembly
        run: |
          set -euo pipefail
          mkdir -p scratch/fp-ss-evidence
          cc -std=gnu2x -O2 -Wall -Wextra -Werror \
            -o scratch/fp-ss-evidence/fp-ss-policy \
            tests/ia64/nonf/fp-ss-priority-policy-test.c
          scratch/fp-ss-evidence/fp-ss-policy | tee scratch/fp-ss-evidence/host-policy.txt
          python3 scripts/ia64-nonf-fallback-audit.py --check
          python3 -m unittest discover -s tests/ia64/nonf -p 'test_*.py' -v
          python3 scripts/run-ia64-fp-ss-priority-tests.py \
            --assemble-only --out scratch/fp-ss-evidence/assembly
          git diff --exit-code
      - name: Clean build qemu-system-ia64
        run: |
          set -euo pipefail
          mkdir build-fp-ss
          (cd build-fp-ss; ../configure --target-list=ia64-softmmu \
             --disable-docs --disable-gtk --disable-sdl --disable-vnc \
             --disable-slirp --disable-werror)
          ninja -C build-fp-ss -j"$(nproc)" qemu-system-ia64
      - name: Execute FP+SS and inherited FP / SS / LP / TB real QEMU guests
        run: |
          set -euo pipefail
          python3 scripts/run-ia64-fp-ss-priority-tests.py \
            --qemu build-fp-ss/qemu-system-ia64 --out scratch/fp-ss-evidence/fp-ss --timeout 10
          python3 scripts/run-ia64-fp-exception-tests.py \
            --qemu build-fp-ss/qemu-system-ia64 --out scratch/fp-ss-evidence/fp10 --timeout 10
          python3 scripts/run-ia64-f12-f15-exception-tests.py \
            --qemu build-fp-ss/qemu-system-ia64 --out scratch/fp-ss-evidence/f12-f15 --timeout 10
          python3 scripts/run-ia64-single-step-tests.py \
            --qemu build-fp-ss/qemu-system-ia64 --out scratch/fp-ss-evidence/ss --timeout 10
          python3 scripts/run-ia64-lower-privilege-tests.py \
            --qemu build-fp-ss/qemu-system-ia64 --out scratch/fp-ss-evidence/lp --timeout 10
          python3 scripts/run-ia64-taken-branch-tests.py \
            --qemu build-fp-ss/qemu-system-ia64 --out scratch/fp-ss-evidence/tb --timeout 10
          python3 scripts/run-ia64-ifs-rfi-tests.py \
            --qemu build-fp-ss/qemu-system-ia64 --out scratch/fp-ss-evidence/ifs --timeout 10
      - name: Retain exact source and emulator hashes
        if: always()
        run: |
          mkdir -p scratch/fp-ss-evidence
          git rev-parse HEAD > scratch/fp-ss-evidence/source-head.txt
          test ! -f build-fp-ss/qemu-system-ia64 || \
            sha256sum build-fp-ss/qemu-system-ia64 > scratch/fp-ss-evidence/qemu-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ia64-fp-ss-priority-validation
          path: scratch/fp-ss-evidence
          retention-days: 14
          if-no-files-found: error
