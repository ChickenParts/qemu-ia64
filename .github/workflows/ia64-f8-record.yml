name: IA-64 F8 audit recording
on:
  push:
    branches: [work/ia64-f8]
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependency
        run: python3 -m pip install -r tests/ia64/isa/requirements.txt
      - name: Record reviewed F8 audit delta
        run: |
          set -euo pipefail
          python3 scripts/ia64-isa-coverage.py --record
          mkdir -p scratch/f8-record/docs/generated scratch/f8-record/tests/ia64/isa
          cp docs/generated/ia64-instruction-coverage.md scratch/f8-record/docs/generated/
          cp tests/ia64/isa/f-unit-baseline.json5 scratch/f8-record/tests/ia64/isa/
          python3 scripts/ia64-isa-coverage.py --check --output scratch/f8-record/observations.json
      - uses: actions/upload-artifact@v4
        with:
          name: ia64-f8-record-${{ github.run_id }}
          path: scratch/f8-record/
          retention-days: 2
          if-no-files-found: error
