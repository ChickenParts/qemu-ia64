name: IA-64 Rooster QEMU export

# Rebuild this bundle after IA-64 emulator, ABI-trace, or EFI-harness changes.
on:
  push:
    branches:
      - ia64-rooster-bringup
    paths:
      - .github/workflows/ia64-rooster-qemu-export.yml
      - hw/ia64/**
      - target/ia64/**
      - scripts/run-ia64-firmware.sh
      - scripts/run-ia64-efi-app.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact bring-up branch
        uses: actions/checkout@v4
        with:
          ref: ia64-rooster-bringup
          fetch-depth: 1

      - name: Install minimal system-emulator dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libglib2.0-dev \
            libpixman-1-dev \
            ninja-build \
            pkg-config \
            python3 \
            python3-venv \
            zlib1g-dev

      - name: Configure and build qemu-system-ia64
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-rooster
          mkdir build-rooster
          (
            cd build-rooster
            ../configure \
              --target-list=ia64-softmmu \
              --disable-docs \
              --disable-gtk \
              --disable-sdl \
              --disable-vnc \
              --disable-werror
          )
          ninja -C build-rooster -j"$(nproc)" qemu-system-ia64
          test -x build-rooster/qemu-system-ia64
          build-rooster/qemu-system-ia64 --version
          ldd build-rooster/qemu-system-ia64 | tee build-rooster/ldd.txt
          ! grep -F 'not found' build-rooster/ldd.txt

      - name: Stage portable test bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle=build-rooster/export
          mkdir -p "$bundle/scripts"
          install -m 0755 build-rooster/qemu-system-ia64 "$bundle/"
          install -m 0755 \
            scripts/run-ia64-firmware.sh \
            scripts/run-ia64-efi-app.sh \
            "$bundle/scripts/"
          install -m 0644 build-rooster/ldd.txt "$bundle/"
          git rev-parse HEAD > "$bundle/SOURCE_HEAD"
          sha256sum "$bundle/qemu-system-ia64" > "$bundle/SHA256SUMS"

      - name: Upload emulator bundle
        uses: actions/upload-artifact@v4
        with:
          name: qemu-system-ia64-rooster-${{ github.run_id }}
          path: build-rooster/export/
          retention-days: 7
          if-no-files-found: error
