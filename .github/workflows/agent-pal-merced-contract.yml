name: Temporary IA-64 Merced PAL contract validation

on:
  push:
    branches:
      - fix/pal-merced-contract-current
    paths:
      - .github/workflows/agent-pal-merced-contract.yml

permissions:
  contents: write

jobs:
  apply-build-test:
    if: "github.event.head_commit.message == 'ci: validate Merced PAL contract'"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pal-merced-contract-current
          fetch-depth: 0

      - name: Apply processor-model PAL contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          root = Path('.')

          (root / 'target/ia64/pal.h').write_text(dedent(r'''
          /*
           * IA-64 Processor Abstraction Layer result helpers
           *
           * SPDX-License-Identifier: LGPL-2.0-or-later
           */

          #ifndef TARGET_IA64_PAL_H
          #define TARGET_IA64_PAL_H

          #define IA64_PAL_STATUS_SUCCESS        0
          #define IA64_PAL_STATUS_UNIMPLEMENTED  (-1)
          #define IA64_PAL_STATUS_EINVAL         (-2)

          #define IA64_PAL_CACHE_TYPE_INSTRUCTION 1
          #define IA64_PAL_CACHE_TYPE_DATA        2
          #define IA64_PAL_CACHE_LEVELS           3
          #define IA64_PAL_UNIQUE_CACHES          4

          #define IA64_PAL_CACHE_ATTR_WT          0
          #define IA64_PAL_CACHE_ATTR_WB          1

          #define IA64_PAL_TC_LEVELS              1
          #define IA64_PAL_UNIQUE_TCS             2
          #define IA64_PAL_VM_PAGE_SIZES UINT64_C(0x115557000)

          /*
           * The IPF machine's default processor profile is the 800 MHz,
           * 4 MiB-L3 Merced configuration used by 460GX systems such as the
           * rx4610 and i2000.  TCG is not cycle accurate, but PAL must expose
           * one explicit, internally consistent processor contract.
           */
          #define IA64_PAL_MERCED_L3_SIZE UINT64_C(0x00400000)
          #define IA64_PAL_PLATFORM_BASE_HZ UINT64_C(100000000)
          #define IA64_PAL_MERCED_PROC_RATIO_NUM 8
          #define IA64_PAL_MERCED_PROC_RATIO_DEN 1
          #define IA64_PAL_MERCED_BUS_RATIO_NUM  4
          #define IA64_PAL_MERCED_BUS_RATIO_DEN  3
          #define IA64_PAL_VIRTUAL_ITC_RATIO_NUM 10
          #define IA64_PAL_VIRTUAL_ITC_RATIO_DEN 1

          typedef enum IA64PALAction {
              IA64_PAL_ACTION_RETURN = 0,
              IA64_PAL_ACTION_HALT,
          } IA64PALAction;

          typedef struct IA64PALResult {
              int64_t status;
              uint64_t v0;
              uint64_t v1;
              uint64_t v2;
              IA64PALAction action;
          } IA64PALResult;

          IA64PALResult ia64_pal_result_unimplemented(void);
          IA64PALResult ia64_pal_result_halt(void);
          IA64PALResult ia64_pal_result_cache_summary(void);
          IA64PALResult ia64_pal_result_cache_info(uint64_t level,
                                                   uint64_t type);
          IA64PALResult ia64_pal_result_vm_summary(unsigned int pkr_count,
                                                   unsigned int dtr_count,
                                                   unsigned int itr_count);
          IA64PALResult ia64_pal_result_vm_info(uint64_t level,
                                                uint64_t type,
                                                unsigned int entry_count);
          IA64PALResult ia64_pal_result_vm_page_size(void);
          IA64PALResult ia64_pal_result_proc_get_features(uint64_t feature_set);
          IA64PALResult ia64_pal_result_freq_base(void);
          IA64PALResult ia64_pal_result_freq_ratios(void);

          #endif
          ''').lstrip())

          (root / 'target/ia64/pal.c').write_text(dedent(r'''
          /*
           * IA-64 Processor Abstraction Layer result helpers
           *
           * SPDX-License-Identifier: LGPL-2.0-or-later
           */

          #include "qemu/osdep.h"
          #include "qemu/units.h"
          #include "pal.h"

          typedef struct IA64PALCacheDesc {
              uint32_t size;
              uint8_t attr;
              uint8_t associativity;
              uint8_t line_size;
              uint8_t stride;
              uint8_t store_latency;
              uint8_t load_latency;
              bool unified;
          } IA64PALCacheDesc;

          static IA64PALResult ia64_pal_result(int64_t status,
                                               uint64_t v0,
                                               uint64_t v1,
                                               uint64_t v2)
          {
              return (IA64PALResult) {
                  .status = status,
                  .v0 = v0,
                  .v1 = v1,
                  .v2 = v2,
                  .action = IA64_PAL_ACTION_RETURN,
              };
          }

          static uint64_t ia64_pal_freq_ratio(uint32_t numerator,
                                              uint32_t denominator)
          {
              return (uint64_t)denominator | ((uint64_t)numerator << 32);
          }

          static bool ia64_pal_cache_desc(uint64_t level, uint64_t type,
                                          IA64PALCacheDesc *desc)
          {
              if (level >= IA64_PAL_CACHE_LEVELS ||
                  (type != IA64_PAL_CACHE_TYPE_INSTRUCTION &&
                   type != IA64_PAL_CACHE_TYPE_DATA)) {
                  return false;
              }

              switch (level) {
              case 0:
                  *desc = (IA64PALCacheDesc) {
                      .size = 16 * KiB,
                      .attr = IA64_PAL_CACHE_ATTR_WT,
                      .associativity = 4,
                      .line_size = 5,
                      .stride = 5,
                      .store_latency =
                          type == IA64_PAL_CACHE_TYPE_DATA ? 2 : 0,
                      .load_latency =
                          type == IA64_PAL_CACHE_TYPE_DATA ? 2 : 1,
                  };
                  break;
              case 1:
                  *desc = (IA64PALCacheDesc) {
                      .size = 96 * KiB,
                      .attr = IA64_PAL_CACHE_ATTR_WB,
                      .associativity = 6,
                      .line_size = 6,
                      .stride = 6,
                      .store_latency = 6,
                      .load_latency = 6,
                      .unified = true,
                  };
                  break;
              case 2:
                  *desc = (IA64PALCacheDesc) {
                      .size = IA64_PAL_MERCED_L3_SIZE,
                      .attr = IA64_PAL_CACHE_ATTR_WB,
                      .associativity = 4,
                      .line_size = 6,
                      .stride = 6,
                      .store_latency = 21,
                      .load_latency = 21,
                      .unified = true,
                  };
                  break;
              default:
                  g_assert_not_reached();
              }

              return true;
          }

          IA64PALResult ia64_pal_result_unimplemented(void)
          {
              return ia64_pal_result(IA64_PAL_STATUS_UNIMPLEMENTED, 0, 0, 0);
          }

          IA64PALResult ia64_pal_result_halt(void)
          {
              IA64PALResult result = ia64_pal_result(
                  IA64_PAL_STATUS_SUCCESS, 0, 0, 0);

              result.action = IA64_PAL_ACTION_HALT;
              return result;
          }

          IA64PALResult ia64_pal_result_cache_summary(void)
          {
              return ia64_pal_result(IA64_PAL_STATUS_SUCCESS,
                                     IA64_PAL_CACHE_LEVELS,
                                     IA64_PAL_UNIQUE_CACHES, 0);
          }

          IA64PALResult ia64_pal_result_cache_info(uint64_t level,
                                                   uint64_t type)
          {
              IA64PALCacheDesc desc;
              uint64_t info1 = 0;
              uint64_t info2 = 0;

              if (!ia64_pal_cache_desc(level, type, &desc)) {
                  return ia64_pal_result(IA64_PAL_STATUS_EINVAL, 0, 0, 0);
              }

              /* pal_cache_config_info_1_t::pcci1_data */
              info1 |= (uint64_t)desc.unified;
              info1 |= (uint64_t)desc.attr << 1;
              info1 |= (uint64_t)desc.associativity << 8;
              info1 |= (uint64_t)desc.line_size << 16;
              info1 |= (uint64_t)desc.stride << 24;
              info1 |= (uint64_t)desc.store_latency << 32;
              info1 |= (uint64_t)desc.load_latency << 40;

              /*
               * pal_cache_config_info_2_t::pcci2_data.  The cache geometry
               * fixes the least-significant tag bit; the target implements
               * a 44-bit physical address, so bit 43 is the highest tag bit.
               * Alias-boundary and hint fields remain zero because the TCG
               * cacheless execution model has no such performance constraint.
               */
              info2 |= desc.size;
              info2 |= (uint64_t)desc.line_size << 40;
              info2 |= UINT64_C(43) << 48;

              return ia64_pal_result(IA64_PAL_STATUS_SUCCESS,
                                     info1, info2, 0);
          }

          IA64PALResult ia64_pal_result_vm_summary(unsigned int pkr_count,
                                                   unsigned int dtr_count,
                                                   unsigned int itr_count)
          {
              const uint8_t vw = 1;
              const uint8_t phys_add_size = 44;
              const uint8_t key_size = 18;
              const uint8_t hash_tag_id = 0;
              const uint8_t impl_va_msb = 60;
              const uint8_t rid_size = 18;
              const uint16_t max_purges = UINT16_MAX;
              uint64_t info1 = 0;
              uint64_t info2 = 0;

              if (pkr_count == 0 || pkr_count > 256 ||
                  dtr_count == 0 || dtr_count > 256 ||
                  itr_count == 0 || itr_count > 256) {
                  return ia64_pal_result(IA64_PAL_STATUS_EINVAL, 0, 0, 0);
              }

              info1 |= (uint64_t)vw;
              info1 |= (uint64_t)phys_add_size << 1;
              info1 |= (uint64_t)key_size << 8;
              info1 |= (uint64_t)(pkr_count - 1) << 16;
              info1 |= (uint64_t)hash_tag_id << 24;
              info1 |= (uint64_t)(dtr_count - 1) << 32;
              info1 |= (uint64_t)(itr_count - 1) << 40;
              info1 |= (uint64_t)IA64_PAL_UNIQUE_TCS << 48;
              info1 |= (uint64_t)IA64_PAL_TC_LEVELS << 56;

              info2 |= (uint64_t)impl_va_msb;
              info2 |= (uint64_t)rid_size << 8;
              info2 |= (uint64_t)max_purges << 16;

              return ia64_pal_result(IA64_PAL_STATUS_SUCCESS,
                                     info1, info2, 0);
          }

          IA64PALResult ia64_pal_result_vm_info(uint64_t level,
                                                uint64_t type,
                                                unsigned int entry_count)
          {
              uint64_t info = 0;

              if (level >= IA64_PAL_TC_LEVELS ||
                  (type != IA64_PAL_CACHE_TYPE_INSTRUCTION &&
                   type != IA64_PAL_CACHE_TYPE_DATA) ||
                  entry_count == 0 || entry_count > UINT8_MAX) {
                  return ia64_pal_result(IA64_PAL_STATUS_EINVAL, 0, 0, 0);
              }

              /*
               * TCG has one fully associative instruction TC and one fully
               * associative data TC.  The counts come from CPU state rather
               * than from a firmware compatibility constant.
               */
              info |= UINT64_C(1);                 /* num_sets */
              info |= (uint64_t)entry_count << 8;  /* associativity */
              info |= (uint64_t)entry_count << 16; /* num_entries */

              return ia64_pal_result(IA64_PAL_STATUS_SUCCESS,
                                     info, IA64_PAL_VM_PAGE_SIZES, 0);
          }

          IA64PALResult ia64_pal_result_vm_page_size(void)
          {
              return ia64_pal_result(IA64_PAL_STATUS_SUCCESS,
                                     IA64_PAL_VM_PAGE_SIZES,
                                     IA64_PAL_VM_PAGE_SIZES, 0);
          }

          IA64PALResult ia64_pal_result_proc_get_features(uint64_t feature_set)
          {
              /* No configurable processor feature sets are modeled. */
              (void)feature_set;
              return ia64_pal_result(IA64_PAL_STATUS_EINVAL, 0, 0, 0);
          }

          IA64PALResult ia64_pal_result_freq_base(void)
          {
              return ia64_pal_result(IA64_PAL_STATUS_SUCCESS,
                                     IA64_PAL_PLATFORM_BASE_HZ, 0, 0);
          }

          IA64PALResult ia64_pal_result_freq_ratios(void)
          {
              return ia64_pal_result(
                  IA64_PAL_STATUS_SUCCESS,
                  ia64_pal_freq_ratio(IA64_PAL_MERCED_PROC_RATIO_NUM,
                                      IA64_PAL_MERCED_PROC_RATIO_DEN),
                  ia64_pal_freq_ratio(IA64_PAL_MERCED_BUS_RATIO_NUM,
                                      IA64_PAL_MERCED_BUS_RATIO_DEN),
                  ia64_pal_freq_ratio(IA64_PAL_VIRTUAL_ITC_RATIO_NUM,
                                      IA64_PAL_VIRTUAL_ITC_RATIO_DEN));
          }
          ''').lstrip())

          (root / 'tests/unit/test-ia64-pal.c').write_text(dedent(r'''
          /*
           * IA-64 Processor Abstraction Layer contract tests
           *
           * SPDX-License-Identifier: GPL-2.0-or-later
           */

          #include "qemu/osdep.h"
          #include "qemu/units.h"
          #include "target/ia64/pal.h"

          static uint64_t field(uint64_t value, unsigned int shift,
                                uint64_t mask)
          {
              return (value >> shift) & mask;
          }

          static void assert_return_action(IA64PALResult result)
          {
              g_assert_cmpint(result.action, ==, IA64_PAL_ACTION_RETURN);
          }

          static void assert_error_result(IA64PALResult result,
                                          int64_t status)
          {
              g_assert_cmpint(result.status, ==, status);
              g_assert_cmphex(result.v0, ==, 0);
              g_assert_cmphex(result.v1, ==, 0);
              g_assert_cmphex(result.v2, ==, 0);
              assert_return_action(result);
          }

          static void test_unimplemented_result(void)
          {
              assert_error_result(ia64_pal_result_unimplemented(),
                                  IA64_PAL_STATUS_UNIMPLEMENTED);
          }

          static void test_halt_result(void)
          {
              IA64PALResult result = ia64_pal_result_halt();

              g_assert_cmpint(result.status, ==, IA64_PAL_STATUS_SUCCESS);
              g_assert_cmphex(result.v0, ==, 0);
              g_assert_cmphex(result.v1, ==, 0);
              g_assert_cmphex(result.v2, ==, 0);
              g_assert_cmpint(result.action, ==, IA64_PAL_ACTION_HALT);
          }

          static void test_cache_summary(void)
          {
              IA64PALResult result = ia64_pal_result_cache_summary();

              g_assert_cmpint(result.status, ==, IA64_PAL_STATUS_SUCCESS);
              g_assert_cmpuint(result.v0, ==, IA64_PAL_CACHE_LEVELS);
              g_assert_cmpuint(result.v1, ==, IA64_PAL_UNIQUE_CACHES);
              g_assert_cmphex(result.v2, ==, 0);
              assert_return_action(result);
          }

          static void assert_cache_info(uint64_t level, uint64_t type,
                                        bool unified, uint64_t size,
                                        uint64_t attr, uint64_t assoc,
                                        uint64_t line_size,
                                        uint64_t load_latency)
          {
              IA64PALResult result = ia64_pal_result_cache_info(level, type);

              g_assert_cmpint(result.status, ==, IA64_PAL_STATUS_SUCCESS);
              g_assert_cmpuint(field(result.v0, 0, 0x1), ==, unified);
              g_assert_cmpuint(field(result.v0, 1, 0x3), ==, attr);
              g_assert_cmpuint(field(result.v0, 8, 0xff), ==, assoc);
              g_assert_cmpuint(field(result.v0, 16, 0xff), ==, line_size);
              g_assert_cmpuint(field(result.v0, 24, 0xff), ==, line_size);
              g_assert_cmpuint(field(result.v0, 40, 0xff), ==, load_latency);
              g_assert_cmpuint(field(result.v1, 0, UINT32_MAX), ==, size);
              g_assert_cmpuint(field(result.v1, 40, 0xff), ==, line_size);
              g_assert_cmpuint(field(result.v1, 48, 0xff), ==, 43);
              g_assert_cmphex(result.v2, ==, 0);
              assert_return_action(result);
          }

          static void test_merced_cache_info(void)
          {
              assert_cache_info(0, IA64_PAL_CACHE_TYPE_INSTRUCTION,
                                false, 16 * KiB, IA64_PAL_CACHE_ATTR_WT,
                                4, 5, 1);
              assert_cache_info(0, IA64_PAL_CACHE_TYPE_DATA,
                                false, 16 * KiB, IA64_PAL_CACHE_ATTR_WT,
                                4, 5, 2);
              assert_cache_info(1, IA64_PAL_CACHE_TYPE_DATA,
                                true, 96 * KiB, IA64_PAL_CACHE_ATTR_WB,
                                6, 6, 6);
              assert_cache_info(2, IA64_PAL_CACHE_TYPE_DATA,
                                true, IA64_PAL_MERCED_L3_SIZE,
                                IA64_PAL_CACHE_ATTR_WB, 4, 6, 21);
          }

          static void test_cache_info_invalid(void)
          {
              assert_error_result(ia64_pal_result_cache_info(
                                      IA64_PAL_CACHE_LEVELS,
                                      IA64_PAL_CACHE_TYPE_DATA),
                                  IA64_PAL_STATUS_EINVAL);
              assert_error_result(ia64_pal_result_cache_info(0, 0),
                                  IA64_PAL_STATUS_EINVAL);
              assert_error_result(ia64_pal_result_cache_info(0, 3),
                                  IA64_PAL_STATUS_EINVAL);
          }

          static void test_vm_summary(void)
          {
              IA64PALResult result = ia64_pal_result_vm_summary(16, 16, 16);

              g_assert_cmpint(result.status, ==, IA64_PAL_STATUS_SUCCESS);
              g_assert_cmpuint(field(result.v0, 0, 0x1), ==, 1);
              g_assert_cmpuint(field(result.v0, 1, 0x7f), ==, 44);
              g_assert_cmpuint(field(result.v0, 8, 0xff), ==, 18);
              g_assert_cmpuint(field(result.v0, 16, 0xff), ==, 15);
              g_assert_cmpuint(field(result.v0, 24, 0xff), ==, 0);
              g_assert_cmpuint(field(result.v0, 32, 0xff), ==, 15);
              g_assert_cmpuint(field(result.v0, 40, 0xff), ==, 15);
              g_assert_cmpuint(field(result.v0, 48, 0xff), ==,
                               IA64_PAL_UNIQUE_TCS);
              g_assert_cmpuint(field(result.v0, 56, 0xff), ==,
                               IA64_PAL_TC_LEVELS);
              g_assert_cmpuint(field(result.v1, 0, 0xff), ==, 60);
              g_assert_cmpuint(field(result.v1, 8, 0xff), ==, 18);
              g_assert_cmpuint(field(result.v1, 16, 0xffff), ==, UINT16_MAX);
              g_assert_cmphex(result.v2, ==, 0);
              assert_return_action(result);
          }

          static void test_vm_summary_invalid(void)
          {
              assert_error_result(ia64_pal_result_vm_summary(0, 16, 16),
                                  IA64_PAL_STATUS_EINVAL);
              assert_error_result(ia64_pal_result_vm_summary(16, 0, 16),
                                  IA64_PAL_STATUS_EINVAL);
              assert_error_result(ia64_pal_result_vm_summary(16, 16, 0),
                                  IA64_PAL_STATUS_EINVAL);
              assert_error_result(ia64_pal_result_vm_summary(257, 16, 16),
                                  IA64_PAL_STATUS_EINVAL);
          }

          static void test_vm_info(void)
          {
              IA64PALResult result;

              result = ia64_pal_result_vm_info(
                  0, IA64_PAL_CACHE_TYPE_INSTRUCTION, 128);
              g_assert_cmpint(result.status, ==, IA64_PAL_STATUS_SUCCESS);
              g_assert_cmpuint(field(result.v0, 0, 0xff), ==, 1);
              g_assert_cmpuint(field(result.v0, 8, 0xff), ==, 128);
              g_assert_cmpuint(field(result.v0, 16, 0xffff), ==, 128);
              g_assert_cmpuint(field(result.v0, 32, 0x7), ==, 0);
              g_assert_cmphex(result.v1, ==, IA64_PAL_VM_PAGE_SIZES);
              g_assert_cmphex(result.v2, ==, 0);
              assert_return_action(result);

              result = ia64_pal_result_vm_info(
                  0, IA64_PAL_CACHE_TYPE_DATA, 128);
              g_assert_cmpint(result.status, ==, IA64_PAL_STATUS_SUCCESS);
          }

          static void test_vm_info_invalid(void)
          {
              assert_error_result(ia64_pal_result_vm_info(
                                      1, IA64_PAL_CACHE_TYPE_DATA, 128),
                                  IA64_PAL_STATUS_EINVAL);
              assert_error_result(ia64_pal_result_vm_info(0, 0, 128),
                                  IA64_PAL_STATUS_EINVAL);
              assert_error_result(ia64_pal_result_vm_info(
                                      0, IA64_PAL_CACHE_TYPE_DATA, 0),
                                  IA64_PAL_STATUS_EINVAL);
              assert_error_result(ia64_pal_result_vm_info(
                                      0, IA64_PAL_CACHE_TYPE_DATA, 256),
                                  IA64_PAL_STATUS_EINVAL);
          }

          static void test_vm_page_size(void)
          {
              IA64PALResult result = ia64_pal_result_vm_page_size();

              g_assert_cmpint(result.status, ==, IA64_PAL_STATUS_SUCCESS);
              g_assert_cmphex(result.v0, ==, IA64_PAL_VM_PAGE_SIZES);
              g_assert_cmphex(result.v1, ==, IA64_PAL_VM_PAGE_SIZES);
              g_assert_cmphex(result.v2, ==, 0);
              assert_return_action(result);
          }

          static void test_proc_get_features(void)
          {
              assert_error_result(ia64_pal_result_proc_get_features(0),
                                  IA64_PAL_STATUS_EINVAL);
              assert_error_result(ia64_pal_result_proc_get_features(16),
                                  IA64_PAL_STATUS_EINVAL);
          }

          static void assert_ratio(uint64_t value, uint32_t numerator,
                                   uint32_t denominator)
          {
              g_assert_cmpuint(value & UINT32_MAX, ==, denominator);
              g_assert_cmpuint(value >> 32, ==, numerator);
          }

          static void test_frequency_contract(void)
          {
              IA64PALResult base = ia64_pal_result_freq_base();
              IA64PALResult ratios = ia64_pal_result_freq_ratios();

              g_assert_cmpint(base.status, ==, IA64_PAL_STATUS_SUCCESS);
              g_assert_cmpuint(base.v0, ==, IA64_PAL_PLATFORM_BASE_HZ);
              assert_return_action(base);

              g_assert_cmpint(ratios.status, ==, IA64_PAL_STATUS_SUCCESS);
              assert_ratio(ratios.v0, IA64_PAL_MERCED_PROC_RATIO_NUM,
                           IA64_PAL_MERCED_PROC_RATIO_DEN);
              assert_ratio(ratios.v1, IA64_PAL_MERCED_BUS_RATIO_NUM,
                           IA64_PAL_MERCED_BUS_RATIO_DEN);
              assert_ratio(ratios.v2, IA64_PAL_VIRTUAL_ITC_RATIO_NUM,
                           IA64_PAL_VIRTUAL_ITC_RATIO_DEN);
              g_assert_cmpuint(
                  IA64_PAL_PLATFORM_BASE_HZ *
                  IA64_PAL_MERCED_PROC_RATIO_NUM /
                  IA64_PAL_MERCED_PROC_RATIO_DEN,
                  ==, UINT64_C(800000000));
              g_assert_cmpuint(
                  IA64_PAL_PLATFORM_BASE_HZ *
                  IA64_PAL_VIRTUAL_ITC_RATIO_NUM /
                  IA64_PAL_VIRTUAL_ITC_RATIO_DEN,
                  ==, UINT64_C(1000000000));
              assert_return_action(ratios);
          }

          int main(int argc, char **argv)
          {
              g_test_init(&argc, &argv, NULL);
              g_test_add_func("/ia64/pal/unimplemented-result",
                              test_unimplemented_result);
              g_test_add_func("/ia64/pal/halt-result", test_halt_result);
              g_test_add_func("/ia64/pal/cache-summary", test_cache_summary);
              g_test_add_func("/ia64/pal/merced-cache-info",
                              test_merced_cache_info);
              g_test_add_func("/ia64/pal/cache-info-invalid",
                              test_cache_info_invalid);
              g_test_add_func("/ia64/pal/vm-summary", test_vm_summary);
              g_test_add_func("/ia64/pal/vm-summary-invalid",
                              test_vm_summary_invalid);
              g_test_add_func("/ia64/pal/vm-info", test_vm_info);
              g_test_add_func("/ia64/pal/vm-info-invalid",
                              test_vm_info_invalid);
              g_test_add_func("/ia64/pal/vm-page-size",
                              test_vm_page_size);
              g_test_add_func("/ia64/pal/proc-get-features",
                              test_proc_get_features);
              g_test_add_func("/ia64/pal/frequency-contract",
                              test_frequency_contract);
              return g_test_run();
          }
          ''').lstrip())

          (root / 'docs/devel/ia64-pal-model.rst').write_text(dedent(r'''
          :orphan:

          IA-64 PAL processor model
          =========================

          The ``ipf`` machine currently exposes one explicit processor profile:
          a first-generation Merced Itanium at 800 MHz with 4 MiB of external
          L3 cache.  This is the high-end processor configuration used by the
          Intel 460GX reference systems represented by the machine, including
          the HP i2000 and rx4610.

          PAL reports the processor-visible topology of that profile:

          * split 16 KiB instruction and data L1 caches;
          * a unified 96 KiB L2 cache;
          * a unified 4 MiB L3 cache;
          * a 100 MHz platform frequency base;
          * an 8/1 processor ratio and 4/3 bus-clock ratio; and
          * a 10/1 ITC ratio, matching QEMU's nanosecond virtual counter.

          TCG does not simulate cache contents or processor cycles.  These
          values are nevertheless a guest ABI and must describe one coherent
          processor rather than a collection of firmware-enabling constants.
          Translation-cache and translation-register counts are therefore
          derived from the implemented CPU state arrays.

          Future processor variants should be explicit CPU models or
          properties.  Firmware hashes, instruction addresses, and image-byte
          patterns must never select PAL results.
          ''').lstrip())

          helper = root / 'target/ia64/helper.c'
          source = helper.read_text()

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{label}: expected one match, found {count}')
              source = source.replace(old, new, 1)

          def replace_case(start_label, next_label, replacement):
              global source
              start = source.index(start_label)
              end = source.index(next_label, start)
              source = source[:start] + replacement + source[end:]

          replace_once(
              '#define IA64_PAL_PTCE_INFO       6\n'
              '#define IA64_PAL_VM_SUMMARY      8\n',
              '#define IA64_PAL_PTCE_INFO       6\n'
              '#define IA64_PAL_VM_INFO         7\n'
              '#define IA64_PAL_VM_SUMMARY      8\n',
              'PAL_VM_INFO number')

          replace_case(
              '    case IA64_PAL_CACHE_SUMMARY:',
              '    case IA64_PAL_MEM_ATTRIB:',
              dedent(r'''
                  case IA64_PAL_CACHE_SUMMARY: {
                      IA64PALResult result = ia64_pal_result_cache_summary();

                      status = result.status;
                      v0 = result.v0;
                      v1 = result.v1;
                      v2 = result.v2;
                      break;
                  }
                  case IA64_PAL_CACHE_INFO: {
                      IA64PALResult result = ia64_pal_result_cache_info(a1, a2);

                      status = result.status;
                      v0 = result.v0;
                      v1 = result.v1;
                      v2 = result.v2;
                      break;
                  }
              ''').lstrip())

          replace_case(
              '    case IA64_PAL_VM_SUMMARY:',
              '    case IA64_PAL_BUS_GET_FEATURES:',
              dedent(r'''
                  case IA64_PAL_VM_INFO: {
                      unsigned int entries =
                          a2 == IA64_PAL_CACHE_TYPE_INSTRUCTION ?
                          ARRAY_SIZE(env->itcs) : ARRAY_SIZE(env->dtcs);
                      IA64PALResult result = ia64_pal_result_vm_info(
                          a1, a2, entries);

                      status = result.status;
                      v0 = result.v0;
                      v1 = result.v1;
                      v2 = result.v2;
                      break;
                  }
                  case IA64_PAL_VM_SUMMARY: {
                      IA64PALResult result = ia64_pal_result_vm_summary(
                          ARRAY_SIZE(env->pkr), ARRAY_SIZE(env->dtrs),
                          ARRAY_SIZE(env->itrs));

                      status = result.status;
                      v0 = result.v0;
                      v1 = result.v1;
                      v2 = result.v2;
                      break;
                  }
              ''').lstrip())

          replace_case(
              '    case IA64_PAL_VM_PAGE_SIZE:',
              '    case IA64_PAL_FREQ_BASE:',
              dedent(r'''
                  case IA64_PAL_VM_PAGE_SIZE: {
                      IA64PALResult result = ia64_pal_result_vm_page_size();

                      status = result.status;
                      v0 = result.v0;
                      v1 = result.v1;
                      v2 = result.v2;
                      break;
                  }
              ''').lstrip())

          replace_case(
              '    case IA64_PAL_FREQ_BASE:',
              '    case IA64_PAL_PERF_MON_INFO:',
              dedent(r'''
                  case IA64_PAL_FREQ_BASE: {
                      IA64PALResult result = ia64_pal_result_freq_base();

                      status = result.status;
                      v0 = result.v0;
                      v1 = result.v1;
                      v2 = result.v2;
                      break;
                  }
                  case IA64_PAL_FREQ_RATIOS: {
                      IA64PALResult result = ia64_pal_result_freq_ratios();

                      status = result.status;
                      v0 = result.v0;
                      v1 = result.v1;
                      v2 = result.v2;
                      break;
                  }
              ''').lstrip())

          replace_case(
              '    case IA64_PAL_PROC_GET_FEATURES:',
              '    case IA64_PAL_VERSION:',
              dedent(r'''
                  case IA64_PAL_PROC_GET_FEATURES: {
                      IA64PALResult result =
                          ia64_pal_result_proc_get_features(a2);

                      status = result.status;
                      v0 = result.v0;
                      v1 = result.v1;
                      v2 = result.v2;
                      break;
                  }
              ''').lstrip())

          helper.write_text(source)
          PY

      - name: Check patch shape
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('target/ia64/helper.c').read_text()
          pal = Path('target/ia64/pal.c').read_text()
          test = Path('tests/unit/test-ia64-pal.c').read_text()

          assert '#define IA64_PAL_VM_INFO         7' in helper
          assert 'levels=3, unique_caches=5' not in helper
          assert 'uint8_t unified = (type == 2)' not in helper
          assert 'ia64_pal_result_cache_info(a1, a2)' in helper
          assert 'ARRAY_SIZE(env->pkr)' in helper
          assert 'ARRAY_SIZE(env->dtrs)' in helper
          assert 'ARRAY_SIZE(env->itrs)' in helper
          assert 'ARRAY_SIZE(env->itcs)' in helper
          assert 'ARRAY_SIZE(env->dtcs)' in helper
          assert 'ia64_pal_result_freq_ratios()' in helper
          assert 'IA64_PAL_MERCED_L3_SIZE' in pal
          assert '96 * KiB' in pal
          assert '/ia64/pal/merced-cache-info' in test
          assert '/ia64/pal/frequency-contract' in test
          PY
          git diff --no-ext-diff --src-prefix=a/ --dst-prefix=b/ | \
            ./scripts/checkpatch.pl --strict --no-tree -

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Configure and build
        shell: bash
        run: |
          ./configure --target-list=ia64-softmmu --disable-werror
          ninja -C build \
            qemu-system-ia64 \
            tests/unit/test-ia64-pal \
            tests/unit/test-ia64-interrupt \
            tests/unit/test-ia64-iosapic \
            tests/qtest/ia64-ipf-test

      - name: Run focused tests
        shell: bash
        run: |
          build/tests/unit/test-ia64-pal
          build/tests/unit/test-ia64-interrupt
          build/tests/unit/test-ia64-iosapic
          QTEST_QEMU_BINARY="$PWD/build/qemu-system-ia64" \
            build/tests/qtest/ia64-ipf-test

      - name: Commit tested implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            target/ia64/helper.c \
            target/ia64/pal.c \
            target/ia64/pal.h \
            tests/unit/test-ia64-pal.c \
            docs/devel/ia64-pal-model.rst
          git commit -m \
            'target/ia64: model a coherent Merced PAL contract'
          git push origin HEAD:fix/pal-merced-contract-current
