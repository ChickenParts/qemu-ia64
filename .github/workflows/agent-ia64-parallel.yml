name: Temporary IA-64 parallel-port validation

on:
  push:
    branches:
      - stage/ia64-parallel
    paths:
      - scratch/agent-ia64-parallel.patch
      - .github/workflows/agent-ia64-parallel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_COMMIT: 533456d2140502d2f5b9092e2797ba7145954248
      OUTPUT_BRANCH: fix/ia64-parallel
      PATCH_FILE: scratch/agent-ia64-parallel.patch
    steps:
      - name: Check out staging tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and review production patch
        shell: bash
        run: |
          set -euo pipefail
          cp "$PATCH_FILE" /tmp/ia64-parallel.patch
          git checkout --detach "$BASE_COMMIT"
          git apply --check /tmp/ia64-parallel.patch
          git apply /tmp/ia64-parallel.patch
          git diff --check
          git diff "$BASE_COMMIT" -- \
            configs/devices/ia64-softmmu/default.mak \
            docs/devel/ia64-ipf-port-status.rst \
            hw/ia64/ipf.c \
            tests/qtest/ia64-ipf-test.c \
            > /tmp/ia64-parallel-production.patch
          perl scripts/checkpatch.pl --no-signoff --strict \
            /tmp/ia64-parallel-production.patch

      - name: Install build and documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config python3 python3-venv \
            python3-docutils libglib2.0-dev libpixman-1-dev zlib1g-dev \
            libslirp-dev

      - name: Validate the status document
        run: |
          rst2html docs/devel/ia64-ipf-port-status.rst \
            /tmp/ia64-ipf-port-status.html

      - name: Configure and build IA-64
        run: |
          ./configure \
            --target-list=ia64-softmmu \
            --disable-werror \
            --disable-docs \
            --disable-gtk \
            --disable-sdl
          ninja -C build \
            qemu-system-ia64 \
            tests/unit/test-ia64-interrupt \
            tests/unit/test-ia64-iosapic \
            tests/qtest/ia64-ipf-test

      - name: Run architecture and machine contracts
        shell: bash
        run: |
          set -euo pipefail
          build/tests/unit/test-ia64-interrupt --tap -k \
            | tee /tmp/test-ia64-interrupt.tap
          build/tests/unit/test-ia64-iosapic --tap -k \
            | tee /tmp/test-ia64-iosapic.tap
          QTEST_QEMU_BINARY=./build/qemu-system-ia64 \
            build/tests/qtest/ia64-ipf-test --tap -k \
            | tee /tmp/ia64-ipf-test.tap
          build/qemu-system-ia64 --version \
            | tee /tmp/qemu-system-ia64-version.txt
          build/qemu-system-ia64 -machine help | grep -q '^ipf '

      - name: Publish one clean tested commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            configs/devices/ia64-softmmu/default.mak \
            docs/devel/ia64-ipf-port-status.rst \
            hw/ia64/ipf.c \
            tests/qtest/ia64-ipf-test.c
          git diff --cached --check
          git commit \
            -m 'hw/ia64: wire configured ISA parallel ports' \
            -m 'Instantiate current QEMU ISA parallel devices on the PIIX4 bus, route LPT interrupts through the I/O SAPIC, test software strobe/ACK IRQ7 and reset behavior, and update the platform status ledger.'
          git push --force origin "HEAD:refs/heads/$OUTPUT_BRANCH"
          git rev-parse HEAD | tee /tmp/ia64-parallel-commit.txt

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ia64-parallel-result
          path: |
            /tmp/ia64-parallel-commit.txt
            /tmp/ia64-parallel-production.patch
            /tmp/ia64-ipf-port-status.html
            /tmp/test-ia64-interrupt.tap
            /tmp/test-ia64-iosapic.tap
            /tmp/ia64-ipf-test.tap
            /tmp/qemu-system-ia64-version.txt
          retention-days: 1
          if-no-files-found: error
