name: Temporary IA-64 PEI status ABI integration

on:
  push:
    branches:
      - ia64-rooster-bringup
    paths:
      - .github/workflows/ia64-pei-status-abi-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact bring-up branch
        uses: actions/checkout@v4
        with:
          ref: ia64-rooster-bringup
          fetch-depth: 0

      - name: Decode the historical PEI status-code ABI
        shell: bash
        run: |
          set -euo pipefail
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p validation
          python3 - <<'PY'
          from pathlib import Path

          path = Path('target/ia64/helper.c')
          source = path.read_text()

          old_status = '''        if (trace_call_status) {
              /*
               * EFI_REPORT_STATUS_CODE uses five arguments: type, value,
               * instance, caller ID, and data.  Keep this diagnostic aligned
               * with that ABI so assertion records are decoded correctly.
               */
              if (call_a3 && call_a3 != UINT64_MAX) {
                  IA64EfiGuid caller;
                  if (ia64_fw_read_guid(env, call_a3, &caller)) {
                      qemu_log_mask(LOG_GUEST_ERROR,
                                    "IA64: trace_call caller=%08x-%04x-%04x"
                                    "-%02x%02x-%02x%02x%02x%02x%02x%02x\\n",
                                    caller.data1, caller.data2, caller.data3,
                                    caller.data4[0], caller.data4[1],
                                    caller.data4[2], caller.data4[3],
                                    caller.data4[4], caller.data4[5],
                                    caller.data4[6], caller.data4[7]);
                  } else {
                      qemu_log_mask(LOG_GUEST_ERROR,
                                    "IA64: trace_call caller_read_fail ptr=%016"
                                    PRIx64 "\\n", call_a3);
                  }
              }
              if (call_a4) {
                  ia64_fw_statuscode_dump(env, call_a4, call_a0, call_a1);
              }
          }
          '''
          new_status = '''        if (trace_call_status) {
              /*
               * Framework PEI ReportStatusCode has six arguments:
               * PeiServices, CodeType, Value, Instance, CallerId, and Data.
               * This callsite is the PEI service, not the five-argument DXE
               * runtime service.  Decode the actual assertion record in a5.
               */
              if (call_a4 && call_a4 != UINT64_MAX) {
                  IA64EfiGuid caller;
                  if (ia64_fw_read_guid(env, call_a4, &caller)) {
                      qemu_log_mask(LOG_GUEST_ERROR,
                                    "IA64: trace_call caller=%08x-%04x-%04x"
                                    "-%02x%02x-%02x%02x%02x%02x%02x%02x\\n",
                                    caller.data1, caller.data2, caller.data3,
                                    caller.data4[0], caller.data4[1],
                                    caller.data4[2], caller.data4[3],
                                    caller.data4[4], caller.data4[5],
                                    caller.data4[6], caller.data4[7]);
                  } else {
                      qemu_log_mask(LOG_GUEST_ERROR,
                                    "IA64: trace_call caller_read_fail ptr=%016"
                                    PRIx64 "\\n", call_a4);
                  }
              }
              if (call_a5) {
                  ia64_fw_statuscode_dump(env, call_a5, call_a1, call_a2);
              }
          }
          '''

          old_args = '''            uint64_t args[] = { call_a0, call_a1, call_a2, call_a3, call_a4 };
              const char *names[] = { "a0", "a1", "a2", "a3", "a4" };
          '''
          new_args = '''            uint64_t args[] = {
                  call_a0, call_a1, call_a2, call_a3, call_a4, call_a5
              };
              const char *names[] = {
                  "a0", "a1", "a2", "a3", "a4", "a5"
              };
          '''

          if source.count(old_status) != 1:
              raise SystemExit('five-argument status block changed unexpectedly')
          if source.count(old_args) != 1:
              raise SystemExit('argument dump block changed unexpectedly')

          source = source.replace(old_status, new_status, 1)
          source = source.replace(old_args, new_args, 1)

          assert 'Framework PEI ReportStatusCode has six arguments' in source
          assert 'ia64_fw_statuscode_dump(env, call_a5, call_a1, call_a2);' in source
          assert 'ia64_fw_statuscode_dump(env, call_a4, call_a0, call_a1);' not in source
          assert '"a0", "a1", "a2", "a3", "a4", "a5"' in source
          path.write_text(source)
          PY

          git diff --check
          git diff --binary > validation/ia64-pei-status-abi.patch
          ./scripts/checkpatch.pl --strict --no-signoff --color=never \
            validation/ia64-pei-status-abi.patch \
            2>&1 | tee validation/checkpatch.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libglib2.0-dev libpixman-1-dev \
            ninja-build pkg-config python3 python3-venv zlib1g-dev

      - name: Build IA-64 system emulator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-pei-status-abi
          mkdir build-pei-status-abi
          (
            cd build-pei-status-abi
            ../configure \
              --target-list=ia64-softmmu \
              --disable-docs \
              --disable-gtk \
              --disable-sdl \
              --disable-vnc \
              --disable-werror
          ) 2>&1 | tee validation/configure.txt
          ninja -C build-pei-status-abi -j"$(nproc)" qemu-system-ia64 \
            2>&1 | tee validation/build.txt
          build-pei-status-abi/qemu-system-ia64 --version \
            | tee validation/version.txt

      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ia64-pei-status-abi-integration.yml
          git add target/ia64/helper.c
          git commit -m \
            'target/ia64: decode PEI status calls with six arguments'
          git fetch origin ia64-rooster-bringup
          test "$(git rev-parse origin/ia64-rooster-bringup)" = "$BASE_SHA"
          git push origin HEAD:ia64-rooster-bringup
          git format-patch -1 --stdout > validation/commit.patch
          git rev-parse HEAD > validation/HEAD

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia64-pei-status-abi-${{ github.run_id }}
          path: validation/
          retention-days: 7
          if-no-files-found: error
