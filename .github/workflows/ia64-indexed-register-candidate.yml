name: IA-64 indexed-register candidate

on:
  push:
    branches:
      - fix/ia64-indexed-register-decode
    paths:
      - scripts/apply-ia64-rse-deferred-restore.rb
      - scripts/apply-ia64-rse-backing-store-persistence.py
      - scripts/apply-ia64-indexed-register-decode.py
      - .github/workflows/ia64-indexed-register-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ia64-indexed-register-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build repaired IA-64 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            ninja-build \
            pkg-config \
            python3 \
            ruby \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev

      - name: Apply reviewed architectural repairs
        shell: bash
        run: |
          set -euo pipefail
          ruby scripts/apply-ia64-rse-deferred-restore.rb --check .
          ruby scripts/apply-ia64-rse-deferred-restore.rb --apply .
          python3 scripts/apply-ia64-rse-backing-store-persistence.py --check .
          python3 scripts/apply-ia64-rse-backing-store-persistence.py --apply .
          python3 scripts/apply-ia64-indexed-register-decode.py --check .
          python3 scripts/apply-ia64-indexed-register-decode.py --apply .
          python3 scripts/check-ia64-rooster-branch.py
          git diff --check
          git diff --stat | tee candidate-diff-stat.txt
          git diff > candidate-source.patch

      - name: Build emulator and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          ./configure \
            --target-list=ia64-softmmu \
            --enable-plugins \
            --disable-slirp \
            --disable-docs \
            --disable-gtk \
            --disable-sdl \
            --disable-werror
          ninja -C build -j"$(nproc)" \
            qemu-system-ia64 \
            tests/unit/test-ia64-decode \
            tests/unit/test-ia64-rse
          build/tests/unit/test-ia64-decode | tee decode-unit.tap
          build/tests/unit/test-ia64-rse | tee rse-unit.tap
          build/qemu-system-ia64 --version | tee qemu-version.txt
          build/qemu-system-ia64 -M help | tee qemu-machines.txt
          ldd build/qemu-system-ia64 | tee qemu-ldd.txt
          ! grep -F 'not found' qemu-ldd.txt

      - name: Package executable and matching VGA ROMs
        shell: bash
        run: |
          set -euo pipefail
          out=ia64-indexed-register-candidate
          rm -rf "$out"
          mkdir -p "$out/pc-bios"
          install -m 0755 build/qemu-system-ia64 "$out/qemu-system-ia64"
          install -m 0755 scripts/run-ia64-firmware.sh "$out/run-ia64-firmware.sh"
          install -m 0644 pc-bios/vgabios*.bin "$out/pc-bios/"
          install -m 0644 \
            candidate-source.patch \
            candidate-diff-stat.txt \
            decode-unit.tap \
            rse-unit.tap \
            qemu-version.txt \
            qemu-machines.txt \
            qemu-ldd.txt \
            "$out/"
          {
            printf 'source_head=%s\n' "$(git rev-parse HEAD)"
            printf 'rse_repair=deferred-bspstore-identity\n'
            printf 'rse_backing_store_persistence=shadow-frame-materialization\n'
            printf 'decode_repair=m43-indexed-register-read\n'
            printf 'built_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$out/IDENTITY.txt"
          (
            cd "$out"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          tar --use-compress-program='gzip -1' \
            -cf ia64-indexed-register-candidate.tar.gz "$out"
          sha256sum ia64-indexed-register-candidate.tar.gz \
            > ia64-indexed-register-candidate.tar.gz.sha256

      - name: Upload candidate runtime
        uses: actions/upload-artifact@v4
        with:
          name: ia64-indexed-register-candidate-${{ github.run_id }}
          path: |
            ia64-indexed-register-candidate.tar.gz
            ia64-indexed-register-candidate.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
