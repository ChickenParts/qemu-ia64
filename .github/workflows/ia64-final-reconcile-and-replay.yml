name: Finalize and replay IA-64 Rooster bring-up tranche

on:
  push:
    branches:
      - ia64-rooster-bringup
    paths:
      - .github/workflows/ia64-final-reconcile-and-replay.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ia64-final-reconcile-and-replay
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Let earlier one-shot jobs settle
        run: sleep 180

      - name: Check out the latest branch head
        uses: actions/checkout@v4
        with:
          ref: ia64-rooster-bringup
          fetch-depth: 0

      - name: Apply every reconciliation idempotently
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once_or_present(path, old, new):
              text = path.read_text()
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'{path}: expected source shape is absent')
              path.write_text(text)

          # Causality probe must be valid C, use exact FV records, and remain
          # tightly bounded around the known permanent arena.
          causality = Path('hw/ia64/hob-migration-causality.c')
          text = causality.read_text()
          text = text.replace(
              'sizeof(struct Ia64HobFvRecord::raw)',
              'sizeof(((struct Ia64HobFvRecord *)0)->raw)',
          )
          text = text.replace(
              '#define IA64_HOB_TARGET_BASE UINT64_C(0x04000000)',
              '#define IA64_HOB_TARGET_BASE UINT64_C(0x040e0000)',
          )
          text = text.replace(
              '#define IA64_HOB_TARGET_SIZE UINT64_C(0x00200000)',
              '#define IA64_HOB_TARGET_SIZE UINT64_C(0x00020000)',
          )
          text = text.replace(
              '#define IA64_HOB_POLL_NS UINT64_C(100000)',
              '#define IA64_HOB_POLL_NS UINT64_C(1000000)',
          )
          text = text.replace(
              '#define IA64_HOB_POLL_LIMIT 200000',
              '#define IA64_HOB_POLL_LIMIT 20000',
          )
          text = text.replace(
              'if (type == IA64_HOB_FV && length >= 24 &&\n'
              '            info->fv_count < IA64_HOB_MAX_FVS) {',
              'if (type == IA64_HOB_FV &&\n'
              '            length == sizeof(((struct Ia64HobFvRecord *)0)->raw) &&\n'
              '            info->fv_count < IA64_HOB_MAX_FVS) {',
          )
          if '::raw' in text:
              raise SystemExit('C++ member syntax remains in causality probe')
          causality.write_text(text)

          analyzer = Path('scripts/analyze-ia64-hob-migration.py')
          text = analyzer.read_text().replace(
              'if self.hob_type != HOB_FV or self.length < 24:',
              'if self.hob_type != HOB_FV or self.length != 24:',
          )
          analyzer.write_text(text)

          # Dynamic test imports must be registered for dataclasses.
          for path in (
              Path('tests/unit/test-ia64-hob-migration.py'),
              Path('tests/unit/test-ia64-hob-write-trace.py'),
          ):
              text = path.read_text()
              if '\nimport sys\n' not in text:
                  text = text.replace('import pathlib\n',
                                      'import pathlib\nimport sys\n', 1)
              needle = 'MODULE = importlib.util.module_from_spec(SPEC)\nSPEC.loader.exec_module(MODULE)'
              replacement = (
                  'MODULE = importlib.util.module_from_spec(SPEC)\n'
                  'sys.modules[SPEC.name] = MODULE\n'
                  'SPEC.loader.exec_module(MODULE)'
              )
              if needle in text:
                  text = text.replace(needle, replacement, 1)
              if 'sys.modules[SPEC.name] = MODULE' not in text:
                  raise SystemExit(f'{path}: dynamic module registration absent')
              path.write_text(text)

          # Scope the direct-loader invariant to executable lines, not prose.
          checker = Path('scripts/check-ia64-rooster-branch.py')
          text = checker.read_text()
          old = '    forbid(harness, r"exec.*-kernel|\\s-kernel(?:\\s|=)", "EFI harness")\n'
          if old in text:
              new = '''    executable_lines = [
        line.strip()
        for line in harness.splitlines()
        if line.strip().startswith(("exec ", "qemu-system-", "$qemu_bin "))
    ]
    if any(re.search(r"(?:^|\\s)-kernel(?:\\s|=)", line)
           for line in executable_lines):
        raise AssertionError("EFI harness: executable command contains -kernel")
'''
              text = text.replace(old, new, 1)
          checker.write_text(text)

          # Make plugin object ownership explicit and silence callback metadata
          # only after retaining it in the ABI signature.
          plugin = Path('contrib/plugins/ia64-hob-write-regs.c')
          text = plugin.read_text()
          text = text.replace(
              '    g_autoptr(GByteArray) value = g_byte_array_new();\n',
              '    GByteArray *value = g_byte_array_new();\n',
          )
          text = text.replace(
              '        return;\n    }\n    g_string_append_printf(line, " %s=", name);',
              '        g_byte_array_unref(value);\n        return;\n    }\n    g_string_append_printf(line, " %s=", name);',
              1,
          )
          if 'g_byte_array_unref(value);' not in text.split(
              'static void append_register', 1
          )[1].split('static void trace_store', 1)[0].rsplit('}', 1)[0]:
              text = text.replace(
                  '    for (index = 0; index < value->len; index++) {\n'
                  '        g_string_append_printf(line, "%02x", value->data[index]);\n'
                  '    }\n}',
                  '    for (index = 0; index < value->len; index++) {\n'
                  '        g_string_append_printf(line, "%02x", value->data[index]);\n'
                  '    }\n'
                  '    g_byte_array_unref(value);\n'
                  '}',
                  1,
              )
          text = text.replace('    g_autoptr(GString) line = NULL;\n',
                              '    GString *line;\n')
          if 'qemu_plugin_outs(line->str);\n    g_string_free(line, TRUE);' not in text:
              text = text.replace(
                  '    qemu_plugin_outs(line->str);\n}\n\nstatic void translate_block',
                  '    qemu_plugin_outs(line->str);\n'
                  '    g_string_free(line, TRUE);\n'
                  '}\n\nstatic void translate_block',
                  1,
              )
          text = text.replace(
              '    g_autoptr(GArray) descriptors = qemu_plugin_get_registers();\n',
              '    GArray *descriptors = qemu_plugin_get_registers();\n',
          )
          if 'g_array_unref(descriptors);' not in text:
              text = text.replace(
                  '        }\n    }\n}\n\nstatic void plugin_exit',
                  '        }\n    }\n'
                  '    g_array_unref(descriptors);\n'
                  '}\n\nstatic void plugin_exit',
                  1,
              )
          if 'g_autoptr(' in text:
              raise SystemExit('automatic-pointer macro remains in register plugin')
          plugin.write_text(text)

          # Use the documented GitHub step-summary file in every workflow.
          old_summary = "Path('/home/runner/work/_temp/_runner_file_commands/step_summary')"
          new_summary = "Path(os.environ['GITHUB_STEP_SUMMARY'])"
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              lines = path.read_text().splitlines()
              output = []
              index = 0
              changed = False
              while index < len(lines):
                  line = lines[index]
                  output.append(line)
                  if line.strip() != "python3 - <<'PY'":
                      index += 1
                      continue
                  end = index + 1
                  while end < len(lines) and lines[end].strip() != 'PY':
                      end += 1
                  if end >= len(lines):
                      raise SystemExit(f'{path}: unterminated Python heredoc')
                  block = lines[index + 1:end]
                  if any(old_summary in item for item in block):
                      block = [item.replace(old_summary, new_summary) for item in block]
                      changed = True
                  if any('GITHUB_STEP_SUMMARY' in item for item in block) and not any(
                      item.strip() in {'import os', 'from os import environ'}
                      for item in block
                  ):
                      indent = '          '
                      for item in block:
                          if item.lstrip().startswith(('import ', 'from ')):
                              indent = item[:len(item) - len(item.lstrip())]
                              break
                      position = 0
                      while position < len(block) and (
                          not block[position].strip() or
                          block[position].lstrip().startswith('#')
                      ):
                          position += 1
                      block.insert(position, indent + 'import os')
                      changed = True
                  output.extend(block)
                  output.append(lines[end])
                  index = end + 1
              if changed:
                  path.write_text('\n'.join(output) + '\n')

          # All transient causality builds use the tested structural editor.
          for path in (
              Path('.github/workflows/ia64-fv-hob-causality.yml'),
              Path('.github/workflows/ia64-pei-compatibility-frontier.yml'),
          ):
              lines = path.read_text().splitlines()
              output = []
              index = 0
              while index < len(lines):
                  if lines[index].strip() == "python3 - <<'PY'":
                      indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
                      end = index + 1
                      while end < len(lines) and lines[end].strip() != 'PY':
                          end += 1
                      block = '\n'.join(lines[index:end + 1])
                      if ('meson.build' in block and
                              ('hob-migration-causality.c' in block or
                               'hob-migration-probe.c' in block)):
                          output.append(
                              indent + 'python3 scripts/include-ia64-hob-causality.py'
                          )
                          index = end + 1
                          continue
                  output.append(lines[index])
                  index += 1
              text = '\n'.join(output) + '\n'
              if 'include-ia64-hob-causality.py' not in text:
                  raise SystemExit(f'{path}: structural Meson helper absent')
              path.write_text(text)

          # Adaptive register tracing follows permanent-PHIT activation.
          adaptive = Path('.github/workflows/ia64-hob-adaptive-register-frontier.yml')
          text = adaptive.read_text()
          text = text.replace(
              'docs/generated/ia64-hob-dual-timeline.json',
              'docs/generated/ia64-hob-transition.json',
          )
          text = text.replace(
              "Path('docs/generated/ia64-hob-dual-timeline.json').read_text()",
              "Path('docs/generated/ia64-hob-transition.json').read_text()",
          )
          text = text.replace(
              "timeline = report.get('timeline') or {}\n          classification = timeline.get('classification', '')",
              "transition = report.get('transition') or {}\n          classification = transition.get('classification', '')",
          )
          text = text.replace(
              "classification == 'temporary-writes-continue-after-permanent-activation'",
              "classification == 'temporary-hob-writes-continue-after-permanent-phit'",
          )
          adaptive.write_text(text)

          obsolete = Path('hw/ia64/hob-migration-probe.c')
          if obsolete.exists():
              obsolete.unlink()

          # Remove superseded one-shot maintenance workflows.  Permanent test,
          # frontier, and report workflows remain.
          one_shots = {
              'ia64-bringup-reconcile.yml',
              'ia64-fv-hob-probe-cleanup.yml',
              'ia64-diagnostic-test-harness-fix.yml',
              'ia64-contract-check-reconcile.yml',
              'ia64-causality-workflow-reconcile.yml',
              'ia64-hob-probe-safety-reconcile.yml',
              'ia64-register-plugin-portability-reconcile.yml',
              'ia64-step-summary-reconcile.yml',
              'ia64-step-summary-reconcile-v2.yml',
              'ia64-adaptive-transition-reconcile.yml',
              'ia64-final-reconcile-and-replay.yml',
          }
          for name in one_shots:
              path = Path('.github/workflows') / name
              if path.exists():
                  path.unlink()

          # Touch each expensive experiment exactly once from the coherent head.
          replay = 'replay-generation: coherent-tranche-1'
          for name in (
              'ia64-rooster-xen-efi-frontier.yml',
              'ia64-fv-hob-causality.yml',
              'ia64-hob-writer-frontier.yml',
              'ia64-hob-register-frontier.yml',
              'ia64-hob-dual-frontier.yml',
              'ia64-pei-compatibility-frontier.yml',
          ):
              path = Path('.github/workflows') / name
              text = path.read_text()
              if replay not in text:
                  text = f'# {replay}\n' + text
              path.write_text(text)

          for path in Path('.github/workflows').glob('*.yml'):
              if '_runner_file_commands/step_summary' in path.read_text():
                  raise SystemExit(f'{path}: runner-internal summary path remains')
          PY
          git diff --check

      - name: Run all deterministic diagnostics
        run: |
          set -euo pipefail
          python3 scripts/check-ia64-rooster-branch.py
          python3 tests/unit/test-ia64-causality-meson.py
          python3 tests/unit/test-ia64-hob-migration.py
          python3 tests/unit/test-ia64-hob-write-trace.py
          python3 tests/unit/test-ia64-hob-register-trace.py
          python3 tests/unit/test-ia64-hob-dual-trace.py
          python3 tests/unit/test-ia64-hob-transition.py
          python3 tests/unit/test-ia64-rooster-firmware-matrix.py
          python3 tests/unit/test-ia64-pei-compatibility-ladder.py
          python3 -m py_compile \
            scripts/check-ia64-rooster-branch.py \
            scripts/include-ia64-hob-causality.py \
            scripts/analyze-ia64-hob-migration.py \
            scripts/analyze-ia64-hob-write-trace.py \
            scripts/analyze-ia64-hob-register-trace.py \
            scripts/analyze-ia64-hob-dual-trace.py \
            scripts/analyze-ia64-hob-transition.py \
            scripts/run-ia64-rooster-firmware-matrix.py \
            scripts/run-ia64-pei-compatibility-ladder.py

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config python3 \
            libglib2.0-dev libpixman-1-dev libslirp-dev zlib1g-dev

      - name: Build all observational plugins
        run: |
          set -euo pipefail
          bash scripts/build-ia64-hob-write-plugin.sh \
            "$PWD/libia64-hob-write-trace.so"
          bash scripts/build-ia64-hob-register-plugin.sh \
            "$PWD/libia64-hob-write-regs.so"
          bash scripts/build-ia64-hob-dual-plugin.sh \
            "$PWD/libia64-hob-dual-write-trace.so"

      - name: Build normal QEMU and transient causality QEMU
        run: |
          set -euo pipefail
          ./configure \
            --target-list=ia64-softmmu \
            --enable-plugins \
            --disable-docs --disable-gtk --disable-sdl --disable-werror
          ninja -C build qemu-system-ia64
          cp build/qemu-system-ia64 /tmp/qemu-system-ia64-normal
          cp hw/ia64/meson.build /tmp/ia64-meson.build
          python3 scripts/include-ia64-hob-causality.py
          ninja -C build qemu-system-ia64
          test -x build/qemu-system-ia64
          mv /tmp/ia64-meson.build hw/ia64/meson.build
          git diff --check

      - name: Commit the coherent tranche and trigger frontier replays
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'target/ia64: finalize HOB migration diagnostics'
          git fetch origin ia64-rooster-bringup
          git rebase origin/ia64-rooster-bringup
          git push origin HEAD:ia64-rooster-bringup
