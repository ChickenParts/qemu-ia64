name: IA-64 permanent-HOB register frontier

on:
  push:
    branches:
      - ia64-rooster-bringup
    paths:
      - .github/workflows/ia64-hob-register-frontier.yml
      - contrib/plugins/ia64-hob-write-regs.c
      - scripts/build-ia64-hob-register-plugin.sh
      - scripts/analyze-ia64-hob-register-trace.py
      - scripts/fetch-ia64-xen-firmware.sh
      - scripts/run-ia64-firmware.sh
      - tests/ia64/rooster-efi-smoke/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-registers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact bring-up branch
        uses: actions/checkout@v4
        with:
          ref: ia64-rooster-bringup
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential mercurial ninja-build pkg-config python3 \
            libglib2.0-dev libpixman-1-dev libslirp-dev zlib1g-dev

      - name: Build QEMU and register-sampling plugin
        run: |
          set -euo pipefail
          ./configure \
            --target-list=ia64-softmmu \
            --enable-plugins \
            --disable-docs --disable-gtk --disable-sdl --disable-werror
          ninja -C build qemu-system-ia64
          bash scripts/build-ia64-hob-register-plugin.sh \
            "$PWD/build/libia64-hob-write-regs.so"

      - name: Build Rooster payload and canonical Xen firmware
        run: |
          set -euo pipefail
          root="$PWD/scratch/hob-register-frontier"
          mkdir -p "$root/firmware"
          docker run --rm \
            -v "$PWD:/work" -w /work fedora:44 \
            bash -lc '
              set -euo pipefail
              dnf --assumeyes --setopt=install_weak_deps=False install \
                binutils-ia64-linux-gnu coreutils gcc-ia64-linux-gnu git python3
              bash tests/ia64/rooster-efi-smoke/build.sh \
                /work/scratch/hob-register-frontier/payload
            '
          IA64_XEN_FIRMWARE_KEEP_SRC=1 \
            scripts/fetch-ia64-xen-firmware.sh "$root/firmware"
          expected=e143e85874ad57bad631853d48f0d47b7e7dbe6c41b4e558bbb4ea5b45775513
          actual="$(sha256sum "$root/firmware/Flash.fd" | awk '{print $1}')"
          test "$actual" = "$expected"
          printf '%s  Flash.fd\n' "$actual" > "$root/firmware.sha256"

      - name: Capture register samples on HOB-arena stores
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD/scratch/hob-register-frontier"
          esp="$root/esp"
          logs="$root/logs"
          mkdir -p "$esp/EFI/BOOT" "$logs"
          cp "$root/payload/BOOTIA64.EFI" "$esp/EFI/BOOT/BOOTIA64.EFI"
          printf 'fs0:\\EFI\\BOOT\\BOOTIA64.EFI\r\n' > "$esp/startup.nsh"
          printf '{}\n' > "$esp/rooster_config.json"

          set +e
          QEMU_BIN="$PWD/build/qemu-system-ia64" \
          IA64_BIOS="$root/firmware/Flash.fd" IA64_LOGDIR="$logs" \
          IA64_MEM=512M IA64_SMP=1 IA64_DISPLAY=none IA64_GUEST_ERRORS=1 \
          IA64_CALL_NULL_FIX=0 IA64_PEI_SYSMEM_HOB_FIX=1 \
          timeout --signal=TERM --kill-after=5s 180s \
            scripts/run-ia64-firmware.sh -- \
              -drive "file=fat:rw:$esp,format=raw,media=disk,if=ide" \
              -plugin "$PWD/build/libia64-hob-write-regs.so,base=0x040e0000,size=0x20000,limit=512" \
            > "$root/runner.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$root/return-code.txt"
          cat "$root/runner.log" "$logs"/*.log > "$root/combined.log" 2>/dev/null || true

      - name: Infer migration register roles
        run: |
          set -euo pipefail
          root=scratch/hob-register-frontier
          python3 scripts/analyze-ia64-hob-register-trace.py \
            "$root/combined.log" \
            --json "$root/registers.json" \
            --markdown "$root/registers.md" \
            > "$root/analyzer.stdout"
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('scratch/hob-register-frontier')
          report = json.loads((root / 'registers.json').read_text())
          destinations = report.get('destination_pointer_candidates', [])
          sources = report.get('source_pointer_candidates', [])
          counters = report.get('monotonic_counter_candidates', [])
          lines = [
              '## IA-64 permanent-HOB register frontier', '',
              f"- Samples: `{report['sample_count']}`",
              f"- Destination candidates: `{destinations[:4]}`",
              f"- Temporary-source candidates: `{sources[:4]}`",
              f"- Monotonic candidates: `{[item['register'] for item in counters[:8]]}`",
          ]
          with Path('/home/runner/work/_temp/_runner_file_commands/step_summary').open('a') as out:
              out.write('\n'.join(lines) + '\n')
          if not destinations:
              raise SystemExit('register sampling did not expose a destination pointer')
          PY

      - name: Upload register evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia64-hob-register-frontier-${{ github.run_id }}
          path: |
            scratch/hob-register-frontier/firmware.sha256
            scratch/hob-register-frontier/return-code.txt
            scratch/hob-register-frontier/combined.log
            scratch/hob-register-frontier/registers.json
            scratch/hob-register-frontier/registers.md
            scratch/hob-register-frontier/analyzer.stdout
          retention-days: 7
          if-no-files-found: warn
