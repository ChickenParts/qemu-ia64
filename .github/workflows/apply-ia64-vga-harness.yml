name: Apply IA-64 VGA harness patch

on:
  push:
    branches:
      - fix/ia64-rse-return-identity
    paths:
      - .github/workflows/apply-ia64-vga-harness.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ia64-rse-return-identity
          fetch-depth: 0

      - name: Apply and validate harness patch
        shell: bash
        run: |
          set -euo pipefail
          patch=.github/patches/ia64-vga-harness.patch
          git apply --check "$patch"
          git apply "$patch"

          bash -n scripts/run-ia64-firmware.sh
          python3 -m py_compile \
            scripts/run-ia64-rooster-firmware-matrix.py \
            scripts/check-ia64-rooster-branch.py
          python3 scripts/check-ia64-rooster-branch.py

          for required in \
            pc-bios/vgabios-stdvga.bin \
            pc-bios/vgabios-cirrus.bin \
            pc-bios/vgabios-bochs-display.bin \
            pc-bios/vgabios-ati.bin; do
            test -s "$required"
          done

          root="$RUNNER_TEMP/ia64-vga-smoke"
          mkdir -p "$root/bin/pc-bios" "$root/input"
          cp pc-bios/vgabios-stdvga.bin "$root/bin/pc-bios/"
          cat > "$root/bin/qemu-system-ia64" <<'EOF'
          #!/usr/bin/env bash
          exit 0
          EOF
          cat > "$root/fake-runner" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$IA64_LOGDIR"
          printf 'data=%s\n' "${IA64_QEMU_DATA_DIR:-}" > "$IA64_LOGDIR/runner-env.log"
          printf 'argv=%s\n' "$*" >> "$IA64_LOGDIR/runner-env.log"
          printf 'DXE Core Entry\n' > "$IA64_LOGDIR/serial.smoke.log"
          EOF
          chmod +x "$root/bin/qemu-system-ia64" "$root/fake-runner"
          printf payload > "$root/input/BOOTIA64.EFI"
          printf firmware > "$root/input/Flash.fd"

          python3 scripts/run-ia64-rooster-firmware-matrix.py \
            --qemu "$root/bin/qemu-system-ia64" \
            --payload "$root/input/BOOTIA64.EFI" \
            --runner "$root/fake-runner" \
            --out "$root/headless" \
            --timeout 5 \
            "$root/input/Flash.fd"
          python3 scripts/run-ia64-rooster-firmware-matrix.py \
            --qemu "$root/bin/qemu-system-ia64" \
            --payload "$root/input/BOOTIA64.EFI" \
            --runner "$root/fake-runner" \
            --out "$root/display" \
            --timeout 5 \
            --vga std \
            --display none \
            "$root/input/Flash.fd"
          grep -F '"vga": "std"' "$root/display/matrix.json"
          grep -F 'pc-bios' "$root/display/matrix.json"
          grep -F -- '-vga std' "$root/display/runs/Flash.fd/runner-env.log"

      - name: Commit validated result and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/patches/ia64-vga-harness.patch \
            .github/workflows/apply-ia64-vga-harness.yml \
            .github/workflows/ia64-source-snapshot.yml
          rmdir .github/patches 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'scripts/ia64: package VGA ROM data and add display lane'
          git push origin HEAD:fix/ia64-rse-return-identity
