name: IA-64 exact-target non-local return validation

on:
  push:
    branches:
      - fix/ia64-rse-nonlocal-return
    paths:
      - .github/workflows/ia64-rse-nonlocal-return.yml
      - scratch/ia64-rse-nonlocal-return.patch
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ia64-rse-nonlocal-return-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/ia64-rse-nonlocal-return
          fetch-depth: 0

      - name: Install IA-64 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev libslirp-dev

      - name: Apply and validate exact-target repair
        shell: bash
        run: |
          set -euo pipefail
          out=scratch/ci-rse-nonlocal
          mkdir -p "$out"

          patch --dry-run -p1 < scratch/ia64-rse-nonlocal-return.patch \
            > "$out/patch-dry-run.log" 2>&1
          patch -p1 < scratch/ia64-rse-nonlocal-return.patch \
            > "$out/patch-apply.log" 2>&1

          python3 scripts/test-ia64-rse-nonlocal-source.py \
            > "$out/source-test.log" 2>&1
          python3 scripts/test-ia64-pei-sysmem-hob-source.py \
            >> "$out/source-test.log" 2>&1

          ./configure \
            --target-list=ia64-softmmu \
            --disable-werror \
            --disable-docs \
            --disable-gtk \
            --disable-sdl \
            > "$out/configure.log" 2>&1
          ninja -C build qemu-system-ia64 > "$out/build.log" 2>&1

          printf 'firmware\trc\tasserts\tunimpl\thost_abort\n' \
            > "$out/summary.tsv"
          for firmware in stuff/bios130.BIN stuff/rx4610_117B.BIN; do
            stem="$(basename "$firmware")"
            logdir="$out/$stem"
            mkdir -p "$logdir"

            set +e
            IA64_BIOS="$firmware" \
            IA64_LOGDIR="$logdir" \
            IA64_GUEST_ERRORS=1 \
            IA64_EFI_HOB_PATCH=0 \
            IA64_PEI_SYSMEM_HOB_FIX=1 \
              timeout --signal=TERM --kill-after=5s 15s \
                scripts/run-ia64-firmware.sh -- -vga none -nic none \
                > "$logdir/runner.stdout" 2> "$logdir/runner.stderr"
            rc=$?
            set -e

            serial="$(find "$logdir" -maxdepth 1 \
              -name 'serial.fw.*.log' -type f -print | sort | tail -n 1)"
            qlog="$logdir/qemu.fw.log"
            asserts=0
            unimpl=0
            host_abort=0
            if [[ -n "$serial" && -f "$serial" ]]; then
              asserts="$(grep -ac 'ASSERT' "$serial" || true)"
            fi
            if [[ -f "$qlog" ]]; then
              unimpl="$(grep -ac 'IA64 UNIMPL' "$qlog" || true)"
            fi
            host_abort="$(cat "$logdir/runner.stdout" \
              "$logdir/runner.stderr" 2>/dev/null | grep -aEc \
              'Segmentation fault|Aborted|core dumped|qemu-system-ia64:.*assert' \
              || true)"
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$firmware" "$rc" "$asserts" "$unimpl" "$host_abort" \
              | tee -a "$out/summary.tsv"

            [[ "$rc" -eq 0 || "$rc" -eq 124 ]]
            [[ "$host_abort" -eq 0 ]]
          done

          git add -- \
            target/ia64/helper.c \
            scripts/test-ia64-rse-nonlocal-source.py \
            docs/reviews/2026-08-24_ia64_rse_nonlocal_return.md
          git diff --cached --check

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ia64-rse-nonlocal-validation-${{ github.run_id }}
          path: scratch/ci-rse-nonlocal/
          retention-days: 7
          if-no-files-found: error

      - name: Commit validated repair to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'target/ia64: reconcile RSE state on non-local returns'
          git push origin HEAD:fix/ia64-rse-nonlocal-return
