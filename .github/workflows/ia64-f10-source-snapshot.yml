name: IA-64 F10 source snapshot
on:
  push:
    branches: [work/ia64-f10-conversions]
    paths: [.github/workflows/ia64-f10-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source for local verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ia64-source
          git archive --format=tar.gz HEAD > /tmp/ia64-source/source.tar.gz
          git rev-parse HEAD > /tmp/ia64-source/source-head.txt
          sha256sum /tmp/ia64-source/source.tar.gz > /tmp/ia64-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ia64-f10-source
          path: /tmp/ia64-source/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
