name: Temporary IA-64 PAL and ITC diagnostics

on:
  push:
    branches:
      - fix/pal-topology-contracts
    paths:
      - .github/workflows/agent-pal-topology-implementation.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pal-topology-contracts
          fetch-depth: 1

      - name: Print PAL, SAL, and interval-timer model context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          patterns = re.compile(
              r'HELPER\((?:get_itc|set_itc|set_itm)|'
              r'itm_timer|IA64_AR_ITC|IA64_CR_ITM|'
              r'IA64_PAL_FREQ_(?:BASE|RATIOS)|'
              r'IA64_SAL_FREQ_BASE|PAL_FREQ_(?:BASE|RATIOS)|'
              r'SAL_FREQ_BASE')

          for root in (Path('target/ia64'), Path('hw/ia64')):
              for path in sorted(root.rglob('*')):
                  if path.suffix not in {'.c', '.h', '.inc'}:
                      continue
                  lines = path.read_text(errors='replace').splitlines()
                  hits = [i for i, line in enumerate(lines)
                          if patterns.search(line)]
                  if not hits:
                      continue
                  print(f'===== {path} =====')
                  ranges = []
                  for hit in hits:
                      lo = max(0, hit - 16)
                      hi = min(len(lines), hit + 28)
                      if ranges and lo <= ranges[-1][1] + 1:
                          ranges[-1] = (ranges[-1][0],
                                        max(ranges[-1][1], hi))
                      else:
                          ranges.append((lo, hi))
                  for lo, hi in ranges:
                      print(f'--- lines {lo + 1}-{hi} ---')
                      for index in range(lo, hi):
                          print(f'{index + 1:6d}: {lines[index]}')
          PY

      - name: Print PAL unit-test build integration
        shell: bash
        run: |
          grep -n -C 10 'test-ia64-pal\|pal.c' \
            target/ia64/meson.build tests/unit/meson.build || true
