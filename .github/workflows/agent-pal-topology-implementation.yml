name: Temporary IA-64 PAL timing implementation

on:
  push:
    branches:
      - fix/pal-topology-contracts
    paths:
      - .github/workflows/agent-pal-topology-implementation.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ia64-pal-model-contracts
          fetch-depth: 0

      - name: Align PAL frequency contract with virtual time
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = ''''''
          script = gzip.decompress(base64.b64decode(payload))
          Path('/tmp/apply-pal-timing.py').write_bytes(script)
          PY
          python3 /tmp/apply-pal-timing.py

      - name: Check source contract
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('target/ia64/helper.c').read_text()
          pal_h = Path('target/ia64/pal.h').read_text()
          pal = Path('target/ia64/pal.c').read_text()
          gfw = Path('hw/ia64/gfw.c').read_text()
          test = Path('tests/unit/test-ia64-pal.c').read_text()

          assert 'ia64_pal_result_freq_base()' in helper
          assert 'ia64_pal_result_freq_ratios()' in helper
          assert 'uint32_t num = 3;' not in helper
          assert 'IA64_PAL_ITC_RATIO_NUM  10U' in pal_h
          assert 'IA64_PAL_ITC_FREQ_HZ UINT64_C(1000000000)' in pal_h
          assert 'IA64_PAL_ITC_RATIO_NUM' in pal
          assert 'ia64_gfw_refresh_pal_frequency_hobs' in gfw
          assert 'cpu_to_le64(base.v0)' in gfw
          assert '109, 219, 182, 13' not in gfw
          assert '/ia64/pal/frequency-contract' in test
          PY

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Configure, build, and test
        shell: bash
        run: |
          set -euo pipefail
          ./configure --target-list=ia64-softmmu --disable-werror
          ninja -C build \
            qemu-system-ia64 \
            tests/unit/test-ia64-pal \
            tests/unit/test-ia64-interrupt
          build/tests/unit/test-ia64-pal
          build/tests/unit/test-ia64-interrupt

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            hw/ia64/gfw.c \
            target/ia64/helper.c \
            target/ia64/pal.c \
            target/ia64/pal.h \
            tests/unit/test-ia64-pal.c
          git commit -m \
            'target/ia64: align advertised ITC frequency with virtual time'
          git push origin HEAD:fix/ia64-pal-model-contracts
