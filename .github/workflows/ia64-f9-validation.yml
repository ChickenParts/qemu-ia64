name: IA-64 F9 validation
on:
  push:
    branches: [work/ia64-f9-bitops]
    paths: [.github/workflows/ia64-f9-validation.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p scratch/f9-inputs
          git archive --format=tar.gz HEAD target/ia64 scripts tests/ia64/isa docs/generated/ia64-instruction-coverage.md .github/workflows/ia64-isa-coverage.yml > scratch/f9-inputs/source.tar.gz
          git rev-parse HEAD > scratch/f9-inputs/source-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ia64-f9-inputs
          path: scratch/f9-inputs/
          retention-days: 7
          if-no-files-found: error
