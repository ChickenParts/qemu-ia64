name: Temporary IA-64 null-call disassembly

on:
  push:
    branches:
      - ia64-rooster-bringup
    paths:
      - .github/workflows/ia64-null-call-disasm.yml

permissions:
  contents: read

jobs:
  disassemble:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 15
    steps:
      - name: Install IA-64 binutils
        shell: bash
        run: |
          set -euo pipefail
          dnf --assumeyes --setopt=install_weak_deps=False install \
            binutils-ia64-linux-gnu coreutils

      - name: Reconstruct and disassemble captured DXE code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > evidence/code.b64 <<'EOF'
          
          EOF
          tr -d '[:space:]' < evidence/code.b64 | base64 -d > evidence/code.bin
          test "$(stat -c '%s' evidence/code.bin)" = 1024
          ia64-linux-gnu-objdump -D -b binary -m ia64 \
            --adjust-vma=0x1ff4f300 \
            --start-address=0x1ff4f3c0 \
            --stop-address=0x1ff4f560 \
            evidence/code.bin | tee evidence/disassembly.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: ia64-null-call-disassembly-${{ github.run_id }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
