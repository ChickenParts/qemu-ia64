name: Apply IA-64 RSE stack-switch repair

on:
  push:
    branches:
      - fix/ia64-rse-return-identity
    paths:
      - .github/workflows/ia64-rse-stack-switch-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ia64-rse-stack-switch-apply
  cancel-in-progress: false

jobs:
  apply-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out active bring-up branch
        uses: actions/checkout@v4
        with:
          ref: fix/ia64-rse-return-identity
          fetch-depth: 0

      - name: Reassemble and apply architectural patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/ia64-rse-stack-switch/part-* \
            > /tmp/ia64-rse-stack-switch.patch
          echo 'd88a0b5292ede69923fd52423503b7b5381003752f2e40fe27b6e55c28b55a7f  /tmp/ia64-rse-stack-switch.patch' \
            | sha256sum --check -
          git apply --check /tmp/ia64-rse-stack-switch.patch
          git apply /tmp/ia64-rse-stack-switch.patch
          git diff --check
          scripts/checkpatch.pl \
            --no-tree --no-signoff --patch \
            /tmp/ia64-rse-stack-switch.patch
          python3 scripts/check-ia64-rooster-branch.py

      - name: Install emulator dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config python3 \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Build IA-64 emulator and RSE unit suite
        shell: bash
        run: |
          set -euo pipefail
          ./configure \
            --target-list=ia64-softmmu \
            --enable-plugins \
            --disable-slirp \
            --disable-docs --disable-gtk --disable-sdl --disable-werror
          ninja -C build -j"$(nproc)" \
            qemu-system-ia64 \
            tests/unit/test-ia64-rse
          build/tests/unit/test-ia64-rse | tee rse-stack-switch.tap
          python3 scripts/check-ia64-rooster-branch.py

      - name: Verify framebuffer option-ROM inputs
        shell: bash
        run: |
          set -euo pipefail
          for rom in \
            vgabios-stdvga.bin \
            vgabios-cirrus.bin \
            vgabios-bochs-display.bin \
            vgabios-ati.bin; do
            test -s "pc-bios/$rom"
          done
          strings build/qemu-system-ia64 \
            | grep -Fx 'vgabios-stdvga.bin' >/dev/null

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ia64-rse-stack-switch-validation-${{ github.run_id }}
          path: rse-stack-switch.tap
          retention-days: 14
          if-no-files-found: error

      - name: Commit repair and remove one-shot assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/patches/ia64-rse-stack-switch
          rm .github/workflows/ia64-rse-stack-switch-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'target/ia64: restore nonlocal RSE frames by BSP identity'
          git fetch origin fix/ia64-rse-return-identity
          git rebase origin/fix/ia64-rse-return-identity
          git push origin HEAD:fix/ia64-rse-return-identity
