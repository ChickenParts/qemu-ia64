name: IA-64 source and firmware-analysis export

on:
  push:
    branches:
      - fix/ia64-rse-nonlocal-return
    paths:
      - .github/workflows/ia64-source-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/ia64-rse-nonlocal-return
          fetch-depth: 1

      - name: Install IA-64 firmware-analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-multiarch

      - name: Export complete source tree
        shell: bash
        run: |
          set -euo pipefail
          out=scratch/ci-ia64-export
          mkdir -p "$out/toolchain/lib"
          tar \
            --exclude=.git \
            --exclude=build \
            --exclude="$out" \
            -czf "$out/qemu-ia64-source.tar.gz" .

          for tool in objdump objcopy readelf; do
            path="$(command -v "$tool")"
            cp "$path" "$out/toolchain/$tool"
            ldd "$path" | awk '/=> \/|^\// { for (i=1; i<=NF; i++) if ($i ~ /^\//) print $i }'
          done | sort -u > "$out/toolchain/linked-libraries.txt"
          while IFS= read -r lib; do
            test -f "$lib" || continue
            cp -L "$lib" "$out/toolchain/lib/"
          done < "$out/toolchain/linked-libraries.txt"
          objdump -i > "$out/toolchain/objdump-targets.txt"

          sha256sum "$out/qemu-ia64-source.tar.gz" \
            "$out/toolchain/objdump" "$out/toolchain/objcopy" \
            "$out/toolchain/readelf" > "$out/SHA256SUMS"

      - name: Build Tiano firmware decompressor
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/scratch/ci-ia64-export"
          git clone --depth 1 https://github.com/tianocore/edk2.git /tmp/edk2
          make -C /tmp/edk2/BaseTools/Source/C/Common
          make -C /tmp/edk2/BaseTools/Source/C/TianoCompress
          tool="$(find /tmp/edk2/BaseTools -type f -name TianoCompress \
            -perm -111 -print | head -n 1)"
          test -n "$tool"
          cp "$tool" "$out/TianoCompress"
          "$out/TianoCompress" 2>&1 | head -n 80 \
            > "$out/TianoCompress-help.txt" || true
          sha256sum "$out/TianoCompress" >> "$out/SHA256SUMS"

      - name: Upload source and analysis tools
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia64-source-export-${{ github.run_id }}
          path: scratch/ci-ia64-export/
          retention-days: 1
          if-no-files-found: error
