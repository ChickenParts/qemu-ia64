name: IA-64 PAL source snapshot

on:
  push:
    branches:
      - fix/ia64-rse-nonlocal-return
    paths:
      - .github/workflows/ia64-source-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/ia64-rse-nonlocal-return

      - name: Capture PAL dispatcher and stub sources
        shell: bash
        run: |
          set -euo pipefail
          out=scratch/ci-ia64-source
          mkdir -p "$out/target/ia64" "$out/hw/ia64" "$out/include/hw/ia64"
          cp target/ia64/helper.c "$out/target/ia64/"
          cp target/ia64/cpu.h "$out/target/ia64/"
          cp hw/ia64/ipf.c "$out/hw/ia64/"
          cp hw/ia64/gfw.h "$out/hw/ia64/"
          if [[ -f include/hw/ia64/gfw.h ]]; then
            cp include/hw/ia64/gfw.h "$out/include/hw/ia64/"
          fi
          grep -RIn -E \
            'IA64_IPF_FW_PAL|HELPER\(fw_pal\)|PAL_COPY|break[[:space:]]+0|0x100000' \
            target/ia64 hw/ia64 include/hw/ia64 2>/dev/null \
            > "$out/pal-symbols.txt" || true
          sha256sum \
            target/ia64/helper.c target/ia64/cpu.h hw/ia64/ipf.c hw/ia64/gfw.h \
            > "$out/source.sha256"

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ia64-pal-source-${{ github.run_id }}
          path: scratch/ci-ia64-source/
          retention-days: 1
          if-no-files-found: error
