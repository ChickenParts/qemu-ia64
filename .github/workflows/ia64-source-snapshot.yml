name: IA-64 source snapshot

on:
  push:
    branches:
      - fix/ia64-rse-return-identity
    paths:
      - .github/workflows/ia64-source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Archive IA-64 bring-up sources
        run: |
          set -euxo pipefail
          tar -czf ia64-source-snapshot.tar.gz \
            target/ia64 \
            hw/ia64 \
            tests/unit/test-ia64-rse.c \
            scripts/run-ia64-firmware.sh \
            scripts/run-ia64-rooster-firmware-matrix.py \
            scripts/check-ia64-rooster-branch.py \
            docs/ia64-environment-variables.md \
            docs/ia64-rooster-efi.md \
            meson.build \
            tests/unit/meson.build
      - uses: actions/upload-artifact@v4
        with:
          name: ia64-source-snapshot
          path: ia64-source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
