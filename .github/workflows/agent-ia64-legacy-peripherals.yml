name: Temporary IA-64 legacy peripheral validation

on:
  push:
    branches:
      - stage/ia64-legacy-peripherals
    paths:
      - scratch/ia64-legacy-peripherals.patch
      - .github/workflows/agent-ia64-legacy-peripherals.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_COMMIT: f9cfddc8974fb1fc71b24d8faf1362cdb240376a
      OUTPUT_BRANCH: fix/ia64-legacy-peripherals
      PATCH_FILE: scratch/ia64-legacy-peripherals.patch
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the legacy peripheral port
        shell: bash
        run: |
          set -euo pipefail
          cp "$PATCH_FILE" /tmp/ia64-legacy-peripherals.patch
          git checkout --detach "$BASE_COMMIT"
          git apply --check /tmp/ia64-legacy-peripherals.patch
          git apply /tmp/ia64-legacy-peripherals.patch
          git diff --check
          perl scripts/checkpatch.pl --no-signoff --strict \
            /tmp/ia64-legacy-peripherals.patch

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev libslirp-dev

      - name: Configure IA-64 system emulator
        run: |
          ./configure \
            --target-list=ia64-softmmu \
            --disable-werror \
            --disable-docs \
            --disable-gtk \
            --disable-sdl

      - name: Build IA-64 and contract tests
        run: |
          ninja -C build \
            qemu-system-ia64 \
            tests/unit/test-ia64-interrupt \
            tests/unit/test-ia64-iosapic \
            tests/qtest/ia64-ipf-test

      - name: Run architecture and platform contracts
        shell: bash
        run: |
          set -euo pipefail
          build/tests/unit/test-ia64-interrupt --tap -k \
            | tee /tmp/test-ia64-interrupt.tap
          build/tests/unit/test-ia64-iosapic --tap -k \
            | tee /tmp/test-ia64-iosapic.tap
          QTEST_QEMU_BINARY=./build/qemu-system-ia64 \
            build/tests/qtest/ia64-ipf-test --tap -k \
            | tee /tmp/ia64-ipf-test.tap
          grep -q 'ok .*legacy-peripherals' /tmp/ia64-ipf-test.tap

      - name: Publish one clean tested commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            configs/devices/ia64-softmmu/default.mak \
            hw/ia64/ipf.c \
            tests/qtest/ia64-ipf-test.c
          git diff --cached --check
          git commit \
            -m 'hw/ia64: port floppy and parallel peripherals' \
            -m 'Instantiate the current ISA floppy controller and configured parallel ports on the PIIX4 ISA bus, derive CMOS floppy data from the realized controller, and cover both through the IA-64 sparse legacy-I/O window.'
          git push --force origin "HEAD:refs/heads/$OUTPUT_BRANCH"
          git rev-parse HEAD | tee /tmp/ia64-legacy-peripherals-commit.txt

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ia64-legacy-peripherals-result
          path: |
            /tmp/ia64-legacy-peripherals-commit.txt
            /tmp/test-ia64-interrupt.tap
            /tmp/test-ia64-iosapic.tap
            /tmp/ia64-ipf-test.tap
          retention-days: 1
          if-no-files-found: error
