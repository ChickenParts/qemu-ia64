name: IA-64 B5 legality source transform once

on:
  push:
    branches: [work/ia64-b5-indirect-call-legality]
    paths: [.github/workflows/ia64-b5-legality-apply-once.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ia64-b5-indirect-call-legality
          fetch-depth: 0
      - name: Apply exact source transform and reviewed snapshot
        run: |
          set -euo pipefail
          python3 scripts/apply-ia64-b5-legality.py
          python3 scripts/ia64-nonf-fallback-audit.py --record
          git diff --check
          cc -std=gnu2x -O2 -Wall -Wextra -Werror \
            -o /tmp/b5-policy tests/ia64/nonf/b5-policy-test.c
          /tmp/b5-policy
          python3 -m unittest discover -s tests/ia64/nonf -p 'test_*.py' -v
      - name: Commit production transform
        run: |
          set -euo pipefail
          git rm .github/workflows/ia64-b5-legality-apply-once.yml \
                 scripts/apply-ia64-b5-legality.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add target/ia64/helper.c target/ia64/helper.h target/ia64/translate.c \
                  tests/ia64/nonf/fallback-baseline.json5 \
                  docs/generated/ia64-nonf-fallbacks.md
          git commit -m 'target/ia64: fault reserved B5 hint values before predication'
          git push origin HEAD:work/ia64-b5-indirect-call-legality
