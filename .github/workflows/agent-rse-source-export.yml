name: IA-64 RSE source export

on:
  push:
    branches:
      - agent/ia64-xen-dev-firmware-boot
    paths:
      - .github/workflows/agent-rse-source-export.yml
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/agent-rse-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Package live IA-64 sources
        shell: bash
        run: |
          set -euo pipefail
          git ls-files \
            target/ia64/helper.c \
            target/ia64/helper.h \
            target/ia64/cpu.h \
            target/ia64/translate.c \
            target/ia64/meson.build \
            hw/ia64 \
            scripts/run-ia64-firmware.sh \
            scripts/ia64-qmp-sample.py \
            .github/workflows/ia64-firmware-bringup.yml \
            > ia64-rse-source-files.txt
          test -s ia64-rse-source-files.txt
          tar -czf ia64-rse-source.tar.gz -T ia64-rse-source-files.txt

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: ia64-rse-source-${{ github.sha }}
          path: |
            ia64-rse-source.tar.gz
            ia64-rse-source-files.txt
          retention-days: 1
          if-no-files-found: error
