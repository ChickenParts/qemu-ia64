name: Apply IA-64 RSE core patch

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/agent-rse-source-export.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ia64-rse-core-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/ia64-xen-dev-firmware-boot
          fetch-depth: 0

      - name: Apply and validate core patch
        shell: bash
        run: |
          set -euo pipefail
          patch=scripts/patches/ia64-rse-core.patch
          git apply --check "$patch"
          git apply "$patch"
          python3 -m py_compile scripts/ia64-rse-trace-check.py
          git diff --check
          git rm -- "$patch"

      - name: Commit integration-branch update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- target/ia64/helper.c scripts/ia64-rse-trace-check.py
          git commit -m 'target/ia64: correct RSE frame and LOADRS accounting'
          git push origin HEAD:agent/ia64-xen-dev-firmware-boot
