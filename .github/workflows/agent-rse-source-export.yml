name: IA-64 RSE source export

on:
  push:
    branches:
      - agent/ia64-xen-dev-firmware-boot
    paths:
      - .github/workflows/agent-rse-source-export.yml
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/agent-rse-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out live integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/ia64-xen-dev-firmware-boot

      - name: Package full branch source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee qemu-ia64-source.sha
          git archive --format=tar.gz --output=qemu-ia64-source.tar.gz HEAD

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: qemu-ia64-source-${{ github.sha }}
          path: |
            qemu-ia64-source.tar.gz
            qemu-ia64-source.sha
          retention-days: 1
          if-no-files-found: error
