name: One-use F9 source validation
on:
  push:
    branches: [work/ia64-f9-bitops]
    paths: [.github/workflows/ia64-f9-materialize.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'ChickenParts/qemu-ia64' && github.ref == 'refs/heads/work/ia64-f9-bitops'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install build and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils-ia64-linux-gnu libglib2.0-dev \
            libpixman-1-dev ninja-build pkg-config python3 python3-venv zlib1g-dev
          python3 -m venv /tmp/f9-venv
          /tmp/f9-venv/bin/pip install -r tests/ia64/isa/requirements.txt
      - name: Apply only the hash-guarded reviewed source edits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scratch/f9-evidence
          /tmp/f9-venv/bin/python .github/f9-tranche.apply.py
          /tmp/f9-venv/bin/python scripts/ia64-isa-coverage.py --check --assembler \
            --evidence-dir scratch/f9-evidence \
            --output scratch/f9-evidence/observations.json5
          /tmp/f9-venv/bin/python -m unittest discover -s tests/ia64/isa -p 'test_*.py' -v \
            2>&1 | tee scratch/f9-evidence/host-tests.txt
          git diff --check
          git diff --binary > scratch/f9-evidence/reviewed-source.patch
      - name: Build actual QEMU
        shell: bash
        run: |
          set -euo pipefail
          mkdir build-f9
          (cd build-f9; ../configure --target-list=ia64-softmmu \
            --disable-docs --disable-gtk --disable-sdl --disable-vnc \
            --disable-slirp --disable-werror)
          ninja -C build-f9 -j"$(nproc)" qemu-system-ia64
      - name: Run F9 and previous F-slot guests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run-ia64-f9-tests.py --qemu build-f9/qemu-system-ia64 \
            --out scratch/f9-evidence/guest
          QEMU_BIN="$PWD/build-f9/qemu-system-ia64" \
          IA64_AS=ia64-linux-gnu-as IA64_LD=ia64-linux-gnu-ld \
          IA64_FSLOT_LOGDIR=scratch/f9-evidence/previous-fslot/logs \
          IA64_FSLOT_OUTDIR=scratch/f9-evidence/previous-fslot/out \
            bash scripts/run-ia64-fslot-tests.sh 3s
      - name: Commit tested ordinary sources without rewriting the branch
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=work/ia64-f9-bitops
          remote_head="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git add target/ia64/translate.c target/ia64/helper.c target/ia64/helper.h \
            target/ia64/cpu.h scripts/ia64-isa-coverage.py \
            tests/ia64/isa/test_coverage.py tests/ia64/isa/coverage.json5 \
            tests/ia64/isa/f-unit-baseline.json5 docs/generated/ia64-instruction-coverage.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'target/ia64: implement all F9 bit operations and verify raw register results' \
            -m 'Integer-only 82-bit/packed operations, NaTVal propagation, rotating accessors, and PSR dirty state. Validated with 40 host tests, 2097 GNU encoding vectors, 4256 raw-FR guest cases, and the previous F-slot regression. Shared disabled-FP fault work remains #10. Related: #7 #9 #10 #11.'
          git push origin "HEAD:refs/heads/$branch"
      - name: Record executable and exact source
        if: always()
        shell: bash
        run: |
          mkdir -p scratch/f9-evidence
          git rev-parse HEAD > scratch/f9-evidence/source-head.txt
          git diff --binary > scratch/f9-evidence/uncommitted.patch
          if test -f build-f9/qemu-system-ia64; then
            cp build-f9/qemu-system-ia64 scratch/f9-evidence/
            sha256sum build-f9/qemu-system-ia64 > scratch/f9-evidence/qemu-sha256.txt
          fi
          tar -czf scratch/f9-evidence/tested-sources.tar.gz target/ia64 \
            scripts/ia64-isa-coverage.py scripts/run-ia64-f9-tests.py \
            tests/ia64/isa docs/generated/ia64-instruction-coverage.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ia64-f9-materialized-${{ github.run_id }}
          path: scratch/f9-evidence/
          retention-days: 14
          if-no-files-found: error
